name: Domestic Archive Betting Rehydrate

on:
  push:
    branches:
      - main
    paths:
      - ".github/domestic-archive-rehydrate-request"

permissions:
  contents: write

concurrency:
  # Serialize every workflow that writes canonical StatMaker main data.
  # One running writer at a time prevents manifest/data rebase collisions.
  group: statmaker-canonical-main-writer
  cancel-in-progress: false

jobs:
  rehydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate offline rehydration code
        run: |
          python -m py_compile \
            scripts/run_domestic_stats_refresh.py \
            scripts/repair_domestic_api_football_league_ids.py \
            scripts/repair_domestic_team_aliases_from_schedule.py \
            scripts/rehydrate_domestic_betting_from_archive.py \
            scripts/odds_market_integrity.py \
            scripts/build_domestic_proposal_readiness.py \
            scripts/build_statmaker_update_manifest.py \
            scripts/reattach_domestic_match_context.py \
            scripts/refresh_domestic_lineups.py \
            scripts/refresh_domestic_squads.py
          python -m unittest \
            tests/test_domestic_stats_completeness.py \
            tests/test_repair_domestic_api_football_league_ids.py \
            tests/test_repair_domestic_team_aliases_from_schedule.py \
            tests/test_odds_market_integrity.py \
            tests/test_rehydrate_domestic_betting_from_archive.py \
            tests/test_domestic_proposal_readiness.py \
            tests/test_statmaker_update_manifest.py

      - name: Repair exact API-Football league identities
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_DAILY_RESERVE: "1500"
        run: |
          python scripts/repair_domestic_api_football_league_ids.py \
            --max-requests 10

      - name: Capture corrected league identities
        id: league_identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              Path("reports/domestic_api_football_league_identity_repair.json").read_text(encoding="utf-8")
          )
          repair_rows = list(report.get("repairs", []) or [])
          stale_rows = list(report.get("staleStatsCaches", []) or [])
          codes = sorted({
              str(row.get("leagueCode") or "").strip().upper()
              for row in [*repair_rows, *stale_rows]
              if str(row.get("leagueCode") or "").strip()
          })
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"corrected_codes={','.join(codes)}\n")
          print(f"Corrected API-Football league identities: {codes}")
          PY

      - name: Repair authoritative current Domestic rosters
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_DAILY_RESERVE: "1500"
        run: |
          # Roster-only mode performs no stats/history backfill. It first rebuilds
          # from existing exact target-season caches (zero calls), then uses at most
          # one exact league+season request per still-missing league.
          python scripts/run_domestic_stats_refresh.py \
            --max-requests 600 \
            --roster-only

      - name: Rebuild corrected Domestic statistics
        if: steps.league_identity.outputs.corrected_codes != ''
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_DAILY_RESERVE: "1500"
        run: |
          python scripts/run_domestic_stats_refresh.py \
            --league-codes "${{ steps.league_identity.outputs.corrected_codes }}" \
            --max-requests 300 \
            --skip-roster-discovery

      - name: Rebuild app statistics after league identity correction
        if: steps.league_identity.outputs.corrected_codes != ''
        run: |
          python scripts/expand_domestic_full_stats.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import domestic_live_july_pipeline as pipeline
          registry = pipeline.load_json(pipeline.REGISTRY_PATH, {}).get('leagues', [])
          if not registry:
              raise SystemExit('Domestic Stats registry is empty')
          pipeline.build_roster_catalog(registry)
          pipeline.build_app_statistics(registry)
          PY
          python scripts/finalize_domestic_live_july_artifacts.py
          python scripts/build_domestic_live_july_normalized_stats.py
          python scripts/build_uefa_support_history.py

      - name: Validate current Domestic feed
        run: python scripts/odds_market_integrity.py odds/odds_api_io/domestic_odds.json

      - name: Rehydrate exact archived betting markets
        run: python scripts/rehydrate_domestic_betting_from_archive.py

      - name: Learn verified provider aliases from exact API-Football fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_DAILY_RESERVE: "1500"
        run: |
          python scripts/repair_domestic_team_aliases_from_schedule.py \
            --max-requests 30

      - name: Rehydrate exact archived betting markets after alias repair
        run: python scripts/rehydrate_domestic_betting_from_archive.py

      - name: Sanitize exact Domestic betting markets
        run: |
          python scripts/odds_market_integrity.py \
            odds/odds_api_io/domestic_odds.json \
            --write \
            --report-dir reports

      - name: Restore cached match context
        run: |
          python scripts/reattach_domestic_match_context.py
          python scripts/refresh_domestic_lineups.py --attach-only
          python scripts/refresh_domestic_squads.py --attach-only

      - name: Build market-specific proposal readiness
        run: python scripts/build_domestic_proposal_readiness.py

      - name: Commit offline Domestic feed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            config/domestic_leagues.json \
            config/api_football_enrichment_leagues.json \
            config/nordic_extra_leagues.json \
            config/july_extra_leagues_2026.json \
            data/statmaker/domestic_live_july_registry.json \
            data/api_football/fixture_stats \
            data/api_football/domestic_normalized_fixture_stats.json \
            data/statmaker/domestic_enriched \
            data/statmaker/uefa_support_history.json \
            odds/odds_api_io/domestic_odds.json \
            data/statmaker/domestic_rosters.json \
            mappings/domestic_team_aliases.json \
            data/statmaker/domestic_proposal_readiness.json \
            data/statmaker/domestic_match_context_cache.json \
            reports/domestic_archive_betting_rehydrate.json \
            reports/domestic_api_football_league_identity_repair.json \
            reports/domestic_live_july_stats_refresh.json \
            reports/domestic_team_alias_schedule_repair.json \
            reports/domestic_odds_integrity.json \
            reports/domestic_proposal_readiness.json \
            reports/domestic_lineup_watch.json \
            reports/domestic_squad_context.json
          if git diff --cached --quiet; then
            echo "No archive betting rehydration changes."
          else
            git commit -m "Rehydrate Domestic betting from exact provider archive"
            git pull --rebase --autostash origin main
            python scripts/build_statmaker_update_manifest.py \
              --profile main \
              --branch main \
              --output data/statmaker/update_manifest.json
            git add data/statmaker/update_manifest.json
            if ! git diff --cached --quiet; then
              git commit -m "Rebuild main manifest after archive betting rehydrate"
            fi
            git push origin HEAD:main
          fi
