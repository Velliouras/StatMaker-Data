name: Update Pinnacle World Cup Odds

on:
  workflow_dispatch:
  schedule:
    # Once per day. This is pre-match odds data, not live odds scraping.
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  update-pinnacle-wc-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Scrape Pinnacle World Cup odds
        run: python scripts/scrape_pinnacle_wc_odds.py

      - name: Commit Pinnacle odds if changed
        run: |
          if git diff --quiet -- odds/pinnacle/world_cup_odds.json odds/pinnacle/debug_report.json odds/pinnacle/pinnacle_probe_snapshot.txt; then
            echo "No Pinnacle odds changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds/pinnacle/world_cup_odds.json odds/pinnacle/debug_report.json odds/pinnacle/pinnacle_probe_snapshot.txt
          git commit -m "Update Pinnacle World Cup odds"
          git push
