name: App-Ready Betting Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/app-ready-diagnostics-request"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Inspect current App-Ready betting DB
        shell: bash
        run: |
          python - <<'PY'
          import json, sqlite3, zipfile
          from pathlib import Path
          from datetime import date, timedelta

          manifest = json.loads(Path("data/statmaker/app_ready/update_manifest.json").read_text())
          betting = next(a for a in manifest["artifacts"] if a["id"] == "app_ready_betting_bundle")
          bundle = Path(betting["path"])
          print("DIAG_MANIFEST", manifest.get("generatedAt"), manifest.get("contentVersion"))
          print("DIAG_BUNDLE", bundle, bundle.stat().st_size)

          out = Path("/tmp/statmaker-app-ready-diag")
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(bundle) as zf:
              db_name = next(n for n in zf.namelist() if n.endswith("statmaker_prepared_betting.db"))
              zf.extract(db_name, out)
          db_path = out / db_name
          con = sqlite3.connect(db_path)
          con.row_factory = sqlite3.Row

          tables = [r[0] for r in con.execute("select name from sqlite_master where type='table' order by name")]
          start = date(2026,10,6)
          end = start + timedelta(days=7)

          all7 = con.execute("""
            select count(*) rows, count(distinct match_key) matches,
                   count(distinct case when recommendation_eligible=1 then match_key end) eligible_matches
            from prepared_pattern_candidates
            where local_date>=? and local_date<?
          """,(start.isoformat(),end.isoformat())).fetchone()
          print("DIAG_7D_CANDIDATES", dict(all7))

          chn_fixtures = con.execute("""
            select match_key, local_date, home_team, away_team, provider_home_team, provider_away_team,
                   canonical_home_team, canonical_away_team, team_mapping_status, usable_for_stats
            from prepared_fixture_matches
            where league_code='CHN' and local_date>=? and local_date<?
            order by local_date, match_key
          """,(start.isoformat(),end.isoformat())).fetchall()

          for f in chn_fixtures:
              mk=f["match_key"]
              cand=con.execute("select count(*) from prepared_pattern_candidates where match_key=?",(mk,)).fetchone()[0]
              sels=con.execute("select count(*) from prepared_selections where match_key=?",(mk,)).fetchone()[0]
              markets=con.execute("select count(*) from prepared_fixture_markets where match_key=?",(mk,)).fetchone()[0]
              pm=con.execute("select count(*) from prepared_matches where match_key=?",(mk,)).fetchone()[0]
              sims=con.execute("select count(*) from prepared_simulations where match_key=?",(mk,)).fetchone()[0]
              mex=con.execute("select count(*) from prepared_match_explorer_simulations where match_key=?",(mk,)).fetchone()[0]
              ms=con.execute("select count(*) from prepared_match_simulations where match_key=?",(mk,)).fetchone()[0]
              print("DIAG_CHN_MATCH", json.dumps({
                **dict(f),
                "fixture_markets":markets,
                "prepared_matches":pm,
                "prepared_selections":sels,
                "pattern_candidates":cand,
                "prepared_simulations":sims,
                "explorer_simulations":mex,
                "match_simulation_rows":ms
              }, ensure_ascii=False, sort_keys=True))

          # Per-match reason profile for rows that did materialize.
          rows=con.execute("""
            select match_key,
                   count(*) rows,
                   min(selection_odd) min_odd,
                   max(selection_odd) max_odd,
                   max(strict_hit_rate) max_hit,
                   max(strict_sample) max_sample,
                   sum(case when value_tier is not null then 1 else 0 end) value_rows,
                   sum(case when recommendation_eligible=1 then 1 else 0 end) eligible_rows
            from prepared_pattern_candidates
            where league_code='CHN' and local_date>=? and local_date<?
            group by match_key order by match_key
          """,(start.isoformat(),end.isoformat())).fetchall()
          for r in rows:
              print("DIAG_CHN_PROFILE", dict(r))

          # Show the exact five CHN fixtures that are present in fixture index but absent from candidates.
          fixture_keys={r["match_key"] for r in chn_fixtures}
          candidate_keys={r[0] for r in con.execute("""
            select distinct match_key from prepared_pattern_candidates
            where league_code='CHN' and local_date>=? and local_date<?
          """,(start.isoformat(),end.isoformat()))}
          for mk in sorted(fixture_keys-candidate_keys):
              print("DIAG_CHN_MISSING_CANDIDATE", mk)

          print("DIAG_PATTERN_SCHEMA", [
              dict(r) for r in con.execute("pragma table_info(prepared_pattern_candidates)")
          ])
          print("DIAG_SELECTION_SCHEMA", [
              dict(r) for r in con.execute("pragma table_info(prepared_selections)")
          ])

          ledger_path = Path("data/statmaker/canonical_recommendation_ledger.json")
          if ledger_path.is_file():
              ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
              print("DIAG_LEDGER_TYPE", type(ledger).__name__)
              if isinstance(ledger, dict):
                  print("DIAG_LEDGER_KEYS", sorted(ledger.keys()))
                  for key, value in ledger.items():
                      if isinstance(value, list):
                          print("DIAG_LEDGER_LIST", key, len(value))
                          if value:
                              sample=value[0]
                              print("DIAG_LEDGER_SAMPLE", key, json.dumps(sample, ensure_ascii=False, sort_keys=True)[:6000])
                      elif isinstance(value, dict):
                          print("DIAG_LEDGER_DICT", key, sorted(value.keys())[:50])
                      else:
                          print("DIAG_LEDGER_SCALAR", key, value)

          con.close()
          PY
