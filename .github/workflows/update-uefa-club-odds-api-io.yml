name: Update UEFA Club Exact Odds

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches:
      - main
    paths:
      - "config/uefa_club_competitions.json"
      - "scripts/update_uefa_club_odds_api_io.py"
      - "tests/test_uefa_club_odds_api_io.py"
      - ".github/workflows/update-uefa-club-odds-api-io.yml"

permissions:
  contents: write

concurrency:
  group: update-uefa-club-exact-odds
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test UEFA club odds contract
        run: |
          python -m unittest tests/test_uefa_club_odds_api_io.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import odds_api_io_market_audit as audit
          print(audit.run_market_audit_self_check())
          PY

      - name: Refresh Champions League and Europa League odds
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDS_API_IO_BOOKMAKERS: ${{ vars.ODDS_API_IO_BOOKMAKERS || 'Bet365,Unibet' }}
        run: python scripts/update_uefa_club_odds_api_io.py

      - name: Validate exact odds and canonical mapping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('odds/odds_api_io/champions_league_odds.json'),
              Path('odds/odds_api_io/europa_league_odds.json'),
          ]
          for path in paths:
              payload = json.loads(path.read_text(encoding='utf-8'))
              for match in payload.get('matches', []) or []:
                  if match.get('teamMappingStatus') != 'matched' or match.get('usableForStats') is not True:
                      raise SystemExit(f'Unmapped UEFA match in {path}')
                  if not match.get('canonicalHomeTeam') or not match.get('canonicalAwayTeam'):
                      raise SystemExit(f'Missing canonical team in {path}')
                  for market in match.get('markets', []) or []:
                      if market.get('exactBookmakerOdds') is not True or not market.get('bookmaker'):
                          raise SystemExit(f'Non-exact UEFA market in {path}')
          print('UEFA club exact-odds contracts valid')
          PY

      - name: Commit refreshed UEFA club odds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            odds/odds_api_io/champions_league_odds.json \
            odds/odds_api_io/europa_league_odds.json \
            reports/champions_league_odds_debug.json \
            reports/europa_league_odds_debug.json \
            reports/uefa_club_odds_refresh.json
          if git diff --cached --quiet; then
            echo "No UEFA club odds changes to commit."
          else
            git commit -m "Refresh UEFA club exact odds"
            git push origin HEAD:main
          fi
