name: Market Watch Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  workflow_run:
    workflows: ['Shots SOT UAT Feed', 'Betting V2 Forward Market First Counts']
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/triggers/market-watch']
permissions:
  contents: write
concurrency:
  group: statmaker-shots-uat
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing numerical runtime
        run: python -m pip install --quiet catboost==1.2.8 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Verify decisions and freeze rolling paper forecasts
        run: |
          python -m unittest scripts.market_watch.test_policy -v
          python -m scripts.market_watch.paper
      - name: Publish frozen paper forecasts before recording timing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/market_watch/count_paper_v1
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze rolling Market Watch paper predictions before kickoff'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify publication timing and update monitoring
        run: |
          python -m scripts.market_watch.paper --record-publication
          python -m scripts.market_watch.build
      - name: Save dashboard and decision history without Actions artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/market_watch/count_paper_v1 data/statmaker/uat/market_watch data/statmaker/uat/shots_v1 docs/market-watch docs/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Update Market Watch decisions and dashboard from cached outcomes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
