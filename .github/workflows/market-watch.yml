name: Market Watch Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  workflow_run:
    workflows: ['Shots SOT UAT Feed', 'Betting V2 Forward Market First Counts']
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/triggers/market-watch', '.github/workflows/market-watch.yml', 'scripts/market_watch/build.py', 'scripts/market_watch/test_refresh.py']
permissions:
  contents: write
concurrency:
  group: statmaker-shots-uat
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify shallow-checkout publication recovery
        run: python -m unittest discover -s tests -p test_generated_publication.py -v
      - name: Install existing numerical runtime
        run: python -m pip install --quiet catboost==1.2.8 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Verify UAT selection and update monitoring of issued predictions
        run: |
          python -m unittest scripts.market_watch.test_policy scripts.market_watch.test_catalog scripts.market_watch.test_recommend scripts.market_watch.test_refresh scripts.shots_uat.test_production scripts.shots_uat.test_repricing scripts.shots_uat.test_daily -v
          python -m scripts.market_watch.build
          python -m scripts.shots_uat.publish_production
      - name: Save dashboard and decision history without Actions artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/statmaker/uat/market_watch data/statmaker/uat/shots_v1 data/statmaker/betting_v1 docs/market-watch docs/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Update Market Watch decisions and dashboard from cached outcomes'
            python .github/scripts/publish_generated_paths.py --path-prefix data/statmaker/uat/ --path-prefix data/statmaker/betting_v1/ --path-prefix docs/market-watch/ --path-prefix docs/.nojekyll
          fi

