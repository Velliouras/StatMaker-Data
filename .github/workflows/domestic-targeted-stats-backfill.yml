name: Domestic Targeted Stats Backfill

on:
  workflow_dispatch:
    inputs:
      league_codes:
        description: "Comma-separated league codes, e.g. G1 or E0,G1"
        required: true
        default: "G1"
        type: string
      stats_max_requests:
        description: "Maximum API-Football requests for this targeted run"
        required: true
        default: "500"
        type: string
  schedule:
    # Greek historical/current Stats priority pass before the full daily universe refresh.
    - cron: "20 2 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/domestic-targeted-stats-backfill.yml"

permissions:
  contents: write

concurrency:
  group: domestic-targeted-stats-backfill
  cancel-in-progress: false

jobs:
  targeted-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate targeted backfill scripts
        run: |
          python -m py_compile \
            scripts/run_domestic_stats_refresh.py \
            scripts/refresh_domestic_live_july_stats.py \
            scripts/api_football_fetch_fixture_stats.py

      - name: Refresh requested Domestic leagues
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          INPUT_LEAGUE_CODES: ${{ github.event_name == 'workflow_dispatch' && inputs.league_codes || 'G1' }}
          INPUT_STATS_MAX_REQUESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.stats_max_requests || '500' }}
        run: |
          mkdir -p reports
          python scripts/run_domestic_stats_refresh.py \
            --league-codes "$INPUT_LEAGUE_CODES" \
            --max-requests "$INPUT_STATS_MAX_REQUESTS" \
            > reports/domestic_targeted_stats_backfill.log 2>&1
          cat reports/domestic_targeted_stats_backfill.log

      - name: Rebuild app-facing statistics
        run: |
          python scripts/expand_domestic_full_stats.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import domestic_live_july_pipeline as pipeline
          registry = pipeline.load_json(pipeline.REGISTRY_PATH, {}).get('leagues', [])
          if not registry:
              raise SystemExit('Domestic Stats registry is empty')
          pipeline.build_app_statistics(registry)
          PY
          python scripts/finalize_domestic_live_july_artifacts.py
          python scripts/build_domestic_live_july_normalized_stats.py
          python scripts/build_uefa_support_history.py

      - name: Validate targeted result and Greek 2025-26 completeness
        env:
          INPUT_LEAGUE_CODES: ${{ github.event_name == 'workflow_dispatch' && inputs.league_codes || 'G1' }}
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path

          report = json.loads(Path('reports/domestic_live_july_stats_refresh.json').read_text(encoding='utf-8'))
          requested = {x.strip().upper() for x in os.environ['INPUT_LEAGUE_CODES'].replace(';', ',').split(',') if x.strip()}
          selected = {str(x).upper() for x in report.get('selectedLeagueCodes', [])}
          if requested != selected:
              raise SystemExit(f'Targeted selection mismatch: requested={sorted(requested)} selected={sorted(selected)}')

          contract = report.get('completenessContract')
          expected = 'all completed fixture scores are cached at discovery time; advanced statistics are incrementally backfilled'
          if contract != expected:
              raise SystemExit(f'Unexpected stats contract: {contract}')

          if 'G1' in selected:
              artifact = json.loads(Path('data/statmaker/domestic_enriched/greece_super_league_2025.json').read_text(encoding='utf-8'))
              matches = [m for m in artifact.get('matches', []) if str(m.get('status') or '').upper() in {'FT','AET','PEN'}]
              appearances = Counter()
              for match in matches:
                  home = str(match.get('home_team') or '').strip()
                  away = str(match.get('away_team') or '').strip()
                  if home:
                      appearances[home] += 1
                  if away:
                      appearances[away] += 1
              if len(matches) < 180:
                  raise SystemExit(f'G1 2025-26 historical fixture set is still incomplete: {len(matches)} completed fixtures')
              under_26 = {team: count for team, count in appearances.items() if count < 26}
              if under_26:
                  raise SystemExit(f'G1 2025-26 teams below 26 league appearances: {under_26}')
              panathinaikos = max((count for team, count in appearances.items() if 'panathina' in team.lower()), default=0)
              if panathinaikos < 26:
                  raise SystemExit(f'Panathinaikos 2025-26 remains incomplete: {panathinaikos} matches')
              print(f'G1 completeness validated: fixtures={len(matches)} Panathinaikos={panathinaikos}')

          print(
              f"Targeted Stats validated leagues={sorted(selected)} "
              f"requests={report.get('requestsUsed')}/{report.get('maxRequests')} "
              f"newlyFrozen={report.get('historicalNewlyFrozen', [])} "
              f"skippedFrozen={report.get('historicalSkippedFrozen', [])}"
          )
          PY

      - name: Commit targeted stats artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/api_football/fixture_stats \
            data/api_football/domestic_normalized_fixture_stats.json \
            data/statmaker/domestic_enriched \
            data/statmaker/uefa_support_history.json \
            reports/api_football_fixture_stats_fetch.json \
            reports/api_football_fixture_stats_fetch.csv \
            reports/api_football_fixture_stats_fetch.md \
            reports/domestic_live_july_stats_refresh.json \
            reports/domestic_live_july_full_stats_expansion.json \
            reports/statmaker_domestic_enriched_build.json \
            reports/statmaker_domestic_enriched_build.csv \
            reports/statmaker_domestic_enriched_build.md \
            reports/domestic_targeted_stats_backfill.log
          if [ -f data/statmaker/domestic_historical_stats_freeze.json ]; then
            git add data/statmaker/domestic_historical_stats_freeze.json
          fi
          if git diff --cached --quiet; then
            echo "No targeted Domestic Stats changes to commit."
          else
            git commit -m "Backfill targeted Domestic statistics"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
