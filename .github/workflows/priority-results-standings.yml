name: Priority Results and Official Standings

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Wake every five minutes; the producer itself deduplicates UTC 15/30/60-minute buckets.
    - cron: '2-59/5 * * * *'
  workflow_run:
    # Independent lineup wakeups only. Do not subscribe to UEFA/Stats publishers:
    # they depend on these results and would create a workflow_run loop.
    workflows:
      - 'Domestic Lineup Watch'
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/triggers/priority-results-standings'

permissions:
  contents: write

concurrency:
  group: statmaker-priority-results-standings
  cancel-in-progress: false

env:
  STATMAKER_API_BUDGET_ENFORCE: 'true'
  STATMAKER_API_BUDGET_TOKEN: ${{ github.token }}
  STATMAKER_API_BUDGET_POLICY: ${{ github.workspace }}/config/api_football_refresh_policy.json
  STATMAKER_API_BUDGET_PROFILE: rolling
  PYTHONPATH: ${{ github.workspace }}/scripts/api_budget_runtime:${{ github.workspace }}:${{ github.workspace }}/scripts

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/publish_generated_paths.py
            /scripts/
            /config/api_football_refresh_policy.json
            /data/statmaker/league_tables/
            /data/statmaker/domestic_enriched/index.json
            /data/statmaker/uefa_current_stats.json
            /data/statmaker/priority_refresh/
      - name: Verify shared API budget guard before provider work
        run: |
          python -c "import urllib.request; assert getattr(urllib.request.urlopen, '_statmaker_budget', False), 'Shared provider budget guard is missing'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh current-season scores and official tables in priority order
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m scripts.refresh_priority_matches --max-requests 180
      - name: Publish verified read model without artifacts
        run: |
          set -euo pipefail
          git config user.name 'statmaker-data-bot'
          git config user.email 'statmaker-data-bot@users.noreply.github.com'
          git add data/statmaker/priority_refresh config/api_football_refresh_policy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh priority results and official standings [skip ci]'
          python .github/scripts/publish_generated_paths.py --path-prefix data/statmaker/priority_refresh/ --path-prefix config/api_football_refresh_policy.json
