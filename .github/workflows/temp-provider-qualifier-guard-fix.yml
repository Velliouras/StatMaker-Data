name: Temporary Provider Qualifier Guard Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-provider-qualifier-guard-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add provider qualifier safety guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/update_domestic_odds_api_io.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''COUNTRY_ALIASES = {\n'''
          if 'PROVIDER_EXCLUSION_QUALIFIERS' not in text:
              insertion = '''PROVIDER_EXCLUSION_QUALIFIERS = {\n    "simulated", "reality", "srl", "virtual", "women", "reserves", "reserve",\n    "u23", "u21", "u20", "u19", "youth", "friendly", "cup",\n}\n\n'''
              if anchor not in text:
                  raise SystemExit('COUNTRY_ALIASES anchor not found')
              text = text.replace(anchor, insertion + anchor, 1)

          function_anchor = '''def provider_country_matches(config_league: Dict[str, Any], provider_item: Dict[str, Any]) -> bool:\n    haystack = normalize_text(f"{provider_item.get('name', '')} {provider_item.get('slug', '')}")\n    aliases = [normalize_text(x) for x in country_aliases_for(config_league.get("country")) if normalize_text(x)]\n    return any(alias and alias in haystack for alias in aliases)\n\n\n'''
          helper = '''def provider_has_unrequested_qualifier(config_league: Dict[str, Any], provider_item: Dict[str, Any]) -> bool:\n    requested = normalize_text(\n        f"{config_league.get('competition', '')} {' '.join(config_league.get('searchTerms', []) or [])}"\n    )\n    haystack = normalize_text(f"{provider_item.get('name', '')} {provider_item.get('slug', '')}")\n    return any(\n        qualifier in haystack and qualifier not in requested\n        for qualifier in PROVIDER_EXCLUSION_QUALIFIERS\n    )\n\n\n'''
          if 'def provider_has_unrequested_qualifier(' not in text:
              if function_anchor not in text:
                  raise SystemExit('provider_country_matches anchor not found')
              text = text.replace(function_anchor, function_anchor + helper, 1)

          old_configured = '''    if configured_slug:\n        for item in provider_leagues:\n            if str(item.get("slug") or "") == configured_slug and provider_country_matches(config_league, item):\n                return item\n        return None\n'''
          new_configured = '''    if configured_slug:\n        for item in provider_leagues:\n            if (\n                str(item.get("slug") or "") == configured_slug\n                and provider_country_matches(config_league, item)\n                and not provider_has_unrequested_qualifier(config_league, item)\n            ):\n                return item\n        return None\n'''
          if old_configured in text:
              text = text.replace(old_configured, new_configured, 1)
          elif new_configured not in text:
              raise SystemExit('configured slug block not found')

          old_search = '''    for item in provider_leagues:\n        if not provider_country_matches(config_league, item):\n            continue\n        haystack = normalize_text(f"{item.get('name', '')} {item.get('slug', '')}")\n'''
          new_search = '''    for item in provider_leagues:\n        if not provider_country_matches(config_league, item):\n            continue\n        if provider_has_unrequested_qualifier(config_league, item):\n            continue\n        haystack = normalize_text(f"{item.get('name', '')} {item.get('slug', '')}")\n'''
          if old_search in text:
              text = text.replace(old_search, new_search, 1)
          elif new_search not in text:
              raise SystemExit('provider search block not found')

          path.write_text(text, encoding='utf-8')
          PY

          cat > tests/test_domestic_provider_league_guard.py <<'PY'
          import sys
          import unittest
          from pathlib import Path

          sys.path.insert(0, str((Path(__file__).resolve().parents[1] / 'scripts').resolve()))
          import update_domestic_odds_api_io as odds


          class DomesticProviderLeagueGuardTest(unittest.TestCase):
              def setUp(self):
                  self.t1 = {
                      'leagueCode': 'T1',
                      'country': 'Turkey',
                      'competition': 'Süper Lig',
                      'providerLeagueSlug': None,
                      'searchTerms': ['turkey super lig', 'turkish super lig', 'süper lig', 'super lig'],
                  }

              def test_rejects_simulated_turkey_super_lig(self):
                  providers = [{
                      'name': 'Simulated Reality League - Turkey Super Lig SRL',
                      'slug': 'simulated-reality-league-turkey-super-lig-srl',
                      'eventsCount': 10,
                  }]
                  self.assertIsNone(odds.match_provider_league(self.t1, providers))

              def test_prefers_real_turkey_super_lig_over_simulated(self):
                  simulated = {
                      'name': 'Simulated Reality League - Turkey Super Lig SRL',
                      'slug': 'simulated-reality-league-turkey-super-lig-srl',
                      'eventsCount': 10,
                  }
                  real = {
                      'name': 'Turkey Super Lig',
                      'slug': 'turkey-super-lig',
                      'eventsCount': 9,
                  }
                  matched = odds.match_provider_league(self.t1, [simulated, real])
                  self.assertIsNotNone(matched)
                  self.assertEqual('turkey-super-lig', matched['slug'])

              def test_rejects_configured_simulated_slug_too(self):
                  configured = dict(self.t1)
                  configured['providerLeagueSlug'] = 'simulated-reality-league-turkey-super-lig-srl'
                  providers = [{
                      'name': 'Simulated Reality League - Turkey Super Lig SRL',
                      'slug': 'simulated-reality-league-turkey-super-lig-srl',
                  }]
                  self.assertIsNone(odds.match_provider_league(configured, providers))


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Run focused regression tests
        run: python -m unittest tests/test_domestic_provider_league_guard.py

      - name: Commit production guard only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/update_domestic_odds_api_io.py tests/test_domestic_provider_league_guard.py
          if git diff --cached --quiet; then
            echo "Provider qualifier guard already present."
          else
            git commit -m "Reject simulated provider leagues in Domestic matching"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
