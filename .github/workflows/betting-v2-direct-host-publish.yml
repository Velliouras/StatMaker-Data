name: Betting V2 Direct Host Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/betting-v2-direct-hot-publish'
      - '.github/triggers/betting-v2-revised-uat-publish'
      - '.github/triggers/betting-v2-all-market-uat-publish'

permissions:
  contents: write

concurrency:
  group: statmaker-app-ready-targeted-writers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update UAT exact forecasts and preserve all legacy tables
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +main:refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
          python -m pip install --quiet numpy scipy scikit-learn
          python -m unittest discover -s tests -p test_betting_v2_opponent_matchup.py -v
          python -m unittest discover -s tests -p test_live_factorized.py -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p test_live_revised.py -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p test_model_revision.py -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p test_revision_calibration.py -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p test_reliable_counts.py -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p test_all_market_live.py -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p test_uat_count_quotes.py -v
          if [ -f reports/betting_v2/all_market_revision_20261016/deployment.json ]; then
            PYTHONPATH=scripts python -m unittest discover -s tests -p test_all_market_deployment.py -v
          fi
          python scripts/validate_betting_favourite_policy.py
          python scripts/validate_exact_uat_contract.py
          python scripts/hotpatch_betting_v2_direct.py
      - name: Publish only updated immutable App-Ready betting bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage="$(mktemp -d)"
          cp data/statmaker/app_ready/update_manifest.json "$stage/update_manifest.json"
          name="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/statmaker/app_ready/update_manifest.json').read_text())
          print(Path(next(x for x in d['artifacts'] if x['id']=='app_ready_betting_bundle')['path']).name)
          PY
          )"
          cp "data/statmaker/app_ready/$name" "$stage/$name"
          done_publish=false
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            python scripts/merge_betting_v2_manifest.py "$stage/update_manifest.json" data/statmaker/app_ready/update_manifest.json
            cp "$stage/$name" "data/statmaker/app_ready/$name"
            git add data/statmaker/app_ready/update_manifest.json "data/statmaker/app_ready/$name"
            if git diff --cached --quiet; then
              done_publish=true
              break
            fi
            git commit -m "Publish direct Betting V2 model forecasts to App-Ready"
            if git push origin HEAD:main; then
              done_publish=true
              break
            fi
            sleep $((attempt*2))
          done
          [[ "$done_publish" == "true" ]]
      - name: Audit the published favorite fixtures from cached histories
        run: python scripts/audit_betting_v2_favorites.py
      # Persistent Actions artifact uploads are disabled by repository policy.
