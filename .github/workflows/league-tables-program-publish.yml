name: League Tables UEFA and Program Publish

on:
  workflow_call:
    inputs:
      watchdog:
        type: boolean
        default: false
  # The UEFA producer publishes via GITHUB_TOKEN; its commit does not fire
  # downstream push workflows. workflow_run is the reliable hand-off.
  workflow_run:
    workflows:
      - "UEFA Current Stats Refresh"
      - "Domestic Lineup Watch"
    types: [completed]
    branches: [main]
  # Fallback when the upstream daily schedule is delayed/skipped.
  # Run after the 05:25 UTC UEFA stats refresh, with a bounded provider budget.
  schedule:
    # Trigger after European final whistles and again next morning. Cron
    # failures are independently backed up by Domestic Lineup Watch.
    - cron: "55 22 * * *"
    - cron: "55 0 * * *"
    - cron: "45 6 * * *"
    - cron: "15 7 * * *"
  push:
    branches: [main]
    paths:
      - '.github/triggers/league-tables-program-publish'
      - 'data/statmaker/domestic_enriched/index.json'
      - 'data/statmaker/uefa_current_stats.json'
      - 'data/api_football/fixture_stats/**'

permissions:
  contents: write

concurrency:
  group: statmaker-league-tables-read-model
  cancel-in-progress: false

env:
  STATMAKER_API_BUDGET_ENFORCE: "true"
  STATMAKER_API_BUDGET_TOKEN: ${{ github.token }}
  STATMAKER_API_BUDGET_POLICY: ${{ github.workspace }}/config/api_football_refresh_policy.json
  STATMAKER_API_BUDGET_PROFILE: rolling
  WATCHDOG_REFRESH: ${{ inputs.watchdog }}
  PYTHONPATH: ${{ github.workspace }}/scripts/api_budget_runtime:${{ github.workspace }}:${{ github.workspace }}/scripts

jobs:
  publish:
    if: ${{ inputs.watchdog || ((github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.name != 'Domestic Lineup Watch' || (github.event.workflow_run.event == 'schedule' && (contains(github.event.workflow_run.run_started_at, 'T21:') || contains(github.event.workflow_run.run_started_at, 'T22:') || contains(github.event.workflow_run.run_started_at, 'T23:') || contains(github.event.workflow_run.run_started_at, 'T00:') || contains(github.event.workflow_run.run_started_at, 'T01:') || contains(github.event.workflow_run.run_started_at, 'T05:') || contains(github.event.workflow_run.run_started_at, 'T06:') || contains(github.event.workflow_run.run_started_at, 'T07:')))))) && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[budget-policy-only]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/publish_generated_paths.py
            /scripts/api_budget_runtime/
            /config/api_football_refresh_policy.json
            /scripts/
            /data/statmaker/domestic_enriched/index.json
            /data/statmaker/uefa_current_stats.json
            /data/statmaker/priority_refresh/
            /data/statmaker/league_tables/
            /data/api_football/league_tables/
      - name: Verify shared API budget guard before provider work
        run: |
          python -c "import urllib.request; assert getattr(urllib.request.urlopen, '_statmaker_budget', False), 'Shared provider budget guard is missing'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check completed UEFA matchday gaps before spending quota
        id: due
        run: |
          args=()
          if [ "$WATCHDOG_REFRESH" = "true" ]; then args+=(--watchdog); fi
          python scripts/uefa_postmatch_refresh_due.py --target tables "${args[@]}" >> "$GITHUB_OUTPUT"
          # Explicit manual trigger requests always run; a genuine data
          # change is already covered by the same published due check.

      - name: Include only current-season fixture caches
        if: steps.due.outputs.refresh_needed == 'true' && !inputs.watchdog
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from scripts.build_league_tables_program import current_leagues
          rows = current_leagues(Path('.'))
          paths = [v.get('cache_path', '') for v in rows.values()]
          paths = ['/' + p for p in paths if p.startswith('data/api_football/fixture_stats/') and '..' not in p]
          subprocess.run(['git','sparse-checkout','add','--stdin'], input='\n'.join(paths)+'\n', text=True, check=True)
          PY
      - name: Build full Domestic and UEFA programmes and UEFA tables/scorers
        if: steps.due.outputs.refresh_needed == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          args=()
          if [ "$WATCHDOG_REFRESH" = "true" ]; then args+=(--uefa-only); fi
          python scripts/build_league_tables_program.py --execute --max-requests 64 --quota-reserve 1500 "${args[@]}"
      - name: Validate current-season published read models
        if: steps.due.outputs.refresh_needed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('data/statmaker/league_tables')
          index=json.loads((folder/'index.json').read_text())
          for row in index['leagues']:
              data=json.loads((folder/(row['leagueCode']+'.json')).read_text())
              assert data['contract']=='statmaker-league-tables-v1'
              assert data['season']==row['season']
              ids=[x['fixture_id'] for x in data['fixtures']]
              assert len(ids)==len(set(ids))
              print(row['leagueCode'], 'fixtures',len(ids),'rounds',len({x['round'] for x in data['fixtures']}),'standings',len(data.get('standings',[])))
          PY
      - name: Publish only League Tables programme snapshots and provider receipts
        if: steps.due.outputs.refresh_needed == 'true'
        run: |
          git config user.name 'statmaker-data-bot'
          git config user.email 'statmaker-data-bot@users.noreply.github.com'
          git add data/statmaker/league_tables
          if [ -d data/api_football/league_tables ]; then git add data/api_football/league_tables; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish UEFA league tables and full season programmes [skip ci]'
            python .github/scripts/publish_generated_paths.py --path-prefix data/statmaker/league_tables/ --path-prefix data/api_football/league_tables/
          fi
