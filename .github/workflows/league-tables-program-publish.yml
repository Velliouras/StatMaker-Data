name: League Tables UEFA and Program Publish

on:
  # The UEFA producer publishes via GITHUB_TOKEN; its commit does not fire
  # downstream push workflows. workflow_run is the reliable hand-off.
  workflow_run:
    workflows:
      - "UEFA Current Stats Refresh"
    types: [completed]
    branches: [main]
  # Fallback when the upstream daily schedule is delayed/skipped.
  # Run after the 05:25 UTC UEFA stats refresh, with a bounded provider budget.
  schedule:
    - cron: "45 6 * * *"
  push:
    branches: [main]
    paths:
      - '.github/triggers/league-tables-program-publish'
      - 'data/statmaker/domestic_enriched/index.json'
      - 'data/statmaker/uefa_current_stats.json'
      - 'data/api_football/fixture_stats/**'

permissions:
  contents: write

concurrency:
  group: statmaker-league-tables-read-model
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /data/statmaker/domestic_enriched/index.json
            /data/statmaker/uefa_current_stats.json
            /data/statmaker/league_tables/
            /data/api_football/league_tables/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Include only current-season fixture caches
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from scripts.build_league_tables_program import current_leagues
          rows = current_leagues(Path('.'))
          paths = [v.get('cache_path', '') for v in rows.values()]
          paths = ['/' + p for p in paths if p.startswith('data/api_football/fixture_stats/') and '..' not in p]
          subprocess.run(['git','sparse-checkout','add','--stdin'], input='\n'.join(paths)+'\n', text=True, check=True)
          PY
      - name: Build full Domestic and UEFA programmes and UEFA tables/scorers
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/build_league_tables_program.py --execute --max-requests 64 --quota-reserve 1500
      - name: Validate current-season published read models
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('data/statmaker/league_tables')
          index=json.loads((folder/'index.json').read_text())
          for row in index['leagues']:
              data=json.loads((folder/(row['leagueCode']+'.json')).read_text())
              assert data['contract']=='statmaker-league-tables-v1'
              assert data['season']==row['season']
              ids=[x['fixture_id'] for x in data['fixtures']]
              assert len(ids)==len(set(ids))
              print(row['leagueCode'], 'fixtures',len(ids),'rounds',len({x['round'] for x in data['fixtures']}),'standings',len(data.get('standings',[])))
          PY
      - name: Publish only League Tables programme snapshots and provider receipts
        run: |
          git config user.name 'statmaker-data-bot'
          git config user.email 'statmaker-data-bot@users.noreply.github.com'
          git add data/statmaker/league_tables
          if [ -d data/api_football/league_tables ]; then git add data/api_football/league_tables; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish UEFA league tables and full season programmes [skip ci]'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
