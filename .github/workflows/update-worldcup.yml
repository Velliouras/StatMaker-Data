name: Update World Cup JSON

on:
  workflow_dispatch:
  schedule:
    # Hourly scrape gate. Python still decides SCRAPE or SKIP.
    # With STATMAKER_POST_MATCH_SCRAPE_MINUTES=360, each finished match gets
    # one safe catch-up attempt per hour for about 6 hours after estimated full-time.
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  update-worldcup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATMAKER_POST_MATCH_SCRAPE_MINUTES: "360"

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Update World Cup JSON from Flashscore
        run: python scripts/update_worldcup_flashscore.py

      - name: Commit updated JSON if changed
        run: |
          if git diff --quiet -- world-cup/world_cup_2026.json; then
            echo "No World Cup JSON changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-cup/world_cup_2026.json
          git commit -m "Update World Cup 2026 JSON"
          git push
