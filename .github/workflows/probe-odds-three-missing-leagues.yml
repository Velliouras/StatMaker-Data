name: Probe Three Unmatched Odds Leagues

on:
  push:
    branches:
      - statmaker-69-league-expansion-v2

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Print provider candidates from one league-catalog call
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import unicodedata
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def norm(value):
              text = unicodedata.normalize('NFKD', str(value or ''))
              text = ''.join(ch for ch in text if not unicodedata.combining(ch)).lower()
              return re.sub(r'[^a-z0-9]+', ' ', text).strip()

          key = os.environ['ODDS_API_IO_KEY'].strip()
          url = 'https://api.odds-api.io/v3/leagues?' + urlencode({'apiKey': key, 'sport': 'football', 'all': 'true'})
          with urlopen(Request(url, headers={'User-Agent': 'StatMaker-Data/1.0'}), timeout=45) as response:
              rows = json.loads(response.read().decode('utf-8'))

          needles = {
              'ISR': ('israel', 'ligat', 'ha al', 'haal'),
              'KOR': ('korea', 'k league', 'kleague'),
              'RSA': ('south africa', 'premier soccer', 'premier division', 'psl'),
          }
          for code, terms in needles.items():
              print(f'--- {code} CANDIDATES ---')
              found = 0
              for row in rows if isinstance(rows, list) else []:
                  if not isinstance(row, dict):
                      continue
                  text = norm(f"{row.get('name', '')} {row.get('slug', '')}")
                  if any(norm(term) in text for term in terms):
                      print(
                          f"{code}_CANDIDATE name={row.get('name')} slug={row.get('slug')} "
                          f"events={row.get('eventsCount')}"
                      )
                      found += 1
              print(f'{code}_CANDIDATE_COUNT={found}')
          PY
