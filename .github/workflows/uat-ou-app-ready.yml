name: StatMaker UAT O-U App-Ready

on:
  push:
    branches:
      - uat-ou-value-mispricing-20260920
    paths:
      - '.github/uat-ou-app-ready-trigger'

permissions:
  contents: write
  actions: read

concurrency:
  group: statmaker-uat-ou-app-ready
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UAT_BRANCH: uat-ou-value-mispricing-20260920
      CHECKPOINT_RUN_ID: "35568142167"
      APP_READY_PATTERN_RULES_FINGERPRINT: pattern-policy-v2-final-read-model-v5-performance-shadow-v1-ou-value-v1
      APP_READY_PREPARED_SCHEMA_VERSION: "11"
      APP_READY_STATMAKER_COMMIT: "561e152bc8302bb8240131cefc65b5350522c180"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: uat-ou-value-mispricing-20260920
          fetch-depth: 1

      - name: Fetch canonical source refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main
          git fetch --no-tags --depth=1 origin \
            +build/uefa-qualifier-feed-20260720:refs/remotes/origin/build/uefa-qualifier-feed-20260720

      - name: Restore verified prepared checkpoint
        uses: actions/download-artifact@v4
        with:
          name: statmaker-app-ready-prepared-checkpoint
          path: app-ready-checkpoint
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CHECKPOINT_RUN_ID }}

      - name: Validate checkpoint contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_app_ready_prepared_contract.py \
            app-ready-checkpoint \
            --metadata app-ready-checkpoint/checkpoint.json \
            --kind checkpoint

      - name: Materialize current O-U value candidates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app-ready-export
          mkdir -p app-ready-export/source
          python scripts/materialize_app_ready_pattern_candidates.py \
            app-ready-checkpoint \
            app-ready-export/raw \
            app-ready-export/source
          python scripts/materialize_prepared_fixture_index.py \
            app-ready-export/raw/databases/statmaker_prepared_betting.db

      - name: Stage exact current canonical betting sources
        shell: bash
        run: |
          set -euo pipefail
          s="app-ready-export/source"
          git show refs/remotes/origin/main:data/statmaker/update_manifest.json > "$s/main_manifest.json"
          git show refs/remotes/origin/main:odds/odds_api_io/domestic_odds.json > "$s/domestic.json"
          git show refs/remotes/origin/build/uefa-qualifier-feed-20260720:data/statmaker/uefa_update_manifest.json > "$s/uefa_manifest.json"
          git show refs/remotes/origin/build/uefa-qualifier-feed-20260720:odds/odds_api_io/champions_league_odds.json > "$s/champions_league.json"
          git show refs/remotes/origin/build/uefa-qualifier-feed-20260720:odds/odds_api_io/europa_league_odds.json > "$s/europa_league.json"
          git show refs/remotes/origin/build/uefa-qualifier-feed-20260720:odds/odds_api_io/conference_league_odds.json > "$s/conference_league.json"
          test -s "$s/main_manifest.json"
          test -s "$s/domestic.json"
          test -s "$s/uefa_manifest.json"
          test -s "$s/champions_league.json"
          test -s "$s/europa_league.json"
          test -s "$s/conference_league.json"

      - name: Verify checkpoint and current source versions match
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint=json.loads(Path("app-ready-checkpoint/checkpoint.json").read_text())
          main=json.loads(Path("app-ready-export/source/main_manifest.json").read_text())
          uefa=json.loads(Path("app-ready-export/source/uefa_manifest.json").read_text())
          expected_main=str(checkpoint.get("mainContentVersion") or "")
          expected_uefa=str(checkpoint.get("uefaContentVersion") or "")
          actual_main=str(main.get("contentVersion") or "")
          actual_uefa=str(uefa.get("contentVersion") or "")
          if expected_main != actual_main:
              raise SystemExit(f"Checkpoint/main source mismatch {expected_main[:12]} != {actual_main[:12]}")
          if expected_uefa != actual_uefa:
              raise SystemExit(f"Checkpoint/UEFA source mismatch {expected_uefa[:12]} != {actual_uefa[:12]}")
          print("UAT_OU_SOURCE_VERSION_OK", actual_main[:12], actual_uefa[:12])
          PY

      - name: Build betting-only UAT App-Ready bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app-ready-export/out
          python scripts/build_uat_ou_betting_app_ready.py \
            app-ready-export/raw \
            app-ready-export/source \
            app-ready-export/out \
            --base-manifest data/statmaker/app_ready/update_manifest.json \
            --repo-root .

      - name: Validate isolated UAT manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          path=Path("app-ready-export/out/update_manifest.json")
          manifest=json.loads(path.read_text())
          metadata=manifest.get("metadata") or {}
          rules="pattern-policy-v2-final-read-model-v5-performance-shadow-v1-ou-value-v1"
          branch="uat-ou-value-mispricing-20260920"
          trusted=f"https://raw.githubusercontent.com/Velliouras/StatMaker-Data/{branch}/data/statmaker/app_ready/"
          if metadata.get("preparedPatternRulesFingerprint") != rules:
              raise SystemExit("Unexpected O/U rules fingerprint")
          if not metadata.get("uatBettingOnly"):
              raise SystemExit("Manifest is not marked betting-only UAT")
          artifacts=manifest.get("artifacts") or []
          if {a.get("id") for a in artifacts} != {"app_ready_stats_bundle","app_ready_betting_bundle"}:
              raise SystemExit("Unexpected UAT artifact set")
          for item in artifacts:
              url=str(item.get("url") or "")
              if not url.startswith(trusted):
                  raise SystemExit(f"Non-UAT artifact URL: {url}")
              name=Path(str(item.get("path") or "")).name
              local=Path("app-ready-export/out")/name
              if item.get("id") == "app_ready_stats_bundle":
                  local=Path("data/statmaker/app_ready")/name
              if not local.is_file():
                  raise SystemExit(f"Missing manifest artifact: {local}")
              h=hashlib.sha256(local.read_bytes()).hexdigest()
              if h != str(item.get("sha256") or ""):
                  raise SystemExit(f"Artifact SHA mismatch: {name}")
              if local.stat().st_size != int(item.get("bytes") or 0):
                  raise SystemExit(f"Artifact size mismatch: {name}")
          print(
              "UAT_OU_MANIFEST_OK",
              "generation="+str(metadata.get("preparedPatternGenerationId") or "")[:12],
              "candidates="+str(metadata.get("preparedPatternCandidateCount") or 0),
              "eligible="+str(metadata.get("preparedPatternRecommendationEligibleCount") or 0),
              "directions="+json.dumps(metadata.get("uatOverUnderDirectionCountsAt150") or {}, sort_keys=True),
          )
          PY

      - name: Revalidate canonical source versions
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main
          git fetch --no-tags --depth=1 origin \
            +build/uefa-qualifier-feed-20260720:refs/remotes/origin/build/uefa-qualifier-feed-20260720
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          built=json.loads(Path("app-ready-export/out/update_manifest.json").read_text())
          meta=built.get("metadata") or {}
          main=json.loads(subprocess.check_output(
              ["git","show","refs/remotes/origin/main:data/statmaker/update_manifest.json"], text=True
          ))
          uefa=json.loads(subprocess.check_output(
              ["git","show","refs/remotes/origin/build/uefa-qualifier-feed-20260720:data/statmaker/uefa_update_manifest.json"], text=True
          ))
          if str(meta.get("mainContentVersion") or "") != str(main.get("contentVersion") or ""):
              raise SystemExit("Domestic canonical source changed during UAT build")
          if str(meta.get("uefaContentVersion") or "") != str(uefa.get("contentVersion") or ""):
              raise SystemExit("UEFA canonical source changed during UAT build")
          print("UAT_OU_FINAL_SOURCE_GUARD_OK")
          PY

      - name: Publish only UAT betting artifact and manifest
        shell: bash
        run: |
          set -euo pipefail
          dst="data/statmaker/app_ready"
          mkdir -p "$dst"
          cp app-ready-export/out/app_ready_betting_bundle-*.zip "$dst/"
          cp app-ready-export/out/update_manifest.json "$dst/update_manifest.json"

          git config user.name "StatMaker UAT Artifact Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/statmaker/app_ready
          if git diff --cached --quiet; then
            echo "UAT_OU_ALREADY_PUBLISHED"
            exit 0
          fi
          git commit -m "Publish UAT O-U value App-Ready betting model"
          git push origin HEAD:uat-ou-value-mispricing-20260920
