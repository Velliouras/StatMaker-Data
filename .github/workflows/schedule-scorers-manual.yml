name: Schedule Scorers Bounded Manual Refresh

on:
  workflow_call:
    inputs:
      watchdog:
        type: boolean
        default: false
      phase:
        type: string
        default: 'leaders'
      max_requests:
        type: string
        default: '6'
      lookback:
        type: string
        default: '14'
  # Daily refresh and fallback: missing schedule runs must not leave leaders stale.
  # Provenance timestamp freshness skips duplicates without spending provider calls.
  schedule:
    - cron: '43 5 * * *'
    - cron: '23 7 * * *'
  workflow_run:
    workflows: ["Domestic Lineup Watch"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/triggers/schedule-scorers-refresh'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Only leaderboard, fixture events, or both'
        required: true
        type: choice
        options: [leaders, events, both]
        default: leaders
      max_requests:
        description: 'Strict provider call budget'
        required: true
        type: choice
        options: ['6', '12', '20']
        default: '6'
      lookback:
        description: 'Days of completed fixtures (events only)'
        required: true
        type: choice
        options: ['7', '14', '30']
        default: '14'

permissions:
  contents: write

concurrency:
  group: statmaker-schedule-scorers-bounded-manual
  cancel-in-progress: false

env:
  STATMAKER_API_BUDGET_ENFORCE: "true"
  STATMAKER_API_BUDGET_TOKEN: ${{ github.token }}
  STATMAKER_API_BUDGET_POLICY: ${{ github.workspace }}/config/api_football_refresh_policy.json
  STATMAKER_API_BUDGET_PROFILE: rolling
  PYTHONPATH: ${{ github.workspace }}/scripts/api_budget_runtime:${{ github.workspace }}:${{ github.workspace }}/scripts

jobs:
  scorer-refresh:
    if: ${{ inputs.watchdog || ((github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule' && (contains(github.event.workflow_run.run_started_at, 'T05:') || contains(github.event.workflow_run.run_started_at, 'T06:') || contains(github.event.workflow_run.run_started_at, 'T07:')))) && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[budget-policy-only]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/publish_generated_paths.py
            /.github/workflows/
            /scripts/
            /tests/
            /config/
            /data/statmaker/domestic_enriched/index.json
            /data/statmaker/priority_refresh/
            /data/statmaker/schedule_scorers/
            /data/api_football/schedule_scorers/
      - name: Include selected current-season scorer archives
        run: python scripts/scorer_refresh_sources.py
      - name: Verify shared API budget guard before provider work
        run: |
          python -c "import urllib.request; assert getattr(urllib.request.urlopen, '_statmaker_budget', False), 'Shared provider budget guard is missing'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate scorer freshness and prioritization (offline)
        run: |
          python -m py_compile scripts/fetch_schedule_scorers_capped.py scripts/refresh_domestic_match_context.py
          python -m unittest discover -s tests -p 'test_scorer_refresh_freshness.py' -v
      - name: Import only bounded verified scorer data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          REQUEST_PHASE: ${{ inputs.phase || 'leaders' }}
          MAX_REQUESTS: ${{ inputs.max_requests || '6' }}
          LOOKBACK: ${{ inputs.lookback || '14' }}
        run: |
          test -n "$API_FOOTBALL_KEY" || { echo 'Missing API_FOOTBALL_KEY'; exit 1; }
          python scripts/fetch_schedule_scorers_capped.py --execute \
            --phase "$REQUEST_PHASE" \
            --max-requests "$MAX_REQUESTS" \
            --lookback "$LOOKBACK" \
            --quota-reserve 1500
      - name: Reconcile scorer lists with verified season events without API calls
        run: |
          python -m unittest discover -s tests -p 'test_scorer_goal_floor.py' -v
          python -m unittest discover -s tests -p 'test_event_leaderboard_reconciliation.py' -v
          python scripts/reconcile_top_scorers_with_events.py
      - name: Publish only scorer cache and read model
        env:
          REQUEST_PHASE: ${{ inputs.phase || 'leaders' }}
        run: |
          set -euo pipefail
          git config user.name 'statmaker-data-bot'
          git config user.email 'statmaker-data-bot@users.noreply.github.com'
          if [ "$REQUEST_PHASE" = "leaders" ]; then
            if [ -d data/api_football/schedule_scorers/leaders ]; then
              git add data/api_football/schedule_scorers/leaders/
            fi
          else
            if [ -d data/api_football/schedule_scorers ]; then
              git add data/api_football/schedule_scorers/
            fi
          fi
          git add data/statmaker/schedule_scorers/season_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh bounded verified Schedule scorers [skip ci]'
            python .github/scripts/publish_generated_paths.py --path-prefix data/api_football/schedule_scorers/ --path-prefix data/statmaker/schedule_scorers/season_snapshot.json
          fi
      - name: Audit leaderboard provider freshness (no API requests)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.phase == 'leaders' || inputs.phase == 'both' }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          import json
          from pathlib import Path
          doc=json.loads(Path('data/statmaker/schedule_scorers/season_snapshot.json').read_text())
          now=datetime.now(timezone.utc)
          expected={'E0','SP1','I1','D1','F1','G1'}
          fresh={}
          for row in doc.get('leagueTopScorers', []):
              code=row.get('leagueCode')
              if code not in expected or not row.get('verified'):
                  continue
              try:
                  stamp=datetime.fromisoformat(str(row['retrievedAtUTC']).replace('Z','+00:00'))
                  age=now-stamp.astimezone(timezone.utc)
                  fresh[code]=timedelta(0)<=age<timedelta(hours=48)
              except (ValueError, KeyError, TypeError, AttributeError):
                  fresh[code]=False
          stale=sorted(expected-{code for code,okay in fresh.items() if okay})
          report='Top scorer freshness: '+str(len(expected)-len(stale))+'/6 leagues; stale='+str(stale)
          print(report)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(report+'\n')
          if stale:
              raise SystemExit('STALE_TOP_SCORERS: '+', '.join(stale))
          PY
