name: Temporary T1 Clear Stale Slug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-t1-clear-stale-slug.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only stale simulated T1 slug
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('odds/odds_api_io/domestic_odds.json')
          feed = json.loads(path.read_text(encoding='utf-8-sig'))
          rows = [x for x in feed.get('leagues', []) if x.get('leagueCode') == 'T1']
          if len(rows) != 1:
              raise SystemExit(f'Expected one T1 row, found {len(rows)}')
          row = rows[0]
          expected_bad = 'simulated-reality-league-turkey-super-lig-srl'
          if row.get('providerLeagueSlug') != expected_bad:
              raise SystemExit(f'Unexpected T1 slug: {row.get("providerLeagueSlug")!r}')
          matches = [m for m in row.get('matches', []) if isinstance(m, dict)]
          if matches or any(m.get('markets') for m in matches):
              raise SystemExit('Refusing to clear T1 slug because canonical feed contains matches/markets')
          row['providerLeagueSlug'] = None
          path.write_text(json.dumps(feed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('T1_STALE_SIMULATED_SLUG_REMOVED')
          PY
      - name: Commit exact T1 data fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add odds/odds_api_io/domestic_odds.json
          git commit -m "Remove stale simulated Turkey provider slug"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
