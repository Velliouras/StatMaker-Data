name: App-Ready Simulation Hot Publish

on:
  push:
    paths:
      - '.github/simulation-hotpatch-trigger'

permissions:
  contents: write

concurrency:
  group: statmaker-app-ready-simulation-hot-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Hot-patch current App-Ready betting bundle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/hotpatch_app_ready_simulation.py

      - name: Verify hot-patched bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3, tempfile, zipfile
          from pathlib import Path

          root=Path('.')
          manifest=json.loads((root/'data/statmaker/app_ready/update_manifest.json').read_text(encoding='utf-8'))
          metadata=manifest.get('metadata',{})
          assert metadata.get('preparedSimulationContract') == 'monte-carlo-v1-prod-data-uat-engine'
          assert int(metadata.get('preparedSimulationRuns') or 0) >= 10000
          assert int(metadata.get('preparedMatchSimulationCount') or 0) > 0
          assert metadata.get('preparedTeamEloContract') == 'team-elo-v1'
          assert int(metadata.get('preparedTeamEloCount') or 0) > 0
          assert int(metadata.get('preparedTeamEloLeagueCount') or 0) > 0
          assert metadata.get('preparedLeagueSimulationContract') == 'league-season-monte-carlo-v3-all-domestic-elo'
          assert int(metadata.get('preparedLeagueSimulationCount') or 0) > 0
          assert int(metadata.get('preparedLeagueSimulationTeamCount') or 0) > 0
          assert int(metadata.get('preparedLeagueSimulationRuns') or 0) >= 10000
          assert metadata.get('preparedUefaSimulationContract') == 'uefa-club-monte-carlo-v1'
          assert metadata.get('preparedUefaSimulationStrengthModel') == 'uefa-seeding-elo-v1'
          assert int(metadata.get('preparedUefaSimulationCount') or 0) == 3
          assert int(metadata.get('preparedUefaSimulationTeamCount') or 0) == 108
          assert int(metadata.get('preparedUefaSimulationRuns') or 0) >= 10000
          artifact=next(x for x in manifest['artifacts'] if x['id']=='app_ready_betting_bundle')
          bundle=root/artifact['path']
          with tempfile.TemporaryDirectory() as td:
              out=Path(td)
              with zipfile.ZipFile(bundle) as zf:
                  zf.extract('databases/statmaker_prepared_betting.db', out)
              db=out/'databases/statmaker_prepared_betting.db'
              con=sqlite3.connect(db)
              try:
                  expected_tables={
                      'prepared_simulations',
                      'prepared_match_simulations',
                      'prepared_team_elo',
                      'prepared_team_elo_meta',
                      'prepared_league_simulation_meta',
                      'prepared_league_team_simulations',
                      'prepared_uefa_simulation_meta',
                      'prepared_uefa_team_simulations',
                  }
                  tables={r[0] for r in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  ) if r[0] in expected_tables}
                  assert tables == expected_tables
                  rows=int(con.execute('SELECT COUNT(*) FROM prepared_simulations').fetchone()[0])
                  match_rows=int(con.execute('SELECT COUNT(*) FROM prepared_match_simulations').fetchone()[0])
                  runs=int(con.execute('SELECT COALESCE(MAX(simulation_runs),0) FROM prepared_simulations').fetchone()[0])
                  elo_rows=int(con.execute('SELECT COUNT(*) FROM prepared_team_elo').fetchone()[0])
                  elo_meta_rows=int(con.execute('SELECT COUNT(*) FROM prepared_team_elo_meta').fetchone()[0])
                  league_rows=int(con.execute('SELECT COUNT(*) FROM prepared_league_simulation_meta').fetchone()[0])
                  league_team_rows=int(con.execute('SELECT COUNT(*) FROM prepared_league_team_simulations').fetchone()[0])
                  league_runs=int(con.execute('SELECT COALESCE(MAX(simulation_runs),0) FROM prepared_league_simulation_meta').fetchone()[0])
                  league_meta_cols={row[1] for row in con.execute('PRAGMA table_info(prepared_league_simulation_meta)')}
                  league_team_cols={row[1] for row in con.execute('PRAGMA table_info(prepared_league_team_simulations)')}
                  uefa_rows=int(con.execute('SELECT COUNT(*) FROM prepared_uefa_simulation_meta').fetchone()[0])
                  uefa_team_rows=int(con.execute('SELECT COUNT(*) FROM prepared_uefa_team_simulations').fetchone()[0])
                  uefa_runs=int(con.execute('SELECT COALESCE(MAX(simulation_runs),0) FROM prepared_uefa_simulation_meta').fetchone()[0])
                  assert rows>0 and match_rows>0 and runs>=10000
                  assert elo_rows>0 and elo_meta_rows>0
                  assert league_rows>0 and league_team_rows>0 and league_runs>=10000
                  assert 'split_group_keys_json' in league_meta_cols
                  assert 'split_group_probabilities_json' in league_team_cols
                  assert uefa_rows==3 and uefa_team_rows==108 and uefa_runs>=10000
                  print(
                      'HOT_PUBLISH_VERIFY_OK',
                      f'rows={rows}', f'match_rows={match_rows}', f'runs={runs}',
                      f'elo_rows={elo_rows}', f'elo_meta_rows={elo_meta_rows}',
                      f'league_rows={league_rows}', f'league_team_rows={league_team_rows}',
                      f'league_runs={league_runs}',
                      f'uefa_rows={uefa_rows}', f'uefa_team_rows={uefa_team_rows}',
                      f'uefa_runs={uefa_runs}'
                  )
              finally:
                  con.close()
          PY

      - name: Commit published App-Ready simulation bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_dir="$(mktemp -d)"
          cp data/statmaker/app_ready/update_manifest.json "$publish_dir/update_manifest.json"
          bundle_name="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/statmaker/app_ready/update_manifest.json').read_text())
          betting=next(x for x in manifest['artifacts'] if x['id']=='app_ready_betting_bundle')
          print(Path(betting['path']).name)
          PY
          )"
          cp "data/statmaker/app_ready/$bundle_name" "$publish_dir/$bundle_name"

          published=false
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main

            cp "$publish_dir/update_manifest.json" data/statmaker/app_ready/update_manifest.json
            cp "$publish_dir/$bundle_name" "data/statmaker/app_ready/$bundle_name"
            git add data/statmaker/app_ready/update_manifest.json "data/statmaker/app_ready/$bundle_name"

            if git diff --cached --quiet; then
              echo "APP_READY_SIMULATION_HOT_PUBLISH_ALREADY_PRESENT"
              published=true
              break
            fi

            git commit -m "Publish match and league simulation App-Ready hotfix"
            if git push origin HEAD:main; then
              echo "APP_READY_SIMULATION_HOT_PUBLISH_PUSH_OK attempt=$attempt"
              published=true
              break
            fi

            echo "APP_READY_SIMULATION_HOT_PUBLISH_RETRY attempt=$attempt"
            sleep $((attempt * 2))
          done

          [[ "$published" == "true" ]] || {
            echo "Could not publish App-Ready simulation hotfix after 5 retries" >&2
            exit 1
          }
