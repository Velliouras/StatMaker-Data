name: Betting V2 Coverage Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/betting-v2-coverage-diagnostic'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual App-Ready SQLite source coverage and V2 odds thresholds
        shell: bash
        run: |
          python - <<'PY'
          import json,sqlite3,zipfile,tempfile,collections
          from pathlib import Path
          manifest=json.loads(Path('data/statmaker/app_ready/update_manifest.json').read_text())
          print('PUBLISHED',manifest['generatedAt'],manifest.get('metadata',{}).get('bettingV2DirectModel'))
          bundle=next(a for a in manifest['artifacts'] if a['id']=='app_ready_betting_bundle')
          with tempfile.TemporaryDirectory() as t:
              with zipfile.ZipFile(bundle['path']) as z:
                  z.extract('databases/statmaker_prepared_betting.db',t)
              db=sqlite3.connect(str(Path(t)/'databases/statmaker_prepared_betting.db'))
              db.row_factory=sqlite3.Row
              def show(label,sql):
                  rows=db.execute(sql).fetchall()
                  print(label,json.dumps([dict(x) for x in rows],ensure_ascii=False))
              show('FIXTURE_SCOPE',"""
                  SELECT f.competition_id,f.league_code,
                  COUNT(DISTINCT f.match_key) fixtures,
                  COUNT(q.ordinal) quotes,
                  COUNT(v.market_ordinal) forecasts
                  FROM prepared_fixture_matches f
                  LEFT JOIN prepared_fixture_markets q
                    ON q.competition_id=f.competition_id
                   AND q.snapshot_version=f.snapshot_version
                   AND q.match_key=f.match_key
                  LEFT JOIN prepared_betting_v2_forecasts v
                    ON v.competition_id=f.competition_id
                   AND v.snapshot_version=f.snapshot_version
                   AND v.match_key=f.match_key
                   AND v.market_ordinal=q.ordinal
                  WHERE f.usable_for_stats=1
                  GROUP BY f.competition_id,f.league_code
                  ORDER BY forecasts DESC
              """)
              show('V2_MARKET_FAMILY',"""
                 SELECT competition_id,market,metric_key,
                 COUNT(*) n,
                 SUM(CASE WHEN odd>1.8 AND odd<3 AND win_probability>=0.6
                           AND win_probability*odd+push_probability>1 THEN 1 ELSE 0 END) eligible
                 FROM prepared_betting_v2_forecasts
                 GROUP BY competition_id,market,metric_key
                 ORDER BY n DESC LIMIT 130
              """)
              show('V2_ELIGIBLE_COMP',"""
                 SELECT competition_id,
                 COUNT(*) forecasts,
                 SUM(CASE WHEN odd>1.8 AND odd<3 AND win_probability>=0.6
                         AND win_probability*odd+push_probability>1 THEN 1 ELSE 0 END) eligible
                 FROM prepared_betting_v2_forecasts GROUP BY competition_id
              """)
              show('UEFA_NEXT_FIXTURES',"""
                 SELECT f.competition_id,f.league_code,f.home_team,f.away_team,f.kickoff,
                 COUNT(q.ordinal) offers,COUNT(v.market_ordinal) forecasts
                 FROM prepared_fixture_matches f
                 LEFT JOIN prepared_fixture_markets q ON q.competition_id=f.competition_id
                   AND q.snapshot_version=f.snapshot_version AND q.match_key=f.match_key
                 LEFT JOIN prepared_betting_v2_forecasts v ON v.competition_id=f.competition_id
                   AND v.snapshot_version=f.snapshot_version AND v.match_key=f.match_key
                   AND v.market_ordinal=q.ordinal
                 WHERE f.competition_id IN ('champions_league','europa_league','conference_league')
                 GROUP BY f.competition_id,f.league_code,f.match_key
                 ORDER BY f.kickoff ASC LIMIT 24
              """)
              show('UEFA_IDENTITY_COVERAGE',"""
                 SELECT competition_id,league_code,usable_for_stats,team_mapping_status,
                        COUNT(*) fixtures
                 FROM prepared_fixture_matches
                 WHERE competition_id IN ('champions_league','europa_league','conference_league')
                 GROUP BY competition_id,league_code,usable_for_stats,team_mapping_status
                 ORDER BY competition_id,fixtures DESC
              """)
              show('UEFA_FORECAST_MARKETS',"""
                 SELECT f.competition_id,f.league_code,f.home_team,f.away_team,
                        f.team_mapping_status,f.usable_for_stats,
                        v.market,v.selection,v.odd,v.win_probability
                 FROM prepared_betting_v2_forecasts v
                 JOIN prepared_fixture_matches f ON f.competition_id=v.competition_id
                     AND f.snapshot_version=v.snapshot_version AND f.match_key=v.match_key
                 WHERE f.competition_id IN ('champions_league','europa_league','conference_league')
                 ORDER BY f.kickoff ASC LIMIT 40
              """)
              show('COUNT_LINE_COVERAGE',"""
                 SELECT market,COUNT(*) total,
                 SUM(CASE WHEN line IS NOT NULL THEN 1 ELSE 0 END) explicit_line,
                 MIN(selection) example
                 FROM prepared_fixture_markets WHERE market IN
                 ('MATCH_CORNERS','TEAM_CORNERS','MATCH_SHOTS','TEAM_SHOTS',
                 'MATCH_SHOTS_ON_TARGET','TEAM_SHOTS_ON_TARGET',
                 'MATCH_GOALS','TEAM_GOALS')
                 GROUP BY market ORDER BY total DESC
              """)
              show('MARKET_1X2_ODDS',"""
                 SELECT market,selection,COUNT(*) n FROM prepared_fixture_markets
                 WHERE UPPER(market) IN ('1X2','MATCH_RESULT','DOUBLE_CHANCE','MATCH_GOALS','MATCH_CORNERS')
                 GROUP BY market,selection ORDER BY n DESC LIMIT 40
              """)
              db.close()
          PY
          python - <<'PY'
          import sys,collections
          sys.path.insert(0,"scripts")
          from materialize_betting_v2_direct import load_actual_results,name
          data=load_actual_results()
          from pathlib import Path
          import json
          u=json.loads(Path("data/statmaker/uefa_current_stats.json").read_text())
          for comp in u['competitions']:
              code=comp['leagueCode']
              hist=data.get(code,[])
              by_team=collections.Counter(t for x in hist for t in (x['_home'],x['_away']))
              members=[name(n) for n in comp.get('participants',[])]
              covered=[n for n in members if by_team[n]]
              print("UEFA_HISTORY",code,"matches",len(hist),"teams",len(by_team),
                    "members",len(members),"directly_covered",len(covered),
                    "missing_members",[n for n in members if not by_team[n]][:25])
          PY
          python - <<'PY'
          import sys,json,sqlite3,tempfile,zipfile,collections
          from pathlib import Path
          sys.path.insert(0,"scripts")
          import materialize_betting_v2_direct as m
          h=m.load_actual_results()
          manifest=json.loads(Path('data/statmaker/app_ready/update_manifest.json').read_text())
          bundle=next(x for x in manifest['artifacts'] if x['id']=='app_ready_betting_bundle')
          with tempfile.TemporaryDirectory() as t:
              with zipfile.ZipFile(bundle['path']) as z:
                  z.extract('databases/statmaker_prepared_betting.db',t)
              db=sqlite3.connect(str(Path(t)/'databases/statmaker_prepared_betting.db'))
              db.row_factory=sqlite3.Row
              for comp in ('champions_league','europa_league','conference_league'):
                  rows=db.execute("""SELECT id,league_code,home_team,away_team,
                          canonical_home_team,canonical_away_team,
                          provider_home_team,provider_away_team,
                          home_team_logo,away_team_logo
                          FROM prepared_fixture_matches WHERE competition_id=?""",(comp,)).fetchall()
                  total=collections.Counter()
                  sample=[]
                  for row in rows:
                      league=row['league_code']
                      alias=m.UEFA_ALIASES.get(league,{})
                      known={t for f in h.get(league,[]) for t in (f['_home'],f['_away'])}
                      home=[m.name(row[k]) for k in ('home_team','canonical_home_team','provider_home_team')]
                      away=[m.name(row[k]) for k in ('away_team','canonical_away_team','provider_away_team')]
                      home_ok=any(alias.get(v,v) in known for v in home)
                      away_ok=any(alias.get(v,v) in known for v in away)
                      total[str((home_ok,away_ok))]+=1
                      if not (home_ok and away_ok) and len(sample)<12:
                          sample.append(dict(id=row['id'],home=row['home_team'],away=row['away_team'],
                               canonicalHome=row['canonical_home_team'],
                               canonicalAway=row['canonical_away_team'],
                               providerHome=row['provider_home_team'],
                               providerAway=row['provider_away_team'],
                               homeLogo=row['home_team_logo'],
                               awayLogo=row['away_team_logo'],
                               homeFound=home_ok,awayFound=away_ok))
                  print('UEFA_IDENTITY_GAPS',comp,len(rows),dict(total),json.dumps(sample,ensure_ascii=False))
              db.close()
          PY
