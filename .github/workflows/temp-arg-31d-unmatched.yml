name: Temporary ARG 31d Unmatched Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-arg-31d-unmatched.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture production-mapper unmatched names with one events call
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path
          import audit_domestic_mapping as audit
          import domestic_live_july_pipeline as pipeline
          import update_domestic_odds_api_io as odds

          registry = pipeline.load_json(pipeline.REGISTRY_PATH, {}).get('leagues', [])
          arg_row = next(x for x in registry if x.get('leagueCode') == 'ARG')
          aliases = pipeline.generated_aliases(registry)
          debug = {'warnings': [], 'apiCalls': []}
          events = odds.fetch_events_for_league(
              __import__('os').environ['ODDS_API_IO_KEY'],
              str(arg_row.get('providerLeagueSlug')),
              31,
              debug,
          )
          canonicals = audit.canonical_teams(pipeline.load_json(pipeline.DOMESTIC_CONFIG, {}))
          teams = sorted({t for e in events for t in (odds.event_home(e), odds.event_away(e)) if t})
          rows = []
          for team in teams:
              local_debug = {}
              mapped, canonical = odds.canonical_team_info(team, 'ARG', aliases, local_debug)
              if canonical is None:
                  suggested, status, suggestions = audit.map_team(team, 'ARG', aliases, canonicals)
                  rows.append({
                      'providerTeam': team,
                      'normalized': odds.normalize_text(team, drop_suffixes=True),
                      'suggestedCanonical': suggested,
                      'auditStatus': status,
                      'suggestions': suggestions,
                  })
          payload = {
              'leagueCode': 'ARG',
              'providerSlug': arg_row.get('providerLeagueSlug'),
              'horizonDays': 31,
              'eventCount': len(events),
              'teamCount': len(teams),
              'unmatchedCount': len(rows),
              'unmatched': rows,
              'apiCallCount': len(debug.get('apiCalls', [])),
              'rateLimitRemaining': debug.get('rateLimitRemaining'),
          }
          out = Path('reports/temp_arg_31d_unmatched.json')
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/temp_arg_31d_unmatched.json
          git commit -m "Capture remaining ARG 31-day provider names"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
