name: Domestic 53-League Statistics Universe

on:
  workflow_dispatch:
    inputs:
      stats_max_requests:
        description: "Maximum API-Football requests for this run"
        required: true
        default: "2400"
        type: string
  schedule:
    - cron: "11 3 * * *"

permissions:
  contents: write

concurrency:
  group: domestic-statistics-universe
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test scope, rolling registry and real-stat completeness policy
        id: tests
        continue-on-error: true
        run: |
          mkdir -p reports
          python -m unittest \
            tests/test_statmaker_domestic_scope.py \
            tests/test_stats_universe_registry.py \
            tests/test_domestic_live_july_pipeline.py \
            tests/test_domestic_stats_completeness.py \
            > reports/domestic_live_july_tests.log 2>&1
          cat reports/domestic_live_july_tests.log

      - name: Refresh rolling 53-league Stats registry
        id: registry
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python scripts/run_scoped_domestic_registry.py \
            > reports/domestic_live_july_registry.log 2>&1
          cat reports/domestic_live_july_registry.log

      - name: Incrementally refresh API-Football statistics
        id: stats
        if: steps.registry.outcome == 'success'
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          INPUT_STATS_MAX_REQUESTS: ${{ inputs.stats_max_requests }}
        run: |
          stats_requests="${INPUT_STATS_MAX_REQUESTS:-2400}"
          python scripts/refresh_domestic_live_july_stats.py \
            --max-requests "$stats_requests" \
            > reports/domestic_live_july_stats.log 2>&1
          cat reports/domestic_live_july_stats.log

      - name: Expand every available cached statistic
        id: expand
        if: steps.stats.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/expand_domestic_full_stats.py \
            > reports/domestic_live_july_full_stats.log 2>&1
          cat reports/domestic_live_july_full_stats.log

      - name: Rebuild app statistics from refreshed caches
        id: rebuild
        if: steps.expand.outcome == 'success'
        continue-on-error: true
        run: |
          {
            python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import domestic_live_july_pipeline as pipeline
          registry = pipeline.load_json(pipeline.REGISTRY_PATH, {}).get('leagues', [])
          if not registry:
              raise SystemExit('Domestic Stats registry is empty')
          pipeline.build_app_statistics(registry)
          PY
            python scripts/finalize_domestic_live_july_artifacts.py
            python scripts/build_domestic_live_july_normalized_stats.py
            python scripts/build_uefa_support_history.py
          } > reports/domestic_live_july_rebuild.log 2>&1
          cat reports/domestic_live_july_rebuild.log

      - name: Validate published statistics and separated odds boundaries
        id: validate
        if: steps.rebuild.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY' > reports/domestic_live_july_validate.log 2>&1
          import json
          from pathlib import Path

          root = Path('.')
          registry = json.loads((root / 'data/statmaker/domestic_live_july_registry.json').read_text(encoding='utf-8'))
          index = json.loads((root / 'data/statmaker/domestic_enriched/index.json').read_text(encoding='utf-8'))
          odds = json.loads((root / 'odds/odds_api_io/domestic_odds.json').read_text(encoding='utf-8'))
          normalized = json.loads((root / 'data/api_football/domestic_normalized_fixture_stats.json').read_text(encoding='utf-8'))
          progress = json.loads((root / 'reports/domestic_live_july_stats_refresh.json').read_text(encoding='utf-8'))
          uefa_support = json.loads((root / 'data/statmaker/uefa_support_history.json').read_text(encoding='utf-8'))
          scope_contract = json.loads((root / 'config/statmaker_final_domestic_scope.json').read_text(encoding='utf-8'))

          normalize = lambda code: 'ROU' if str(code or '').strip().upper() == 'ROM' else str(code or '').strip().upper()
          stats_universe = {normalize(code) for code in scope_contract.get('statsUniverseLeagueCodes', [])}
          core_odds = {normalize(code) for code in scope_contract.get('coreOddsLeagueCodes', [])}
          registry_codes = {normalize(item.get('leagueCode')) for item in registry.get('leagues', [])}
          index_codes = {normalize(item.get('league_code')) for item in index.get('leagues', [])}
          odds_codes = {normalize(item.get('leagueCode')) for item in odds.get('leagues', [])}
          normalized_codes = {normalize(item.get('league_code')) for item in normalized.get('fixtures', [])}
          required_fields = {
              'HS', 'AS', 'HST', 'AST', 'HC', 'AC', 'HF', 'AF', 'HY', 'AY', 'HR', 'AR',
              'HPossession', 'APossession', 'HSaves', 'ASaves', 'HPasses', 'APasses',
              'HPassesAccurate', 'APassesAccurate', 'HxG', 'AxG',
              'HShotsOffGoal', 'AShotsOffGoal', 'HBlockedShots', 'ABlockedShots',
              'HShotsInsideBox', 'AShotsInsideBox', 'HShotsOutsideBox', 'AShotsOutsideBox',
              'HOffsides', 'AOffsides', 'HPassAccuracy', 'APassAccuracy',
              'HGoalsPrevented', 'AGoalsPrevented', 'HFreeKicks', 'AFreeKicks'
          }

          if len(stats_universe) != 53:
              raise SystemExit(f'Stats universe contract must contain 53 leagues, got {len(stats_universe)}')
          if len(core_odds) != 27:
              raise SystemExit(f'Core odds contract must contain 27 leagues, got {len(core_odds)}')
          if not registry_codes:
              raise SystemExit('Domestic Stats registry is empty')
          if not registry_codes.issubset(stats_universe):
              raise SystemExit(f'Registry contains league outside 53-league Stats universe: {sorted(registry_codes - stats_universe)}')
          if registry_codes != index_codes:
              raise SystemExit(f'Stats index mismatch: registry={len(registry_codes)} index={len(index_codes)}')
          if not odds_codes.issubset(core_odds):
              raise SystemExit(f'Production odds contain league outside protected core odds scope: {sorted(odds_codes - core_odds)}')
          if not normalized_codes.issubset(registry_codes):
              raise SystemExit('Normalized stats contain a league outside the rolling Stats registry')
          if not required_fields.issubset(set(normalized.get('fields', []))):
              raise SystemExit('Normalized stats export is missing one or more available stat fields')
          if progress.get('completenessContract') != 'final score plus at least one non-null normalized API-Football statistic':
              raise SystemExit('Stats refresh used the obsolete dictionary-existence completeness rule')
          if int(progress.get('statsUniverseLeagueCount') or 0) != 53:
              raise SystemExit('Stats refresh did not use the 53-league Stats universe contract')
          if int(progress.get('coreOddsLeagueCount') or 0) != 27:
              raise SystemExit('Stats refresh did not preserve the 27-league core odds boundary')

          support_participants = uefa_support.get('participants', []) or []
          support_minimum = int(uefa_support.get('minimumMatchesPerParticipant') or 10)
          if not support_participants:
              raise SystemExit('UEFA support history is empty')
          for participant in support_participants:
              matches = participant.get('matches', []) or []
              if len(matches) < support_minimum:
                  raise SystemExit(
                      f"UEFA support participant below readiness minimum: {participant.get('canonicalTeam')}={len(matches)}"
                  )

          index_rows = {normalize(item.get('league_code')): item for item in index.get('leagues', [])}
          for code, row in index_rows.items():
              output_path = root / str(row.get('output_path') or '')
              if not output_path.is_file():
                  raise SystemExit(f'Missing app stats artifact for {code}: {output_path}')
              artifact = json.loads(output_path.read_text(encoding='utf-8'))
              for match in artifact.get('matches', []) or []:
                  if match.get('home_goals') is None or match.get('away_goals') is None:
                      raise SystemExit(f'Completed stats match without full-time score: {code}')

          for league in odds.get('leagues', []):
              for match in league.get('matches', []) or []:
                  for market in match.get('markets', []) or []:
                      if market.get('exactBookmakerOdds') is not True or not market.get('bookmaker'):
                          raise SystemExit('Non-exact market found in production Domestic odds artifact')

          print(
              f"Validated Stats registry={len(registry_codes)}/53 configured; core odds={len(odds_codes)}/27; "
              f"{len(normalized.get('fixtures', []))} normalized fixtures; "
              f"{len(normalized.get('fields', []))} stat fields; "
              f"UEFA support participants={len(support_participants)}; incomplete leagues={progress.get('incompleteAfter')}"
          )
          PY
          cat reports/domestic_live_july_validate.log

      - name: Write pipeline status
        run: |
          {
            echo "tests=${{ steps.tests.outcome }}"
            echo "registry=${{ steps.registry.outcome }}"
            echo "stats=${{ steps.stats.outcome }}"
            echo "expand=${{ steps.expand.outcome }}"
            echo "rebuild=${{ steps.rebuild.outcome }}"
            echo "validate=${{ steps.validate.outcome }}"
            echo "commit=${GITHUB_SHA}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > reports/domestic_live_july_workflow_status.txt

      - name: Commit artifacts and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/domestic_live_july_*.log reports/domestic_live_july_workflow_status.txt
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            git add \
              data/api_football/fixture_stats \
              data/api_football/domestic_normalized_fixture_stats.json \
              data/statmaker/domestic_enriched \
              data/statmaker/domestic_live_july_registry.json \
              data/statmaker/domestic_live_july_state.json \
              data/statmaker/uefa_support_history.json \
              reports/api_football_fixture_stats_fetch.json \
              reports/api_football_fixture_stats_fetch.csv \
              reports/api_football_fixture_stats_fetch.md \
              reports/statmaker_domestic_enriched_build.json \
              reports/statmaker_domestic_enriched_build.csv \
              reports/statmaker_domestic_enriched_build.md \
              reports/domestic_live_july_pipeline.json \
              reports/domestic_live_july_stats_refresh.json \
              reports/domestic_live_july_full_stats_expansion.json \
              reports/domestic_live_july_artifact_contract.json \
              reports/domestic_live_july_normalized_stats.json
          fi
          if git diff --cached --quiet; then
            echo "No Domestic statistics-universe changes to commit."
          else
            git commit -m "Record 53-league Domestic statistics run"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Fail when the pipeline is not valid
        if: steps.validate.outcome != 'success'
        run: exit 1
