name: Temporary Schedule Only Validation Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-schedule-only-validation-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Separate verified schedule-only rows from betting validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/refresh_domestic_odds_schedule_priority.py')
          source = path.read_text(encoding='utf-8')
          old = '''                    safe_api_schedule_only = (\n                        row.get("scheduleOnly") is True\n                        and row.get("scheduleVerified") is True\n                        and str(row.get("scheduleSource") or "").strip() == "api-football"\n                        and not (row.get("markets") or [])\n                    )\n                    if safe_api_schedule_only:\n                        schedule_only_in_registry += 1\n                    else:\n                        betting_matches.append(row)\n'''
          new = '''                    safe_verified_schedule_only = (\n                        row.get("scheduleOnly") is True\n                        and row.get("scheduleVerified") is True\n                        and str(row.get("scheduleSource") or "").strip()\n                        in {"api-football", "odds-api-io-events"}\n                        and not (row.get("markets") or [])\n                    )\n                    if safe_verified_schedule_only:\n                        schedule_only_in_registry += 1\n                    else:\n                        betting_matches.append(row)\n'''
          if old not in source:
              raise SystemExit('Expected schedule-only validation block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_domestic_schedule_only_validation.py')
          test.write_text('''import datetime as dt\nimport sys\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nSCRIPTS = ROOT / "scripts"\nif str(SCRIPTS) not in sys.path:\n    sys.path.insert(0, str(SCRIPTS))\n\nimport refresh_domestic_odds_schedule_priority as target\n\n\nclass DomesticScheduleOnlyValidationTest(unittest.TestCase):\n    def setUp(self):\n        self.original = target.target.validate_feed\n        target._install_schedule_only_validation()\n\n    def tearDown(self):\n        target.target.validate_feed = self.original\n\n    def registry(self):\n        return [{"leagueCode": "AUT"}]\n\n    def test_verified_odds_api_schedule_only_unmapped_row_is_not_betting_validated(self):\n        feed = {"leagues": [{\n            "leagueCode": "AUT",\n            "matches": [{\n                "id": "72345460",\n                "date": "2026-08-14",\n                "providerHomeTeam": "LASK Linz",\n                "providerAwayTeam": "SV Ried",\n                "teamMappingStatus": "partial",\n                "usableForStats": False,\n                "scheduleOnly": True,\n                "scheduleSource": "odds-api-io-events",\n                "scheduleVerified": True,\n                "markets": [],\n            }],\n        }]}\n        result = target.target.validate_feed(feed, self.registry(), dt.date(2026, 8, 14))\n        self.assertEqual(1, result["scheduleOnlyInRegistryMatchCount"])\n        self.assertEqual(0, result["matchCount"])\n\n    def test_schedule_row_with_market_still_requires_exact_mapping(self):\n        feed = {"leagues": [{\n            "leagueCode": "AUT",\n            "matches": [{\n                "id": "72345460",\n                "date": "2026-08-14",\n                "teamMappingStatus": "partial",\n                "usableForStats": False,\n                "scheduleOnly": True,\n                "scheduleSource": "odds-api-io-events",\n                "scheduleVerified": True,\n                "markets": [{\n                    "market": "1X2",\n                    "bookmaker": "Bet365",\n                    "odds": 2.0,\n                    "exactBookmakerOdds": True,\n                }],\n            }],\n        }]}\n        with self.assertRaises(RuntimeError):\n            target.target.validate_feed(feed, self.registry(), dt.date(2026, 8, 14))\n\n    def test_unverified_zero_market_row_still_fails_closed(self):\n        feed = {"leagues": [{\n            "leagueCode": "AUT",\n            "matches": [{\n                "id": "72345460",\n                "date": "2026-08-14",\n                "teamMappingStatus": "partial",\n                "usableForStats": False,\n                "scheduleOnly": True,\n                "scheduleSource": "odds-api-io-events",\n                "scheduleVerified": False,\n                "markets": [],\n            }],\n        }]}\n        with self.assertRaises(RuntimeError):\n            target.target.validate_feed(feed, self.registry(), dt.date(2026, 8, 14))\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Run regressions
        run: |
          python -m py_compile scripts/refresh_domestic_odds_schedule_priority.py
          python -m unittest tests/test_domestic_schedule_only_validation.py
          python -m unittest tests/test_refresh_turkey_super_lig_schedule.py
          python -m unittest tests/test_recanonicalize_stale_domestic_mappings.py
          python -m unittest tests/test_arg_provider_aliases.py
          python -m unittest tests/test_domestic_live_july_pipeline.py
      - name: Commit durable schedule validation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/refresh_domestic_odds_schedule_priority.py tests/test_domestic_schedule_only_validation.py
          git commit -m "Separate verified Domestic schedule-only rows from betting validation"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
