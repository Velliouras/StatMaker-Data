name: Domestic League Simulation Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domestic-simulation-refresh.yml'
      - 'scripts/refresh_domestic_simulations.py'
      - 'scripts/simulation_priority_inputs.py'
      - 'tests/test_domestic_simulation_refresh.py'
  workflow_run:
    workflows: ['Priority Results and Official Standings', 'App-Ready Stats Hot Publish', 'API-Football Standings Fetch', 'App-Ready Simulation Hot Publish']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '11,41 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: statmaker-app-ready-targeted-writers
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: .:scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/domestic-simulation-refresh.yml
            /scripts/
            /tests/test_domestic_simulation_refresh.py
            /config/
            /data/statmaker/app_ready/
            /data/statmaker/domestic_enriched/index.json
            /data/api_football/fixture_stats/
            /data/api_football/standings/
            /data/statmaker/priority_refresh/
            /reports/domestic_simulation_refresh.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify incremental simulation and current-score regressions offline
        run: python -m unittest discover -s tests -p test_domestic_simulation_refresh.py -v
      - name: Refresh only changed domestic leagues and publish verified bundle
        id: refresh
        run: |
          git config user.name 'statmaker-data-bot'
          git config user.email 'statmaker-data-bot@users.noreply.github.com'
          python -u -m scripts.refresh_domestic_simulations
      - name: Recover missing Elo seasons from verified cached inputs
        if: steps.refresh.outputs.elo_recovery_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh api "repos/${{ github.repository }}/actions/workflows/app-ready-simulation-hot-publish.yml/runs?branch=main&per_page=30" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$active" -gt 0 ]; then
            echo 'Cached simulation recovery already queued or running'
          else
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/app-ready-simulation-hot-publish.yml/dispatches" -f ref=main
            echo 'Requested cached simulation rebuild for missing Elo seasons'
          fi
