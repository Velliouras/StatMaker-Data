name: Greece Super League 2 Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "47 1,7,13,19 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/greece-super-league-2-sync.yml"
      - "scripts/publish_greece_super_league_2.sh"
      - "tests/test_publish_greece_super_league_2.py"
      - "scripts/refresh_greece_super_league_2.py"
      - "tests/test_refresh_greece_super_league_2.py"

permissions:
  contents: write

concurrency:
  # Serialize every workflow that writes canonical StatMaker main data.
  # One running writer at a time prevents manifest/data rebase collisions.
  group: statmaker-canonical-main-writer
  queue: max
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run regression tests
        run: |
          python -m py_compile scripts/refresh_greece_super_league_2.py
          python -m unittest tests/test_refresh_greece_super_league_2.py
          python -m unittest tests/test_publish_greece_super_league_2.py

      - name: Sync Super League 2 history and schedule
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          G2_STATS_REQUEST_CAP: "45"
          G2_SCHEDULE_HORIZON_DAYS: "120"
        run: python scripts/refresh_greece_super_league_2.py

      - name: Sanitize Domestic odds without dropping schedule-only fixtures
        run: |
          python scripts/odds_market_integrity.py \
            odds/odds_api_io/domestic_odds.json \
            --write \
            --report-dir reports

      - name: Commit Super League 2 artifacts
        run: bash scripts/publish_greece_super_league_2.sh
