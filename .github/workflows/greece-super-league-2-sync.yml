name: Greece Super League 2 Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "47 1,7,13,19 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_greece_super_league_2.py"
      - "tests/test_refresh_greece_super_league_2.py"

permissions:
  contents: write

concurrency:
  # Serialize every workflow that writes canonical StatMaker main data.
  # One running writer at a time prevents manifest/data rebase collisions.
  group: statmaker-canonical-main-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run regression tests
        run: |
          python -m py_compile scripts/refresh_greece_super_league_2.py
          python -m unittest tests/test_refresh_greece_super_league_2.py

      - name: Sync Super League 2 history and schedule
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          G2_STATS_REQUEST_CAP: "45"
          G2_SCHEDULE_HORIZON_DAYS: "120"
        run: python scripts/refresh_greece_super_league_2.py

      - name: Sanitize Domestic odds without dropping schedule-only fixtures
        run: |
          python scripts/odds_market_integrity.py \
            odds/odds_api_io/domestic_odds.json \
            --write \
            --report-dir reports

      - name: Build Domestic update manifest
        run: |
          python scripts/build_statmaker_update_manifest.py \
            --profile main \
            --branch main \
            --output data/statmaker/update_manifest.json

      - name: Commit Super League 2 artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/api_football/fixture_stats/greece/super-league-2/2025/fixture_stats.json \
            data/statmaker/domestic_enriched/greece_super_league_2_2025.json \
            data/statmaker/domestic_enriched/index.json \
            odds/odds_api_io/domestic_odds.json \
            data/statmaker/update_manifest.json \
            reports/greece_super_league_2_sync.json \
            reports/domestic_odds_integrity.json
          if git diff --cached --quiet; then
            echo "No Super League 2 changes."
            exit 0
          fi

          git commit -m "Add Greece Super League 2 schedule and history"

          # Canonical writers are serialized, but the latency-critical live-settlement lane
          # may still advance main between fetch and push. Rebase only over non-overlapping
          # live artifacts and retry the narrow non-fast-forward window without re-running
          # provider work.
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            if ! git rebase refs/remotes/origin/main; then
              echo "Super League 2 ownership conflict detected during rebase."
              git rebase --abort || true
              exit 1
            fi

            # Rebuild the deterministic manifest after every rebase so it describes the
            # exact canonical tree being proposed for publication.
            python scripts/build_statmaker_update_manifest.py \
              --profile main \
              --branch main \
              --output data/statmaker/update_manifest.json
            git add data/statmaker/update_manifest.json
            if ! git diff --cached --quiet; then
              git commit -m "Rebuild main manifest after producer rebase"
            fi

            if git push origin HEAD:main; then
              echo "G2_PUBLISH_OK attempt=${attempt}"
              published=true
              break
            fi

            echo "G2 push attempt ${attempt} lost a remote race; retrying without provider calls."
            sleep $((attempt * 2))
          done

          [[ "$published" == "true" ]] || {
            echo "Could not publish Super League 2 artifacts after 5 retries." >&2
            exit 1
          }
