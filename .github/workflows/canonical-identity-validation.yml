name: Canonical Team Identity Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'StatMaker App-Ready Artifact Publisher'
      - 'App-Ready Simulation Hot Publish'
      - 'App-Ready Stats Hot Publish'
      - 'App-Ready Score Edge Hot Publish'
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/canonical-identity-validation.yml'
      - 'scripts/canonical_team_identity.py'
      - 'scripts/domestic_betting_identity.py'
      - 'tests/test_canonical_identity_universe.py'
      - 'scripts/validate_domestic_cache_provider_identity.py'
      - 'scripts/domestic_odds_expansion.py'
      - 'tests/test_sau_provider_aliases.py'
      - 'tests/test_current_provider_aliases.py'
      - 'tests/test_recanonicalize_stale_domestic_mappings.py'
      - 'scripts/refresh_live_settlements.py'
      - 'scripts/audit_app_ready_fixture_team_date_uniqueness.py'
      - 'scripts/audit_app_ready_fixture_index_uniqueness.py'
      - 'mappings/domestic_team_aliases.json'
      - 'data/statmaker/domestic_rosters.json'
      - 'data/statmaker/domestic_live_july_registry.json'
      - 'data/statmaker/domestic_enriched/**'
      - 'odds/odds_api_io/domestic_odds.json'
      - 'data/statmaker/app_ready/**'

permissions:
  contents: read

concurrency:
  group: canonical-team-identity-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify strict Saudi cross-provider aliases
        run: python -m unittest discover -s tests -p test_sau_provider_aliases.py -v

      - name: Verify current Scottish and Israeli cross-provider aliases
        run: python -m unittest discover -s tests -p test_current_provider_aliases.py -v

      - name: Verify existing cached provider-name repairs
        run: python -m unittest discover -s tests -p test_recanonicalize_stale_domestic_mappings.py -v

      - name: Validate canonical Domestic provider identity
        run: |
          python -m unittest discover -s tests -p test_canonical_identity_universe.py -v
          python scripts/domestic_betting_identity.py --check-only
          python scripts/validate_domestic_cache_provider_identity.py

      - name: Validate settlement candidate identity from App-Ready bundles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import refresh_live_settlements as settlement
          rows = settlement.canonical_requirements()
          if not rows:
              raise SystemExit('SETTLEMENT_REQUIREMENTS_EMPTY')
          print('SETTLEMENT_CANDIDATE_IDENTITY_OK', f'requirements={len(rows)}')
          PY

      - name: Validate App-Ready candidate team-date uniqueness
        run: python scripts/audit_app_ready_fixture_team_date_uniqueness.py

      - name: Validate full App-Ready fixture-index uniqueness
        run: python scripts/audit_app_ready_fixture_index_uniqueness.py

      - name: Validate settlement registry identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          root = json.loads(Path('data/statmaker/domestic_live_july_registry.json').read_text(encoding='utf-8-sig'))
          rows = [
              row for row in root.get('leagues', [])
              if isinstance(row, dict) and row.get('enabledForStats') is not False
          ]
          grouped = defaultdict(list)
          for row in rows:
              provider = row.get('api_football_league_id') or row.get('apiFootballLeagueId')
              season = str(row.get('targetApiSeason') or row.get('historyApiSeason') or row.get('season') or '').strip()
              if provider is not None:
                  grouped[(int(provider), season)].append(row)

          ambiguous = []
          for (provider, season), candidates in grouped.items():
              if len(candidates) <= 1:
                  continue
              active = [row for row in candidates if str(row.get('lifecycle') or '').strip().lower() == 'active']
              if len(active) == 1:
                  continue
              ambiguous.append({
                  'providerLeagueId': provider,
                  'season': season,
                  'leagueCodes': [str(row.get('leagueCode') or '') for row in candidates],
                  'activeLeagueCodes': [str(row.get('leagueCode') or '') for row in active],
              })

          if ambiguous:
              raise SystemExit('SETTLEMENT_REGISTRY_IDENTITY_AMBIGUOUS ' + json.dumps(ambiguous[:20], ensure_ascii=False))
          print('SETTLEMENT_REGISTRY_IDENTITY_OK', f'groups={len(grouped)}')
          PY

