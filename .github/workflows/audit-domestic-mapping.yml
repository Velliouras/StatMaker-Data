name: Audit Domestic League and Team Mapping

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".mapping-audit-trigger"

permissions:
  contents: write

concurrency:
  group: audit-domestic-mapping
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate audit script
        run: python -m py_compile scripts/audit_domestic_mapping.py

      - name: Audit league and team mapping only
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: python scripts/audit_domestic_mapping.py

      - name: Guard generated paths
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              reports/domestic_mapping_audit.json)
                ;;
              *)
                echo "Unexpected generated change: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"

      - name: Commit mapping audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/domestic_mapping_audit.json
          if git diff --cached --quiet; then
            echo "No mapping audit changes to commit."
          else
            git commit -m "Audit Domestic league and team mappings"
            git pull --rebase
            git push
          fi
