name: App-Ready Pipeline Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/app-ready-artifact-publisher.yml'
      - '.github/workflows/app-ready-pipeline-validation.yml'
      - 'scripts/preflight_app_ready_pipeline.py'
      - 'scripts/stage_app_ready_producer.sh'
      - 'scripts/patch_app_ready_producer.py'
      - 'scripts/app_ready_v10/**'
      - 'scripts/patch_prepared_publisher_diagnostics.py'
      - 'scripts/patch_prepared_publisher_bulk.py'
      - 'scripts/run_app_ready_emulator.sh'
      - 'scripts/build_app_ready_from_device.py'
      - 'scripts/materialize_app_ready_pattern_candidates.py'
      - 'scripts/materialize_prepared_fixture_index.py'

permissions:
  contents: read

concurrency:
  group: statmaker-app-ready-pipeline-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate script syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/preflight_app_ready_pipeline.py \
            scripts/patch_app_ready_producer.py \
            scripts/patch_prepared_publisher_diagnostics.py \
            scripts/patch_prepared_publisher_bulk.py \
            scripts/build_app_ready_from_device.py \
            scripts/materialize_app_ready_pattern_candidates.py \
            scripts/materialize_prepared_fixture_index.py
          bash -n scripts/stage_app_ready_producer.sh
          bash -n scripts/run_app_ready_emulator.sh

      - name: Enforce heavy publisher trigger separation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/app-ready-artifact-publisher.yml').read_text(encoding='utf-8')
          try:
              push=text.split('  push:',1)[1].split('  schedule:',1)[0]
          except IndexError as exc:
              raise SystemExit('Could not isolate heavy publisher push trigger section') from exc
          forbidden=[
              '.github/workflows/app-ready-artifact-publisher.yml',
              'scripts/preflight_app_ready_pipeline.py',
              'scripts/stage_app_ready_producer.sh',
              'scripts/patch_app_ready_producer.py',
              'scripts/run_app_ready_emulator.sh',
              'scripts/build_app_ready_from_device.py',
              'scripts/materialize_app_ready_pattern_candidates.py',
              'scripts/materialize_prepared_fixture_index.py',
          ]
          leaked=[item for item in forbidden if item in push]
          if leaked:
              raise SystemExit('Heavy publisher must not self-trigger on code changes: '+', '.join(leaked))
          print('APP_READY_HEAVY_TRIGGER_SEPARATION_OK')
          PY

      - name: Require private read token
        env:
          TOKEN: "${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}"
        run: test -n "$TOKEN" || (echo 'Missing STATMAKER_PRIVATE_READ_TOKEN' >&2; exit 1)

      - name: Checkout current StatMaker production source
        uses: actions/checkout@v4
        with:
          repository: Velliouras/StatMaker
          ref: main
          token: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
          path: statmaker-private
          fetch-depth: 0
          persist-credentials: false

      - name: Stage publisher producer without building Android
        shell: bash
        run: bash scripts/stage_app_ready_producer.sh statmaker-private

      - name: Run aggregate source and producer preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight_app_ready_pipeline.py \
            --mode source \
            --private-root statmaker-private


      - name: Published Strong Value odds distribution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          import tempfile
          import zipfile
          from pathlib import Path

          manifest = json.loads(Path("data/statmaker/app_ready/update_manifest.json").read_text(encoding="utf-8"))
          betting = next(
              (row for row in manifest.get("artifacts", []) if row.get("id") == "app_ready_betting_bundle"),
              None,
          )
          if not betting:
              raise SystemExit("Published manifest has no app_ready_betting_bundle")
          bundle = Path(str(betting.get("path") or ""))
          if not bundle.is_file():
              raise SystemExit(f"Published betting bundle is missing: {bundle}")

          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(bundle) as zf:
                  names = [name for name in zf.namelist() if name.endswith("databases/statmaker_prepared_betting.db")]
                  if len(names) != 1:
                      raise SystemExit(f"Expected exactly one prepared betting DB in bundle; got {names}")
                  zf.extract(names[0], tmp)
                  db_path = Path(tmp) / names[0]

              con = sqlite3.connect(f"file:{db_path}?mode=ro", uri=True)
              try:
                  generation = con.execute(
                      """
                      SELECT generation_id
                      FROM prepared_pattern_generation
                      WHERE state='ready'
                      ORDER BY built_at_ms DESC
                      LIMIT 1
                      """
                  ).fetchone()
                  if not generation:
                      raise SystemExit("No READY prepared pattern generation in published bundle")
                  generation_id = str(generation[0])

                  where = """
                      generation_id=?
                      AND recommendation_eligible=1
                      AND value_tier='STRONG_VALUE'
                      AND selection_odd>=1.50
                  """
                  rows = con.execute(
                      f"""
                      SELECT
                        CASE
                          WHEN selection_odd < 1.80 THEN '1.50-1.79'
                          WHEN selection_odd < 2.00 THEN '1.80-1.99'
                          WHEN selection_odd < 2.50 THEN '2.00-2.49'
                          ELSE '2.50+'
                        END AS bucket,
                        COUNT(*),
                        ROUND(AVG(selection_odd), 3),
                        ROUND(MIN(selection_odd), 3),
                        ROUND(MAX(selection_odd), 3)
                      FROM prepared_pattern_candidates
                      WHERE {where}
                      GROUP BY bucket
                      ORDER BY MIN(selection_odd)
                      """,
                      (generation_id,),
                  ).fetchall()
                  total = sum(int(row[1]) for row in rows)
                  print(
                      "STRONG_VALUE_ODDS_DISTRIBUTION",
                      f"generation={generation_id[:12]}",
                      f"total={total}",
                      f"published={manifest.get('generatedAt','')}",
                  )
                  for bucket, count, avg_odd, min_odd, max_odd in rows:
                      pct = (100.0 * int(count) / total) if total else 0.0
                      print(
                          "STRONG_VALUE_ODDS_BUCKET",
                          f"bucket={bucket}",
                          f"count={count}",
                          f"pct={pct:.1f}",
                          f"avg={avg_odd}",
                          f"min={min_odd}",
                          f"max={max_odd}",
                      )

                  by_date = con.execute(
                      f"""
                      SELECT local_date,
                             COUNT(*),
                             SUM(CASE WHEN selection_odd < 1.80 THEN 1 ELSE 0 END),
                             SUM(CASE WHEN selection_odd >= 1.80 AND selection_odd < 2.00 THEN 1 ELSE 0 END),
                             SUM(CASE WHEN selection_odd >= 2.00 AND selection_odd < 2.50 THEN 1 ELSE 0 END),
                             SUM(CASE WHEN selection_odd >= 2.50 THEN 1 ELSE 0 END),
                             ROUND(AVG(selection_odd), 3)
                      FROM prepared_pattern_candidates
                      WHERE {where}
                      GROUP BY local_date
                      ORDER BY local_date
                      """,
                      (generation_id,),
                  ).fetchall()
                  for date, count, b1, b2, b3, b4, avg_odd in by_date:
                      print(
                          "STRONG_VALUE_ODDS_DATE",
                          f"date={date}",
                          f"total={count}",
                          f"1.50-1.79={b1}",
                          f"1.80-1.99={b2}",
                          f"2.00-2.49={b3}",
                          f"2.50+={b4}",
                          f"avg={avg_odd}",
                      )


                  metrics = con.execute(
                      """
                      SELECT
                        CASE
                          WHEN c.selection_odd < 1.80 THEN '1.50-1.79'
                          WHEN c.selection_odd < 2.00 THEN '1.80-1.99'
                          WHEN c.selection_odd < 2.50 THEN '2.00-2.49'
                          ELSE '2.50+'
                        END AS bucket,
                        COUNT(*),
                        ROUND(AVG(c.selection_odd), 3),
                        ROUND(AVG(s.value_signal_market_probability), 4),
                        ROUND(AVG(s.value_signal_conservative_probability), 4),
                        ROUND(AVG(s.value_signal_edge), 4),
                        ROUND(AVG(s.value_signal_expected_value), 4),
                        ROUND(AVG(s.value_signal_reliability), 4),
                        ROUND(AVG(s.value_signal_ranking_score), 4)
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                      GROUP BY bucket
                      ORDER BY MIN(c.selection_odd)
                      """,
                      (generation_id,),
                  ).fetchall()
                  for bucket, count, avg_odd, market_p, model_p, edge, ev, reliability, rank in metrics:
                      print(
                          "STRONG_VALUE_ODDS_METRICS",
                          f"bucket={bucket}",
                          f"count={count}",
                          f"avg_odd={avg_odd}",
                          f"market_p={market_p}",
                          f"model_p={model_p}",
                          f"edge={edge}",
                          f"ev={ev}",
                          f"reliability={reliability}",
                          f"rank={rank}",
                      )

                  focus = con.execute(
                      """
                      SELECT
                        CASE
                          WHEN c.selection_odd < 1.80 THEN '1.50-1.79'
                          WHEN c.selection_odd < 2.00 THEN '1.80-1.99'
                          WHEN c.selection_odd < 2.50 THEN '2.00-2.49'
                          ELSE '2.50+'
                        END AS bucket,
                        COUNT(*),
                        ROUND(AVG(c.selection_odd), 3),
                        ROUND(AVG(s.value_signal_market_probability), 4),
                        ROUND(AVG(s.value_signal_conservative_probability), 4),
                        ROUND(AVG(s.value_signal_edge), 4),
                        ROUND(AVG(s.value_signal_expected_value), 4)
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.local_date='2026-09-19'
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                      GROUP BY bucket
                      ORDER BY MIN(c.selection_odd)
                      """,
                      (generation_id,),
                  ).fetchall()
                  for bucket, count, avg_odd, market_p, model_p, edge, ev in focus:
                      print(
                          "STRONG_VALUE_ODDS_METRICS_DATE",
                          "date=2026-09-19",
                          f"bucket={bucket}",
                          f"count={count}",
                          f"avg_odd={avg_odd}",
                          f"market_p={market_p}",
                          f"model_p={model_p}",
                          f"edge={edge}",
                          f"ev={ev}",
                      )


                  collapse = con.execute(
                      """
                      SELECT COUNT(*), COUNT(DISTINCT match_key)
                      FROM prepared_pattern_candidates
                      WHERE generation_id=?
                        AND local_date='2026-09-19'
                        AND recommendation_eligible=1
                        AND value_tier='STRONG_VALUE'
                        AND selection_odd>=1.50
                      """,
                      (generation_id,),
                  ).fetchone()
                  print(
                      "STRONG_VALUE_MATCH_COLLAPSE",
                      "date=2026-09-19",
                      f"candidates={collapse[0]}",
                      f"distinct_matches={collapse[1]}",
                  )
                  duplicates = con.execute(
                      """
                      SELECT match_key, COUNT(*) AS n
                      FROM prepared_pattern_candidates
                      WHERE generation_id=?
                        AND local_date='2026-09-19'
                        AND recommendation_eligible=1
                        AND value_tier='STRONG_VALUE'
                        AND selection_odd>=1.50
                      GROUP BY match_key
                      HAVING COUNT(*)>1
                      ORDER BY n DESC, match_key
                      """,
                      (generation_id,),
                  ).fetchall()
                  for match_key, n in duplicates:
                      print(
                          "STRONG_VALUE_MATCH_MULTI",
                          f"match={match_key}",
                          f"candidates={n}",
                      )


                  rows = con.execute(
                      """
                      SELECT c.match_key,
                             c.selection_key,
                             c.selection_odd,
                             c.selection_score,
                             c.exact_recommendation_key,
                             c.market_family,
                             s.selection_market,
                             s.selection_name,
                             s.selection_team,
                             s.selection_line,
                             s.identity_broad_group,
                             s.identity_family,
                             s.identity_sub_market_key,
                             s.identity_team_side,
                             s.identity_line,
                             s.identity_selection_side
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.local_date='2026-09-19'
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                        AND c.match_key IN (
                          '2026-09-19|AS Roma|Inter',
                          '2026-09-19|VfB Stuttgart|Borussia Dortmund'
                        )
                      ORDER BY c.match_key, c.selection_score DESC, c.selection_odd DESC
                      """,
                      (generation_id,),
                  ).fetchall()
                  grouped={}
                  for row in rows:
                      grouped.setdefault(row[0], []).append(row[1:])
                  market_rows = con.execute(
                      """
                      SELECT c.market_family,
                             COUNT(*) AS n,
                             ROUND(AVG(c.selection_odd), 3),
                             ROUND(AVG(s.value_signal_market_probability), 4),
                             ROUND(AVG(s.value_signal_conservative_probability), 4),
                             ROUND(AVG(s.value_signal_edge), 4),
                             ROUND(AVG(s.value_signal_expected_value), 4),
                             ROUND(AVG(s.value_signal_ranking_score), 4)
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                      GROUP BY c.market_family
                      ORDER BY n DESC, c.market_family
                      """,
                      (generation_id,),
                  ).fetchall()
                  for family, n, avg_odd, market_p, model_p, edge, ev, rank in market_rows:
                      print(
                          "STRONG_VALUE_MARKET_DISTRIBUTION",
                          f"family={family}",
                          f"count={n}",
                          f"avg_odd={avg_odd}",
                          f"market_p={market_p}",
                          f"model_p={model_p}",
                          f"edge={edge}",
                          f"ev={ev}",
                          f"rank={rank}",
                      )

                  market_rows_date = con.execute(
                      """
                      SELECT c.market_family,
                             COUNT(*) AS n,
                             ROUND(AVG(c.selection_odd), 3),
                             ROUND(AVG(s.value_signal_ranking_score), 4)
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.local_date='2026-09-19'
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                      GROUP BY c.market_family
                      ORDER BY n DESC, c.market_family
                      """,
                      (generation_id,),
                  ).fetchall()
                  for family, n, avg_odd, rank in market_rows_date:
                      print(
                          "STRONG_VALUE_MARKET_DISTRIBUTION_DATE",
                          "date=2026-09-19",
                          f"family={family}",
                          f"count={n}",
                          f"avg_odd={avg_odd}",
                          f"rank={rank}",
                      )


                  dc_rows = con.execute(
                      """
                      SELECT c.match_key,
                             s.selection_name,
                             s.selection_odd,
                             s.value_signal_market_probability,
                             s.value_signal_conservative_probability,
                             s.value_signal_edge,
                             s.value_signal_expected_value,
                             s.bm_raw_implied_probability,
                             s.bm_market_overround,
                             s.bm_bookmaker_margin,
                             s.bm_market_probability,
                             s.identity_sub_market_key,
                             s.identity_selection_side
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.local_date='2026-09-19'
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.market_family='Double Chance'
                        AND c.selection_odd>=1.50
                      ORDER BY c.match_key, s.selection_odd
                      """,
                      (generation_id,),
                  ).fetchall()
                  for row in dc_rows:
                      match_key,name,odd,market_p,model_p,edge,ev,raw_p,overround,margin,bm_p,sub,side=row
                      print(
                          "DC_PROBABILITY_AUDIT",
                          f"match={match_key}",
                          f"name={name}",
                          f"odd={odd}",
                          f"implied={1.0/float(odd):.4f}",
                          f"market_p={market_p}",
                          f"bm_market_p={bm_p}",
                          f"raw_implied={raw_p}",
                          f"overround={overround}",
                          f"margin={margin}",
                          f"model_p={model_p}",
                          f"edge={edge}",
                          f"ev={ev}",
                          f"sub={sub}",
                          f"side={side}",
                      )

                  for match_key, candidates in grouped.items():
                      main=max(candidates, key=lambda r:(float(r[2]), float(r[1])))
                      main_score=float(main[2])
                      print(
                          "STRONG_VALUE_ALT_DIAG",
                          f"match={match_key}",
                          f"main={main[6]}",
                          f"odd={main[1]}",
                          f"score={main_score:.4f}",
                          f"min_alt_score={main_score*0.85:.4f}",
                          f"candidate_count={len(candidates)}",
                      )
                      for c in candidates:
                          score=float(c[2])
                          print(
                              "STRONG_VALUE_ALT_CANDIDATE",
                              f"match={match_key}",
                              f"name={c[6]}",
                              f"odd={c[1]}",
                              f"score={score:.4f}",
                              f"passes85={'yes' if score >= main_score*0.85 else 'no'}",
                              f"broad={c[9]}",
                              f"family={c[10]}",
                              f"sub={c[11]}",
                              f"teamSide={c[12]}",
                              f"line={c[13]}",
                              f"side={c[14]}",
                              f"exact={c[3]}",
                          )
              finally:
                  con.close()
          PY


      - name: Compare exact Saturday and current recommendation models
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3, tempfile, zipfile
          from pathlib import Path

          manifest=json.loads(Path("data/statmaker/app_ready/update_manifest.json").read_text(encoding="utf-8"))
          current=Path(next(a["path"] for a in manifest["artifacts"] if a["id"]=="app_ready_betting_bundle"))
          saturday=Path("data/statmaker/app_ready/app_ready_betting_bundle-8fb26ad587037355a319637fe8cb77c35b12f8f3ce14d82dde1a517d4622ef40.zip")
          if not saturday.is_file():
              import subprocess
              historical_commit="5480af5d0636eb37b8b5aec84e6ee576a7195587"
              historical_path="data/statmaker/app_ready/app_ready_betting_bundle-8fb26ad587037355a319637fe8cb77c35b12f8f3ce14d82dde1a517d4622ef40.zip"
              subprocess.run(["git","fetch","--no-tags","origin",historical_commit],check=True)
              materialized=Path(tempfile.gettempdir())/"statmaker-saturday-betting.zip"
              with materialized.open("wb") as out:
                  subprocess.run(["git","show",f"{historical_commit}:{historical_path}"],stdout=out,check=True)
              saturday=materialized
              print("SATURDAY_BUNDLE_MATERIALIZED",f"bytes={saturday.stat().st_size}",f"commit={historical_commit}")

          def inspect(label,bundle):
              if not bundle.is_file():
                  print("SATURDAY_CURRENT_MODEL_COMPARE",f"label={label}","missing=true",f"path={bundle}")
                  return
              with tempfile.TemporaryDirectory() as tmp:
                  with zipfile.ZipFile(bundle) as z:
                      names=[n for n in z.namelist() if n.endswith("databases/statmaker_prepared_betting.db")]
                      if len(names)!=1: raise SystemExit(f"{label}: expected one prepared db; got {names}")
                      z.extract(names[0],tmp)
                      db=Path(tmp)/names[0]
                  con=sqlite3.connect(f"file:{db}?mode=ro",uri=True)
                  try:
                      gen=con.execute("SELECT generation_id,candidate_count FROM prepared_pattern_generation WHERE state='ready' ORDER BY built_at_ms DESC LIMIT 1").fetchone()
                      gid=str(gen[0])
                      print("SATURDAY_CURRENT_MODEL_COMPARE",f"label={label}",f"generation={gid[:12]}",f"candidates={gen[1]}")
                      rows=con.execute(
                          """
                          SELECT c.market_family,COUNT(*),
                                 ROUND(AVG(c.selection_odd),3),
                                 ROUND(AVG(s.value_signal_market_probability),4),
                                 ROUND(AVG(s.value_signal_conservative_probability),4),
                                 ROUND(AVG(s.value_signal_edge),4),
                                 ROUND(AVG(s.value_signal_expected_value),4)
                          FROM prepared_pattern_candidates c
                          JOIN prepared_selections s
                            ON s.competition_id=c.competition_id
                           AND s.snapshot_version=c.snapshot_version
                           AND s.selection_key=c.selection_key
                          WHERE c.generation_id=?
                            AND c.recommendation_eligible=1
                            AND c.value_tier='STRONG_VALUE'
                            AND c.selection_odd>=1.50
                          GROUP BY c.market_family
                          ORDER BY COUNT(*) DESC,c.market_family
                          """,(gid,)
                      ).fetchall()
                      total=sum(int(r[1]) for r in rows)
                      result=sum(int(r[1]) for r in rows if str(r[0]) in {"1X2","Double Chance","Draw No Bet"})
                      print("SATURDAY_CURRENT_MODEL_SUMMARY",f"label={label}",f"strong={total}",f"result_family={result}",f"result_pct={(100*result/total if total else 0):.1f}")
                      for fam,n,odd,mp,model,edge,ev in rows:
                          if fam in {"1X2","Double Chance","Draw No Bet","Team Goals","Match Goals","BTTS"}:
                              print("SATURDAY_CURRENT_MODEL_MARKET",f"label={label}",f"family={fam}",f"count={n}",f"avg_odd={odd}",f"market_p={mp}",f"model_p={model}",f"edge={edge}",f"ev={ev}")
                  finally:
                      con.close()

          def inspect_date(label,bundle,date):
              if not bundle.is_file(): return
              with tempfile.TemporaryDirectory() as tmp:
                  with zipfile.ZipFile(bundle) as z:
                      names=[n for n in z.namelist() if n.endswith("databases/statmaker_prepared_betting.db")]
                      z.extract(names[0],tmp)
                      db=Path(tmp)/names[0]
                  con=sqlite3.connect(f"file:{db}?mode=ro",uri=True)
                  try:
                      gid=str(con.execute("SELECT generation_id FROM prepared_pattern_generation WHERE state='ready' ORDER BY built_at_ms DESC LIMIT 1").fetchone()[0])
                      rows=con.execute(
                          """
                          SELECT c.market_family,COUNT(*),
                                 COUNT(DISTINCT c.match_key),
                                 ROUND(AVG(c.selection_odd),3),
                                 ROUND(AVG(s.value_signal_market_probability),4),
                                 ROUND(AVG(s.value_signal_conservative_probability),4),
                                 ROUND(AVG(s.value_signal_edge),4),
                                 ROUND(AVG(s.value_signal_expected_value),4)
                          FROM prepared_pattern_candidates c
                          JOIN prepared_selections s
                            ON s.competition_id=c.competition_id
                           AND s.snapshot_version=c.snapshot_version
                           AND s.selection_key=c.selection_key
                          WHERE c.generation_id=?
                            AND c.local_date=?
                            AND c.recommendation_eligible=1
                            AND c.value_tier='STRONG_VALUE'
                            AND c.selection_odd>=1.50
                          GROUP BY c.market_family
                          ORDER BY COUNT(*) DESC,c.market_family
                          """,(gid,date)
                      ).fetchall()
                      total=sum(int(r[1]) for r in rows)
                      matches=con.execute(
                          """
                          SELECT COUNT(DISTINCT match_key)
                          FROM prepared_pattern_candidates
                          WHERE generation_id=? AND local_date=?
                            AND recommendation_eligible=1
                            AND value_tier='STRONG_VALUE'
                            AND selection_odd>=1.50
                          """,(gid,date)
                      ).fetchone()[0]
                      result=sum(int(r[1]) for r in rows if str(r[0]) in {"1X2","Double Chance","Draw No Bet"})
                      print("SATURDAY_CURRENT_DATE_COMPARE",f"label={label}",f"date={date}",f"strong={total}",f"matches={matches}",f"result={result}",f"result_pct={(100*result/total if total else 0):.1f}")
                      for fam,n,dm,odd,mp,model,edge,ev in rows:
                          print("SATURDAY_CURRENT_DATE_MARKET",f"label={label}",f"date={date}",f"family={fam}",f"count={n}",f"matches={dm}",f"avg_odd={odd}",f"market_p={mp}",f"model_p={model}",f"edge={edge}",f"ev={ev}")
                  finally:
                      con.close()

          inspect("saturday",saturday)
          inspect("current",current)
          inspect_date("saturday",saturday,"2026-09-19")
          inspect_date("current",current,"2026-09-19")

          retired = {
              "RESULT_ASIAN_HANDICAP",
              "HT_RESULT_ASIAN_HANDICAP",
              "ASIAN_MATCH_GOALS_TOTAL",
              "ASIAN_FIRST_HALF_GOALS_TOTAL",
              "ASIAN_MATCH_CORNERS_TOTAL",
              "ASIAN_CORNER_HANDICAP",
              "CORNER_HANDICAP",
          }

          def inspect_without_retired(label,bundle):
              if not bundle.is_file():
                  return
              with tempfile.TemporaryDirectory() as tmp:
                  with zipfile.ZipFile(bundle) as z:
                      names=[n for n in z.namelist() if n.endswith("databases/statmaker_prepared_betting.db")]
                      z.extract(names[0],tmp)
                      db=Path(tmp)/names[0]
                  con=sqlite3.connect(f"file:{db}?mode=ro",uri=True)
                  try:
                      gid=str(con.execute("SELECT generation_id FROM prepared_pattern_generation WHERE state='ready' ORDER BY built_at_ms DESC LIMIT 1").fetchone()[0])
                      placeholders=",".join("?" for _ in retired)
                      rows=con.execute(
                          f"""
                          SELECT c.market_family,COUNT(*),
                                 ROUND(AVG(c.selection_odd),3)
                          FROM prepared_pattern_candidates c
                          JOIN prepared_selections s
                            ON s.competition_id=c.competition_id
                           AND s.snapshot_version=c.snapshot_version
                           AND s.selection_key=c.selection_key
                          WHERE c.generation_id=?
                            AND c.recommendation_eligible=1
                            AND c.value_tier='STRONG_VALUE'
                            AND c.selection_odd>=1.50
                            AND COALESCE(s.identity_sub_market_key,'') NOT IN ({placeholders})
                          GROUP BY c.market_family
                          ORDER BY COUNT(*) DESC,c.market_family
                          """,(gid,*sorted(retired))
                      ).fetchall()
                      total=sum(int(r[1]) for r in rows)
                      result=sum(int(r[1]) for r in rows if str(r[0]) in {"1X2","Double Chance","Draw No Bet"})
                      print("SATURDAY_NO_RETIRED_SUMMARY",f"label={label}",f"strong={total}",f"result={result}",f"result_pct={(100*result/total if total else 0):.1f}")
                      for fam,n,avg_odd in rows:
                          print("SATURDAY_NO_RETIRED_MARKET",f"label={label}",f"family={fam}",f"count={n}",f"avg_odd={avg_odd}")
                  finally:
                      con.close()

          inspect_without_retired("saturday",saturday)
          inspect_without_retired("current",current)
          PY


      - name: Compare Saturday and current Domestic odds universe
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 54e9bd4e28b29a0eb6313f4d16da4c99f27490b9
          git show 54e9bd4e28b29a0eb6313f4d16da4c99f27490b9:odds/odds_api_io/domestic_odds.json > /tmp/domestic_odds_saturday.json
          python - <<'PY'
          import json
          from collections import Counter,defaultdict
          from pathlib import Path

          RETIRED={
              "ASIAN_HANDICAP","ASIAN_HANDICAP_1H","ASIAN_GOALS","ASIAN_GOALS_1H",
              "ASIAN_CORNERS","ASIAN_CORNER_HANDICAP","CORNER_HANDICAP"
          }

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def summarize(label,payload):
              leagues=payload.get("leagues") or []
              matches=[]
              market_counts=Counter()
              by_league=defaultdict(lambda:[0,0])
              for league in leagues:
                  code=str(league.get("leagueCode") or "").strip()
                  lm=league.get("matches") or []
                  for match in lm:
                      matches.append(match)
                      markets=match.get("markets") or []
                      by_league[code][0]+=1
                      by_league[code][1]+=len(markets)
                      for market in markets:
                          key=str(
                              market.get("market")
                              or market.get("marketKey")
                              or market.get("key")
                              or market.get("name")
                              or "UNKNOWN"
                          ).strip().upper()
                          market_counts[key]+=1
              nonret=sum(v for k,v in market_counts.items() if k not in RETIRED)
              retired=sum(v for k,v in market_counts.items() if k in RETIRED)
              print("DOMESTIC_ODDS_SATURDAY_COMPARE",f"label={label}",f"leagues={len(leagues)}",f"matches={len(matches)}",f"market_rows={sum(market_counts.values())}",f"nonretired_rows={nonret}",f"retired_rows={retired}")
              return market_counts,by_league

          sat=load("/tmp/domestic_odds_saturday.json")
          cur=load("odds/odds_api_io/domestic_odds.json")
          sm,sl=summarize("saturday",sat)
          cm,cl=summarize("current",cur)

          for key in sorted(set(sm)|set(cm), key=lambda k: (cm[k]-sm[k],k)):
              if sm[key]==cm[key]:
                  continue
              print("DOMESTIC_ODDS_MARKET_DELTA",f"market={key}",f"saturday={sm[key]}",f"current={cm[key]}",f"delta={cm[key]-sm[key]}",f"retired={'yes' if key in RETIRED else 'no'}")

          league_rows=[]
          for code in sorted(set(sl)|set(cl)):
              smatches,smarkets=sl[code]
              cmatches,cmarkets=cl[code]
              if smatches!=cmatches or smarkets!=cmarkets:
                  league_rows.append((cmarkets-smarkets,code,smatches,cmatches,smarkets,cmarkets))
          for delta,code,smatches,cmatches,smarkets,cmarkets in sorted(league_rows)[:40]:
              print("DOMESTIC_ODDS_LEAGUE_DELTA",f"league={code}",f"saturday_matches={smatches}",f"current_matches={cmatches}",f"saturday_markets={smarkets}",f"current_markets={cmarkets}",f"delta_markets={delta}")
          PY


      - name: Compare Saturday and current Domestic odds universe
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 54e9bd4e28b29a0eb6313f4d16da4c99f27490b9
          python - <<'PY'
          import json, subprocess
          from collections import Counter

          SATURDAY="54e9bd4e28b29a0eb6313f4d16da4c99f27490b9"
          PATH="odds/odds_api_io/domestic_odds.json"

          def load(ref):
              if ref=="HEAD":
                  with open(PATH,encoding="utf-8") as fh:
                      return json.load(fh)
              raw=subprocess.check_output(["git","show",f"{ref}:{PATH}"],text=True)
              return json.loads(raw)

          def markets_of(match):
              markets=match.get("markets") or []
              if isinstance(markets,dict):
                  return list(markets.values())
              return list(markets)

          def market_name(market):
              if not isinstance(market,dict):
                  return str(market)
              return str(market.get("market") or market.get("name") or market.get("key") or market.get("marketName") or "").strip()

          def summarize(label,payload):
              leagues=payload.get("leagues") or []
              total_matches=0
              total_markets=0
              fam=Counter()
              per_league=[]
              for league in leagues:
                  code=str(league.get("leagueCode") or "").strip()
                  matches=league.get("matches") or []
                  lm=0
                  lmk=0
                  lf=Counter()
                  for match in matches:
                      market_items=markets_of(match)
                      lm+=1
                      lmk+=len(market_items)
                      for market in market_items:
                          name=market_name(market)
                          if name:
                              lf[name]+=1
                              fam[name]+=1
                  total_matches+=lm
                  total_markets+=lmk
                  per_league.append((code,lm,lmk,lf))
              print("SATURDAY_CURRENT_ODDS_UNIVERSE",f"label={label}",f"leagues={len(leagues)}",f"matches={total_matches}",f"markets={total_markets}")
              return per_league,fam

          sat=load(SATURDAY)
          cur=load("HEAD")
          sat_leagues,sat_fam=summarize("saturday",sat)
          cur_leagues,cur_fam=summarize("current",cur)

          sm={x[0]:x for x in sat_leagues}
          cm={x[0]:x for x in cur_leagues}
          diffs=[]
          for code in sorted(set(sm)|set(cm)):
              s=sm.get(code,(code,0,0,Counter()))
              c=cm.get(code,(code,0,0,Counter()))
              dm=c[1]-s[1]
              dmk=c[2]-s[2]
              if dm or dmk:
                  diffs.append((dmk,code,s,c))
          for _,code,s,c in sorted(diffs)[:80]:
              print("SATURDAY_CURRENT_ODDS_LEAGUE",
                    f"league={code}",
                    f"sat_matches={s[1]}",f"cur_matches={c[1]}",
                    f"sat_markets={s[2]}",f"cur_markets={c[2]}",
                    f"delta_matches={c[1]-s[1]}",f"delta_markets={c[2]-s[2]}")

          for name in sorted(set(sat_fam)|set(cur_fam), key=lambda n: (cur_fam[n]-sat_fam[n],n)):
              sv=sat_fam[name]; cv=cur_fam[name]
              if sv!=cv:
                  print("SATURDAY_CURRENT_ODDS_MARKET",
                        f"market={name}",
                        f"saturday={sv}",f"current={cv}",f"delta={cv-sv}")
          PY
