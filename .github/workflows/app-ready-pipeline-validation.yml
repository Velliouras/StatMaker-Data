name: App-Ready Pipeline Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/app-ready-artifact-publisher.yml'
      - '.github/workflows/app-ready-pipeline-validation.yml'
      - 'scripts/preflight_app_ready_pipeline.py'
      - 'scripts/stage_app_ready_producer.sh'
      - 'scripts/patch_app_ready_producer.py'
      - 'scripts/app_ready_v10/**'
      - 'scripts/patch_prepared_publisher_diagnostics.py'
      - 'scripts/patch_prepared_publisher_bulk.py'
      - 'scripts/run_app_ready_emulator.sh'
      - 'scripts/validate_app_ready_prepared_contract.py'
      - 'scripts/app_ready_input_retirement.py'
      - 'scripts/validate_app_ready_retirement_contract.py'
      - 'scripts/build_app_ready_from_device.py'
      - 'scripts/materialize_app_ready_pattern_candidates.py'
      - 'scripts/materialize_prepared_fixture_index.py'
      - 'scripts/materialize_prepared_simulations.py'

permissions:
  contents: read

concurrency:
  group: statmaker-app-ready-pipeline-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_READY_UAT_SOURCE: "true"
      APP_READY_STATMAKER_COMMIT: "c9d9d90803b3409a655e7aee59b35f31ba49b70e"
      APP_READY_PATTERN_RULES_FINGERPRINT: "pattern-policy-v2-final-read-model-v6-probability-first-prod"
      APP_READY_PREPARED_SCHEMA_VERSION: "12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate script syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/preflight_app_ready_pipeline.py \
            scripts/patch_app_ready_producer.py \
            scripts/patch_prepared_publisher_diagnostics.py \
            scripts/patch_prepared_publisher_bulk.py \
            scripts/build_app_ready_from_device.py \
            scripts/materialize_uat_direction_pattern_candidates.py \
            scripts/materialize_prepared_fixture_index.py \
            scripts/materialize_prepared_simulations.py \
            scripts/validate_app_ready_prepared_contract.py \
            scripts/app_ready_input_retirement.py \
            scripts/audit_result_context_generation.py \
            scripts/validate_app_ready_retirement_contract.py
          bash -n scripts/stage_app_ready_producer.sh
          bash -n scripts/run_app_ready_emulator.sh

      - name: Validate checkpoint compatibility contract
        run: python scripts/validate_app_ready_prepared_contract.py --self-check

      - name: Validate market-only retirement contract
        run: python scripts/app_ready_input_retirement.py --self-check

      - name: Enforce explicit heavy rebuild and serialized hot-publisher routing
        run: python -m unittest discover -s tests -p 'test_app_ready_workflow_routing.py' -v

      - name: Require private read token
        env:
          TOKEN: "${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}"
        run: test -n "$TOKEN" || (echo 'Missing STATMAKER_PRIVATE_READ_TOKEN' >&2; exit 1)

      - name: Checkout current PROD StatMaker source
        uses: actions/checkout@v4
        with:
          repository: Velliouras/StatMaker
          ref: main
          token: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
          path: statmaker-private
          fetch-depth: 0
          persist-credentials: false

      - name: Stage publisher producer without building Android
        shell: bash
        run: bash scripts/stage_app_ready_producer.sh statmaker-private

      - name: Run aggregate source and producer preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight_app_ready_pipeline.py \
            --mode source \
            --private-root statmaker-private
