name: App-Ready Pipeline Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/app-ready-artifact-publisher.yml'
      - '.github/workflows/app-ready-pipeline-validation.yml'
      - 'scripts/preflight_app_ready_pipeline.py'
      - 'scripts/stage_app_ready_producer.sh'
      - 'scripts/patch_app_ready_producer.py'
      - 'scripts/app_ready_v10/**'
      - 'scripts/patch_prepared_publisher_diagnostics.py'
      - 'scripts/patch_prepared_publisher_bulk.py'
      - 'scripts/run_app_ready_emulator.sh'
      - 'scripts/build_app_ready_from_device.py'
      - 'scripts/materialize_app_ready_pattern_candidates.py'
      - 'scripts/materialize_prepared_fixture_index.py'

permissions:
  contents: read

concurrency:
  group: statmaker-app-ready-pipeline-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate script syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/preflight_app_ready_pipeline.py \
            scripts/patch_app_ready_producer.py \
            scripts/patch_prepared_publisher_diagnostics.py \
            scripts/patch_prepared_publisher_bulk.py \
            scripts/build_app_ready_from_device.py \
            scripts/materialize_app_ready_pattern_candidates.py \
            scripts/materialize_prepared_fixture_index.py
          bash -n scripts/stage_app_ready_producer.sh
          bash -n scripts/run_app_ready_emulator.sh

      - name: Enforce heavy publisher trigger separation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/app-ready-artifact-publisher.yml').read_text(encoding='utf-8')
          try:
              push=text.split('  push:',1)[1].split('  schedule:',1)[0]
          except IndexError as exc:
              raise SystemExit('Could not isolate heavy publisher push trigger section') from exc
          forbidden=[
              '.github/workflows/app-ready-artifact-publisher.yml',
              'scripts/preflight_app_ready_pipeline.py',
              'scripts/stage_app_ready_producer.sh',
              'scripts/patch_app_ready_producer.py',
              'scripts/run_app_ready_emulator.sh',
              'scripts/build_app_ready_from_device.py',
              'scripts/materialize_app_ready_pattern_candidates.py',
              'scripts/materialize_prepared_fixture_index.py',
          ]
          leaked=[item for item in forbidden if item in push]
          if leaked:
              raise SystemExit('Heavy publisher must not self-trigger on code changes: '+', '.join(leaked))
          print('APP_READY_HEAVY_TRIGGER_SEPARATION_OK')
          PY

      - name: Require private read token
        env:
          TOKEN: "${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}"
        run: test -n "$TOKEN" || (echo 'Missing STATMAKER_PRIVATE_READ_TOKEN' >&2; exit 1)

      - name: Checkout current StatMaker production source
        uses: actions/checkout@v4
        with:
          repository: Velliouras/StatMaker
          ref: main
          token: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
          path: statmaker-private
          fetch-depth: 0
          persist-credentials: false

      - name: Stage publisher producer without building Android
        shell: bash
        run: bash scripts/stage_app_ready_producer.sh statmaker-private

      - name: Run aggregate source and producer preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight_app_ready_pipeline.py \
            --mode source \
            --private-root statmaker-private


      - name: Published Strong Value odds distribution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          import tempfile
          import zipfile
          from pathlib import Path

          manifest = json.loads(Path("data/statmaker/app_ready/update_manifest.json").read_text(encoding="utf-8"))
          betting = next(
              (row for row in manifest.get("artifacts", []) if row.get("id") == "app_ready_betting_bundle"),
              None,
          )
          if not betting:
              raise SystemExit("Published manifest has no app_ready_betting_bundle")
          bundle = Path(str(betting.get("path") or ""))
          if not bundle.is_file():
              raise SystemExit(f"Published betting bundle is missing: {bundle}")

          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(bundle) as zf:
                  names = [name for name in zf.namelist() if name.endswith("databases/statmaker_prepared_betting.db")]
                  if len(names) != 1:
                      raise SystemExit(f"Expected exactly one prepared betting DB in bundle; got {names}")
                  zf.extract(names[0], tmp)
                  db_path = Path(tmp) / names[0]

              con = sqlite3.connect(f"file:{db_path}?mode=ro", uri=True)
              try:
                  generation = con.execute(
                      """
                      SELECT generation_id
                      FROM prepared_pattern_generation
                      WHERE state='ready'
                      ORDER BY built_at_ms DESC
                      LIMIT 1
                      """
                  ).fetchone()
                  if not generation:
                      raise SystemExit("No READY prepared pattern generation in published bundle")
                  generation_id = str(generation[0])

                  where = """
                      generation_id=?
                      AND recommendation_eligible=1
                      AND value_tier='STRONG_VALUE'
                      AND selection_odd>=1.50
                  """
                  rows = con.execute(
                      f"""
                      SELECT
                        CASE
                          WHEN selection_odd < 1.80 THEN '1.50-1.79'
                          WHEN selection_odd < 2.00 THEN '1.80-1.99'
                          WHEN selection_odd < 2.50 THEN '2.00-2.49'
                          ELSE '2.50+'
                        END AS bucket,
                        COUNT(*),
                        ROUND(AVG(selection_odd), 3),
                        ROUND(MIN(selection_odd), 3),
                        ROUND(MAX(selection_odd), 3)
                      FROM prepared_pattern_candidates
                      WHERE {where}
                      GROUP BY bucket
                      ORDER BY MIN(selection_odd)
                      """,
                      (generation_id,),
                  ).fetchall()
                  total = sum(int(row[1]) for row in rows)
                  print(
                      "STRONG_VALUE_ODDS_DISTRIBUTION",
                      f"generation={generation_id[:12]}",
                      f"total={total}",
                      f"published={manifest.get('generatedAt','')}",
                  )
                  for bucket, count, avg_odd, min_odd, max_odd in rows:
                      pct = (100.0 * int(count) / total) if total else 0.0
                      print(
                          "STRONG_VALUE_ODDS_BUCKET",
                          f"bucket={bucket}",
                          f"count={count}",
                          f"pct={pct:.1f}",
                          f"avg={avg_odd}",
                          f"min={min_odd}",
                          f"max={max_odd}",
                      )

                  by_date = con.execute(
                      f"""
                      SELECT local_date,
                             COUNT(*),
                             SUM(CASE WHEN selection_odd < 1.80 THEN 1 ELSE 0 END),
                             SUM(CASE WHEN selection_odd >= 1.80 AND selection_odd < 2.00 THEN 1 ELSE 0 END),
                             SUM(CASE WHEN selection_odd >= 2.00 AND selection_odd < 2.50 THEN 1 ELSE 0 END),
                             SUM(CASE WHEN selection_odd >= 2.50 THEN 1 ELSE 0 END),
                             ROUND(AVG(selection_odd), 3)
                      FROM prepared_pattern_candidates
                      WHERE {where}
                      GROUP BY local_date
                      ORDER BY local_date
                      """,
                      (generation_id,),
                  ).fetchall()
                  for date, count, b1, b2, b3, b4, avg_odd in by_date:
                      print(
                          "STRONG_VALUE_ODDS_DATE",
                          f"date={date}",
                          f"total={count}",
                          f"1.50-1.79={b1}",
                          f"1.80-1.99={b2}",
                          f"2.00-2.49={b3}",
                          f"2.50+={b4}",
                          f"avg={avg_odd}",
                      )


                  metrics = con.execute(
                      """
                      SELECT
                        CASE
                          WHEN c.selection_odd < 1.80 THEN '1.50-1.79'
                          WHEN c.selection_odd < 2.00 THEN '1.80-1.99'
                          WHEN c.selection_odd < 2.50 THEN '2.00-2.49'
                          ELSE '2.50+'
                        END AS bucket,
                        COUNT(*),
                        ROUND(AVG(c.selection_odd), 3),
                        ROUND(AVG(s.value_signal_market_probability), 4),
                        ROUND(AVG(s.value_signal_conservative_probability), 4),
                        ROUND(AVG(s.value_signal_edge), 4),
                        ROUND(AVG(s.value_signal_expected_value), 4),
                        ROUND(AVG(s.value_signal_reliability), 4),
                        ROUND(AVG(s.value_signal_ranking_score), 4)
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                      GROUP BY bucket
                      ORDER BY MIN(c.selection_odd)
                      """,
                      (generation_id,),
                  ).fetchall()
                  for bucket, count, avg_odd, market_p, model_p, edge, ev, reliability, rank in metrics:
                      print(
                          "STRONG_VALUE_ODDS_METRICS",
                          f"bucket={bucket}",
                          f"count={count}",
                          f"avg_odd={avg_odd}",
                          f"market_p={market_p}",
                          f"model_p={model_p}",
                          f"edge={edge}",
                          f"ev={ev}",
                          f"reliability={reliability}",
                          f"rank={rank}",
                      )

                  focus = con.execute(
                      """
                      SELECT
                        CASE
                          WHEN c.selection_odd < 1.80 THEN '1.50-1.79'
                          WHEN c.selection_odd < 2.00 THEN '1.80-1.99'
                          WHEN c.selection_odd < 2.50 THEN '2.00-2.49'
                          ELSE '2.50+'
                        END AS bucket,
                        COUNT(*),
                        ROUND(AVG(c.selection_odd), 3),
                        ROUND(AVG(s.value_signal_market_probability), 4),
                        ROUND(AVG(s.value_signal_conservative_probability), 4),
                        ROUND(AVG(s.value_signal_edge), 4),
                        ROUND(AVG(s.value_signal_expected_value), 4)
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.local_date='2026-09-19'
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                      GROUP BY bucket
                      ORDER BY MIN(c.selection_odd)
                      """,
                      (generation_id,),
                  ).fetchall()
                  for bucket, count, avg_odd, market_p, model_p, edge, ev in focus:
                      print(
                          "STRONG_VALUE_ODDS_METRICS_DATE",
                          "date=2026-09-19",
                          f"bucket={bucket}",
                          f"count={count}",
                          f"avg_odd={avg_odd}",
                          f"market_p={market_p}",
                          f"model_p={model_p}",
                          f"edge={edge}",
                          f"ev={ev}",
                      )


                  collapse = con.execute(
                      """
                      SELECT COUNT(*), COUNT(DISTINCT match_key)
                      FROM prepared_pattern_candidates
                      WHERE generation_id=?
                        AND local_date='2026-09-19'
                        AND recommendation_eligible=1
                        AND value_tier='STRONG_VALUE'
                        AND selection_odd>=1.50
                      """,
                      (generation_id,),
                  ).fetchone()
                  print(
                      "STRONG_VALUE_MATCH_COLLAPSE",
                      "date=2026-09-19",
                      f"candidates={collapse[0]}",
                      f"distinct_matches={collapse[1]}",
                  )
                  duplicates = con.execute(
                      """
                      SELECT match_key, COUNT(*) AS n
                      FROM prepared_pattern_candidates
                      WHERE generation_id=?
                        AND local_date='2026-09-19'
                        AND recommendation_eligible=1
                        AND value_tier='STRONG_VALUE'
                        AND selection_odd>=1.50
                      GROUP BY match_key
                      HAVING COUNT(*)>1
                      ORDER BY n DESC, match_key
                      """,
                      (generation_id,),
                  ).fetchall()
                  for match_key, n in duplicates:
                      print(
                          "STRONG_VALUE_MATCH_MULTI",
                          f"match={match_key}",
                          f"candidates={n}",
                      )


                  rows = con.execute(
                      """
                      SELECT c.match_key,
                             c.selection_key,
                             c.selection_odd,
                             c.selection_score,
                             c.exact_recommendation_key,
                             c.market_family,
                             s.selection_market,
                             s.selection_name,
                             s.selection_team,
                             s.selection_line,
                             s.identity_broad_group,
                             s.identity_family,
                             s.identity_sub_market_key,
                             s.identity_team_side,
                             s.identity_line,
                             s.identity_selection_side
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.local_date='2026-09-19'
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                        AND c.match_key IN (
                          '2026-09-19|AS Roma|Inter',
                          '2026-09-19|VfB Stuttgart|Borussia Dortmund'
                        )
                      ORDER BY c.match_key, c.selection_score DESC, c.selection_odd DESC
                      """,
                      (generation_id,),
                  ).fetchall()
                  grouped={}
                  for row in rows:
                      grouped.setdefault(row[0], []).append(row[1:])
                  market_rows = con.execute(
                      """
                      SELECT c.market_family,
                             COUNT(*) AS n,
                             ROUND(AVG(c.selection_odd), 3),
                             ROUND(AVG(s.value_signal_market_probability), 4),
                             ROUND(AVG(s.value_signal_conservative_probability), 4),
                             ROUND(AVG(s.value_signal_edge), 4),
                             ROUND(AVG(s.value_signal_expected_value), 4),
                             ROUND(AVG(s.value_signal_ranking_score), 4)
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                      GROUP BY c.market_family
                      ORDER BY n DESC, c.market_family
                      """,
                      (generation_id,),
                  ).fetchall()
                  for family, n, avg_odd, market_p, model_p, edge, ev, rank in market_rows:
                      print(
                          "STRONG_VALUE_MARKET_DISTRIBUTION",
                          f"family={family}",
                          f"count={n}",
                          f"avg_odd={avg_odd}",
                          f"market_p={market_p}",
                          f"model_p={model_p}",
                          f"edge={edge}",
                          f"ev={ev}",
                          f"rank={rank}",
                      )

                  market_rows_date = con.execute(
                      """
                      SELECT c.market_family,
                             COUNT(*) AS n,
                             ROUND(AVG(c.selection_odd), 3),
                             ROUND(AVG(s.value_signal_ranking_score), 4)
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.local_date='2026-09-19'
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                      GROUP BY c.market_family
                      ORDER BY n DESC, c.market_family
                      """,
                      (generation_id,),
                  ).fetchall()
                  for family, n, avg_odd, rank in market_rows_date:
                      print(
                          "STRONG_VALUE_MARKET_DISTRIBUTION_DATE",
                          "date=2026-09-19",
                          f"family={family}",
                          f"count={n}",
                          f"avg_odd={avg_odd}",
                          f"rank={rank}",
                      )


                  dc_rows = con.execute(
                      """
                      SELECT c.match_key,
                             s.selection_name,
                             s.selection_odd,
                             s.value_signal_market_probability,
                             s.value_signal_conservative_probability,
                             s.value_signal_edge,
                             s.value_signal_expected_value,
                             s.bm_raw_implied_probability,
                             s.bm_market_overround,
                             s.bm_bookmaker_margin,
                             s.bm_market_probability,
                             s.identity_sub_market_key,
                             s.identity_selection_side
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.local_date='2026-09-19'
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.market_family='Double Chance'
                        AND c.selection_odd>=1.50
                      ORDER BY c.match_key, s.selection_odd
                      """,
                      (generation_id,),
                  ).fetchall()
                  for row in dc_rows:
                      match_key,name,odd,market_p,model_p,edge,ev,raw_p,overround,margin,bm_p,sub,side=row
                      print(
                          "DC_PROBABILITY_AUDIT",
                          f"match={match_key}",
                          f"name={name}",
                          f"odd={odd}",
                          f"implied={1.0/float(odd):.4f}",
                          f"market_p={market_p}",
                          f"bm_market_p={bm_p}",
                          f"raw_implied={raw_p}",
                          f"overround={overround}",
                          f"margin={margin}",
                          f"model_p={model_p}",
                          f"edge={edge}",
                          f"ev={ev}",
                          f"sub={sub}",
                          f"side={side}",
                      )

                  for match_key, candidates in grouped.items():
                      main=max(candidates, key=lambda r:(float(r[2]), float(r[1])))
                      main_score=float(main[2])
                      print(
                          "STRONG_VALUE_ALT_DIAG",
                          f"match={match_key}",
                          f"main={main[6]}",
                          f"odd={main[1]}",
                          f"score={main_score:.4f}",
                          f"min_alt_score={main_score*0.85:.4f}",
                          f"candidate_count={len(candidates)}",
                      )
                      for c in candidates:
                          score=float(c[2])
                          print(
                              "STRONG_VALUE_ALT_CANDIDATE",
                              f"match={match_key}",
                              f"name={c[6]}",
                              f"odd={c[1]}",
                              f"score={score:.4f}",
                              f"passes85={'yes' if score >= main_score*0.85 else 'no'}",
                              f"broad={c[9]}",
                              f"family={c[10]}",
                              f"sub={c[11]}",
                              f"teamSide={c[12]}",
                              f"line={c[13]}",
                              f"side={c[14]}",
                              f"exact={c[3]}",
                          )
              finally:
                  con.close()
          PY
