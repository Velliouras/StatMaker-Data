name: App-Ready Pipeline Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/app-ready-artifact-publisher.yml'
      - '.github/workflows/app-ready-pipeline-validation.yml'
      - 'scripts/preflight_app_ready_pipeline.py'
      - 'scripts/stage_app_ready_producer.sh'
      - 'scripts/patch_app_ready_producer.py'
      - 'scripts/app_ready_v10/**'
      - 'scripts/patch_prepared_publisher_diagnostics.py'
      - 'scripts/patch_prepared_publisher_bulk.py'
      - 'scripts/run_app_ready_emulator.sh'
      - 'scripts/build_app_ready_from_device.py'
      - 'scripts/materialize_app_ready_pattern_candidates.py'
      - 'scripts/materialize_prepared_fixture_index.py'

permissions:
  contents: read

concurrency:
  group: statmaker-app-ready-pipeline-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate script syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/preflight_app_ready_pipeline.py \
            scripts/patch_app_ready_producer.py \
            scripts/patch_prepared_publisher_diagnostics.py \
            scripts/patch_prepared_publisher_bulk.py \
            scripts/build_app_ready_from_device.py \
            scripts/materialize_app_ready_pattern_candidates.py \
            scripts/materialize_prepared_fixture_index.py
          bash -n scripts/stage_app_ready_producer.sh
          bash -n scripts/run_app_ready_emulator.sh

      - name: Enforce heavy publisher trigger separation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/app-ready-artifact-publisher.yml').read_text(encoding='utf-8')
          try:
              push=text.split('  push:',1)[1].split('  schedule:',1)[0]
          except IndexError as exc:
              raise SystemExit('Could not isolate heavy publisher push trigger section') from exc
          forbidden=[
              '.github/workflows/app-ready-artifact-publisher.yml',
              'scripts/preflight_app_ready_pipeline.py',
              'scripts/stage_app_ready_producer.sh',
              'scripts/patch_app_ready_producer.py',
              'scripts/run_app_ready_emulator.sh',
              'scripts/build_app_ready_from_device.py',
              'scripts/materialize_app_ready_pattern_candidates.py',
              'scripts/materialize_prepared_fixture_index.py',
          ]
          leaked=[item for item in forbidden if item in push]
          if leaked:
              raise SystemExit('Heavy publisher must not self-trigger on code changes: '+', '.join(leaked))
          print('APP_READY_HEAVY_TRIGGER_SEPARATION_OK')
          PY

      - name: Require private read token
        env:
          TOKEN: "${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}"
        run: test -n "$TOKEN" || (echo 'Missing STATMAKER_PRIVATE_READ_TOKEN' >&2; exit 1)

      - name: Checkout current StatMaker production source
        uses: actions/checkout@v4
        with:
          repository: Velliouras/StatMaker
          ref: main
          token: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
          path: statmaker-private
          fetch-depth: 0
          persist-credentials: false

      - name: Stage publisher producer without building Android
        shell: bash
        run: bash scripts/stage_app_ready_producer.sh statmaker-private

      - name: Run aggregate source and producer preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight_app_ready_pipeline.py \
            --mode source \
            --private-root statmaker-private


      - name: Published Strong Value odds distribution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          import tempfile
          import zipfile
          from pathlib import Path

          manifest = json.loads(Path("data/statmaker/app_ready/update_manifest.json").read_text(encoding="utf-8"))
          betting = next(
              (row for row in manifest.get("artifacts", []) if row.get("id") == "app_ready_betting_bundle"),
              None,
          )
          if not betting:
              raise SystemExit("Published manifest has no app_ready_betting_bundle")
          bundle = Path(str(betting.get("path") or ""))
          if not bundle.is_file():
              raise SystemExit(f"Published betting bundle is missing: {bundle}")

          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(bundle) as zf:
                  names = [name for name in zf.namelist() if name.endswith("databases/statmaker_prepared_betting.db")]
                  if len(names) != 1:
                      raise SystemExit(f"Expected exactly one prepared betting DB in bundle; got {names}")
                  zf.extract(names[0], tmp)
                  db_path = Path(tmp) / names[0]

              con = sqlite3.connect(f"file:{db_path}?mode=ro", uri=True)
              try:
                  generation = con.execute(
                      """
                      SELECT generation_id
                      FROM prepared_pattern_generation
                      WHERE state='ready'
                      ORDER BY built_at_ms DESC
                      LIMIT 1
                      """
                  ).fetchone()
                  if not generation:
                      raise SystemExit("No READY prepared pattern generation in published bundle")
                  generation_id = str(generation[0])

                  where = """
                      generation_id=?
                      AND recommendation_eligible=1
                      AND value_tier='STRONG_VALUE'
                      AND selection_odd>=1.50
                  """
                  rows = con.execute(
                      f"""
                      SELECT
                        CASE
                          WHEN selection_odd < 1.80 THEN '1.50-1.79'
                          WHEN selection_odd < 2.00 THEN '1.80-1.99'
                          WHEN selection_odd < 2.50 THEN '2.00-2.49'
                          ELSE '2.50+'
                        END AS bucket,
                        COUNT(*),
                        ROUND(AVG(selection_odd), 3),
                        ROUND(MIN(selection_odd), 3),
                        ROUND(MAX(selection_odd), 3)
                      FROM prepared_pattern_candidates
                      WHERE {where}
                      GROUP BY bucket
                      ORDER BY MIN(selection_odd)
                      """,
                      (generation_id,),
                  ).fetchall()
                  total = sum(int(row[1]) for row in rows)
                  print(
                      "STRONG_VALUE_ODDS_DISTRIBUTION",
                      f"generation={generation_id[:12]}",
                      f"total={total}",
                      f"published={manifest.get('generatedAt','')}",
                  )
                  for bucket, count, avg_odd, min_odd, max_odd in rows:
                      pct = (100.0 * int(count) / total) if total else 0.0
                      print(
                          "STRONG_VALUE_ODDS_BUCKET",
                          f"bucket={bucket}",
                          f"count={count}",
                          f"pct={pct:.1f}",
                          f"avg={avg_odd}",
                          f"min={min_odd}",
                          f"max={max_odd}",
                      )

                  by_date = con.execute(
                      f"""
                      SELECT local_date,
                             COUNT(*),
                             SUM(CASE WHEN selection_odd < 1.80 THEN 1 ELSE 0 END),
                             SUM(CASE WHEN selection_odd >= 1.80 AND selection_odd < 2.00 THEN 1 ELSE 0 END),
                             SUM(CASE WHEN selection_odd >= 2.00 AND selection_odd < 2.50 THEN 1 ELSE 0 END),
                             SUM(CASE WHEN selection_odd >= 2.50 THEN 1 ELSE 0 END),
                             ROUND(AVG(selection_odd), 3)
                      FROM prepared_pattern_candidates
                      WHERE {where}
                      GROUP BY local_date
                      ORDER BY local_date
                      """,
                      (generation_id,),
                  ).fetchall()
                  for date, count, b1, b2, b3, b4, avg_odd in by_date:
                      print(
                          "STRONG_VALUE_ODDS_DATE",
                          f"date={date}",
                          f"total={count}",
                          f"1.50-1.79={b1}",
                          f"1.80-1.99={b2}",
                          f"2.00-2.49={b3}",
                          f"2.50+={b4}",
                          f"avg={avg_odd}",
                      )
              finally:
                  con.close()
          PY
