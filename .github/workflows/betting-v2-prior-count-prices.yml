name: Betting V2 Prior Count-Price Calibration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/triggers/betting-v2-prior-count-prices-20261018']
permissions:
  contents: write
concurrency:
  group: betting-v2-prior-count-prices
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify monthly cutoffs and prior-label isolation
        run: |
          python -m pip install --quiet numpy scipy scikit-learn
          python -m unittest discover -s tests -p test_prior_count_prices.py -v
      - name: Evaluate frozen August and September models and previous-month price caps
        run: |
          python -u scripts/betting_v2/research_prior_count_prices.py --stage replay --output reports/betting_v2/prior_market_calibration_20261018
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prior-count-price-calibration
          path: reports/betting_v2/prior_market_calibration_20261018/
          retention-days: 30
      - name: Persist development results and resumable checkpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          folder="reports/betting_v2/prior_market_calibration_20261018"
          saved="$(mktemp -d)"
          for pattern in \*_coupled_profiles.json checkpoint_\*.json.gz priced_\*.json prior_before_october_\*.json progress.json summary.json RESULTS_GR.md; do
            for file in "$folder"/$pattern; do
              if [ -f "$file" ]; then cp "$file" "$saved/"; fi
            done
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            cp -a "$saved/." "$folder/"
            git add "$folder"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Save chronological count-price calibration without live model changes [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
