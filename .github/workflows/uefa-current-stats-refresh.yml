name: UEFA Current Stats Refresh

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Maximum API-Football requests for current UEFA stats"
        required: true
        default: "64"
        type: string
  push:
    branches: [main]
    paths:
      - '.github/uefa-current-stats-refresh-request'
  schedule:
    # Critical: results must be refreshed AFTER UEFA matchdays, not just
    # before evening kickoffs. Quota-free gate skips days with no missing games.
    - cron: "35 22 * * *"
    - cron: "35 0 * * *"
    - cron: "11,31,51 5 * * *"
    - cron: "13 6 * * *"
  workflow_run:
    # Independent recovery trigger: this frequent existing workflow really ran
    # on 2026-10-16 even while both standalone UEFA schedules were skipped.
    workflows: ["Domestic Lineup Watch", "Priority Results and Official Standings"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: statmaker-uefa-current-stats-refresh-fast-v1
  cancel-in-progress: false

env:
  STATMAKER_API_BUDGET_ENFORCE: "true"
  STATMAKER_API_BUDGET_TOKEN: ${{ github.token }}
  STATMAKER_API_BUDGET_POLICY: ${{ github.workspace }}/config/api_football_refresh_policy.json
  STATMAKER_API_BUDGET_PROFILE: rolling
  PYTHONPATH: ${{ github.workspace }}/scripts/api_budget_runtime:${{ github.workspace }}:${{ github.workspace }}/scripts

jobs:
  refresh:
    # The fresh 5-minute results producer wakes this workflow after final whistle.
    # Offline missing-data gate avoids quota spend when no UEFA final is pending.
    if: ${{ (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.name == 'Priority Results and Official Standings' || (github.event.workflow_run.event == 'schedule' && (contains(github.event.workflow_run.run_started_at, 'T21:') || contains(github.event.workflow_run.run_started_at, 'T22:') || contains(github.event.workflow_run.run_started_at, 'T23:') || contains(github.event.workflow_run.run_started_at, 'T00:') || contains(github.event.workflow_run.run_started_at, 'T01:') || contains(github.event.workflow_run.run_started_at, 'T05:') || contains(github.event.workflow_run.run_started_at, 'T06:') || contains(github.event.workflow_run.run_started_at, 'T07:')))))) && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[budget-policy-only]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/api_budget_runtime/
            /config/api_football_refresh_policy.json
            /scripts/*
            /config/uefa_simulation_2026_27.json
            /data/statmaker/uefa_current_stats.json
            /data/statmaker/league_tables/
            /data/statmaker/priority_refresh/
            /reports/*

      - name: Verify shared API budget guard before provider work
        run: |
          python -c "import urllib.request; assert getattr(urllib.request.urlopen, '_statmaker_budget', False), 'Shared provider budget guard is missing'"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check whether finished UEFA matchdays are missing (no API calls)
        id: freshness
        run: |
          python scripts/uefa_postmatch_refresh_due.py --target stats >> "$GITHUB_OUTPUT"

      - name: Validate producer
        if: steps.freshness.outputs.refresh_needed == 'true'
        run: |
          python -m py_compile             scripts/refresh_uefa_current_stats.py             scripts/api_football_fetch_fixture_stats.py             scripts/canonical_team_identity.py             scripts/build_statmaker_update_manifest.py

      - name: Refresh current UEFA stats
        if: steps.freshness.outputs.refresh_needed == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          INPUT_MAX_REQUESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_requests || (github.event_name == 'workflow_run' && '48' || '64') }}
        run: |
          python scripts/refresh_uefa_current_stats.py             --max-requests "${INPUT_MAX_REQUESTS:-64}"

      - name: Validate current UEFA artifact
        if: steps.freshness.outputs.refresh_needed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/statmaker/uefa_current_stats.json').read_text(encoding='utf-8'))
          assert payload.get('schemaVersion') == 1
          comps=payload.get('competitions') or []
          assert {c.get('competitionId') for c in comps} == {
              'champions_league','europa_league','conference_league'
          }
          for comp in comps:
              start=str(comp.get('phaseStart') or '')
              league_id=int(comp.get('apiFootballLeagueId') or 0)
              assert league_id > 0
              for row in comp.get('fixtures') or []:
                  assert str(row.get('date') or '') >= start
                  assert row.get('status') in {'FT','AET','PEN'}
                  assert int((row.get('sourceLeague') or {}).get('id') or 0) == league_id
          print('UEFA_CURRENT_STATS_VERIFY_OK', [(c['competitionId'], c['fixtureCount']) for c in comps])
          PY

      - name: Commit canonical UEFA current stats
        if: steps.freshness.outputs.refresh_needed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/statmaker/uefa_current_stats.json reports/uefa_current_stats_refresh.json
          if git diff --cached --quiet; then
            echo "No UEFA current-stats changes."
            exit 0
          fi

          git commit -m "Refresh current UEFA statistics"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "UEFA_CURRENT_STATS_PUSH_OK attempt=$attempt"
              exit 0
            fi
            git fetch --depth=2 origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Could not publish UEFA current stats after 5 retries" >&2
          exit 1
