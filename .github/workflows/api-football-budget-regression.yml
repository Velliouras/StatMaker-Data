name: Shared API Budget and Cadence Regression
on:
  push:
    branches: [main]
    paths:
      - 'scripts/api_budget_runtime/**'
      - 'scripts/refresh_priority_matches.py'
      - 'config/api_football_refresh_policy.json'
      - 'tests/test_api_football_shared_budget.py'
      - 'tests/test_priority_matches_refresh.py'
      - 'scripts/scorer_refresh_sources.py'
      - 'scripts/refresh_domestic_match_context.py'
      - 'scripts/fetch_schedule_scorers_capped.py'
      - 'scripts/build_statmaker_schedule_scorers.py'
      - 'scripts/reconcile_top_scorers_with_events.py'
      - 'scripts/uefa_postmatch_refresh_due.py'
      - 'scripts/build_league_tables_program.py'
      - 'tests/test_watchdog_scorers.py'
      - 'tests/test_scorer_refresh_freshness.py'
      - 'tests/test_schedule_scorers_offline_builder.py'
      - 'tests/test_scorer_goal_floor.py'
      - 'tests/test_event_leaderboard_reconciliation.py'
      - 'tests/test_uefa_postmatch_refresh_due.py'
      - 'tests/test_live_settlement_watchdog.py'
      - 'tests/test_recent_finished_match_stats.py'
      - 'scripts/refresh_recent_finished_match_stats.py'
      - 'tests/test_generated_publication.py'
      - 'tests/test_manifest_publication_contract.py'
      - 'tests/test_canonical_writer_checkout.py'
      - '.github/scripts/publish_generated_paths.py'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
            tests/
            config/
            .github/workflows/
            .github/scripts/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML
      - name: Test shared quota, concurrent allocations, priorities and season preservation
        env:
          PYTHONPATH: scripts/api_budget_runtime:.
        run: |
          python -m unittest discover -s tests -p 'test_api_football_shared_budget.py' -q
          python -m unittest discover -s tests -p 'test_priority_matches_refresh.py' -q
          python -m unittest discover -s tests -p 'test_watchdog_scorers.py' -q
          python -m unittest discover -s tests -p 'test_scorer_refresh_freshness.py' -q
          python -m unittest discover -s tests -p 'test_schedule_scorers_offline_builder.py' -q
          python -m unittest discover -s tests -p 'test_scorer_goal_floor.py' -q
          python -m unittest discover -s tests -p 'test_event_leaderboard_reconciliation.py' -q
          python -m unittest discover -s tests -p 'test_uefa_postmatch_refresh_due.py' -q
          python -m unittest discover -s tests -p 'test_recent_finished_match_stats.py' -q
          python -m unittest discover -s tests -p 'test_live_settlement_watchdog.py' -q
          python -m unittest discover -s tests -p 'test_generated_publication.py' -q
          python -m unittest discover -s tests -p 'test_manifest_publication_contract.py' -q
          python -m unittest discover -s tests -p 'test_canonical_writer_checkout.py' -q
