name: Temporary ARG Alias Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-arg-alias-fix.yml"

permissions:
  contents: write

concurrency:
  group: domestic-arg-alias-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add verified ARG provider aliases and regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mapping_path = Path('mappings/domestic_team_aliases.json')
          payload = json.loads(mapping_path.read_text(encoding='utf-8-sig'))
          arg = payload.setdefault('aliases', {}).setdefault('ARG', {})
          verified = {
              'Argentinos JRS': ['Argentinos Juniors'],
              'Central Cordoba de Santiago': ['CA Central Cordoba SE'],
              'Estudiantes L.P.': ['Estudiantes de La Plata'],
              'Gimnasia L.P.': ['Gimnasia y Esgrima La Plata'],
              'Gimnasia M.': ['Gimnasia y Esgrima Mendoza'],
              'Independ. Rivadavia': ['Independiente Rivadavia'],
              'Racing Club': ['Racing Club Avellaneda'],
          }

          cache = json.loads(Path('data/api_football/fixture_stats/argentina/liga-profesional-argentina/2026/fixture_stats.json').read_text(encoding='utf-8-sig'))
          canonical = {
              str(row.get(key) or '').strip()
              for row in cache.get('fixtures', [])
              if isinstance(row, dict)
              for key in ('home_team', 'away_team')
              if str(row.get(key) or '').strip()
          }
          missing = sorted(set(verified) - canonical)
          if missing:
              raise SystemExit(f'Verified ARG canonical teams missing from API-Football cache: {missing}')

          changed = False
          for team, aliases in verified.items():
              bucket = arg.setdefault(team, [])
              for alias in aliases:
                  if alias not in bucket:
                      bucket.append(alias)
                      changed = True
          if changed:
              payload['version'] = max(int(payload.get('version') or 0) + 1, 8)
          mapping_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tests/test_arg_provider_aliases.py')
          test_path.write_text('''import sys\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nSCRIPTS = ROOT / "scripts"\nif str(SCRIPTS) not in sys.path:\n    sys.path.insert(0, str(SCRIPTS))\n\nimport domestic_live_july_pipeline as pipeline\nimport refresh_domestic_odds_schedule_priority as schedule_priority\n\n\nclass ArgentinaProviderAliasTest(unittest.TestCase):\n    def test_current_arg_provider_names_map_deterministically(self):\n        registry_payload = pipeline.load_json(pipeline.REGISTRY_PATH, {})\n        registry = registry_payload.get("leagues", [])\n        aliases = pipeline.generated_aliases(registry)\n        schedule_priority._install_conservative_team_mapping()\n        cases = {\n            "Argentinos Juniors": "Argentinos JRS",\n            "CA Central Cordoba SE": "Central Cordoba de Santiago",\n            "Estudiantes de La Plata": "Estudiantes L.P.",\n            "Gimnasia y Esgrima La Plata": "Gimnasia L.P.",\n            "Gimnasia y Esgrima Mendoza": "Gimnasia M.",\n            "Independiente Rivadavia": "Independ. Rivadavia",\n            "Racing Club Avellaneda": "Racing Club",\n        }\n        for provider_team, expected in cases.items():\n            with self.subTest(provider_team=provider_team):\n                mapped, canonical = schedule_priority.target.odds_fetch.canonical_team_info(\n                    provider_team, "ARG", aliases, {}\n                )\n                self.assertEqual(expected, mapped)\n                self.assertEqual(expected, canonical)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          workflow_path = Path('.github/workflows/odds-integrity-production.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          needle = '            tests/test_refresh_domestic_odds_integrity.py \\\n'
          addition = '            tests/test_arg_provider_aliases.py \\\n'
          if addition not in workflow:
              if needle not in workflow:
                  raise SystemExit('Could not locate Domestic odds regression test list')
              workflow = workflow.replace(needle, needle + addition, 1)
              workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Validate ARG mapping regression
        run: |
          python -m unittest tests/test_arg_provider_aliases.py
          python -m unittest tests/test_domestic_live_july_pipeline.py

      - name: Commit ARG fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            mappings/domestic_team_aliases.json \
            tests/test_arg_provider_aliases.py \
            .github/workflows/odds-integrity-production.yml
          git commit -m "Fix Argentina provider team aliases"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
