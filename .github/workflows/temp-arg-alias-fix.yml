name: Temporary ARG Alias Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-arg-alias-fix.yml"

permissions:
  contents: write

concurrency:
  group: domestic-arg-alias-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add exact observed ARG provider aliases
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mapping_path = Path('mappings/domestic_team_aliases.json')
          payload = json.loads(mapping_path.read_text(encoding='utf-8-sig'))
          arg = payload.setdefault('aliases', {}).setdefault('ARG', {})
          verified = {
              'Aldosivi': ['CA Aldosivi'],
              'Argentinos JRS': ['Argentinos Juniors'],
              'Banfield': ['CA Banfield'],
              'Barracas Central': ['CA Barracas Central'],
              'Belgrano Cordoba': ['CA Belgrano de Cordoba'],
              'Central Cordoba de Santiago': ['CA Central Cordoba SE'],
              'Deportivo Riestra': ['Deportivo Riestra AFBC'],
              'Estudiantes L.P.': ['Estudiantes de La Plata'],
              'Estudiantes de Rio Cuarto': ['Estudiantes Rio Cuarto'],
              'Gimnasia L.P.': ['Gimnasia y Esgrima La Plata'],
              'Gimnasia M.': ['Gimnasia y Esgrima Mendoza'],
              'Huracan': ['CA Huracan'],
              'Independ. Rivadavia': ['Independiente Rivadavia'],
              'Independiente': ['CA Independiente Avellaneda'],
              'Lanus': ['CA Lanus'],
              'Newells Old Boys': ["Newell's Old Boys"],
              'Platense': ['CA Platense'],
              'Racing Club': ['Racing Club Avellaneda'],
              'River Plate': ['CA River Plate (ARG)'],
              'Rosario Central': ['CA Rosario Central'],
              'San Lorenzo': ['CA San Lorenzo de Almagro'],
              'Sarmiento Junin': ['CA Sarmiento Junin'],
              'Talleres Cordoba': ['CA Talleres de Cordoba'],
              'Tigre': ['CA Tigre'],
              'Union Santa Fe': ['Union de Santa Fe'],
          }

          cache = json.loads(Path('data/api_football/fixture_stats/argentina/liga-profesional-argentina/2026/fixture_stats.json').read_text(encoding='utf-8-sig'))
          canonical = {
              str(row.get(key) or '').strip()
              for row in cache.get('fixtures', [])
              if isinstance(row, dict)
              for key in ('home_team', 'away_team')
              if str(row.get(key) or '').strip()
          }
          missing = sorted(set(verified) - canonical)
          if missing:
              raise SystemExit(f'ARG canonical targets missing from API-Football cache: {missing}')

          changed = False
          for team, aliases in verified.items():
              bucket = arg.setdefault(team, [])
              for alias in aliases:
                  if alias not in bucket:
                      bucket.append(alias)
                      changed = True
          if changed:
              payload['version'] = int(payload.get('version') or 0) + 1
          mapping_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cases = {alias: canonical for canonical, aliases in verified.items() for alias in aliases}
          test_path = Path('tests/test_arg_provider_aliases.py')
          test_path.write_text('''import sys\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nSCRIPTS = ROOT / "scripts"\nif str(SCRIPTS) not in sys.path:\n    sys.path.insert(0, str(SCRIPTS))\n\nimport domestic_live_july_pipeline as pipeline\nimport refresh_domestic_odds_schedule_priority as schedule_priority\n\nCASES = ''' + repr(cases) + '''\n\nclass ArgentinaProviderAliasTest(unittest.TestCase):\n    def test_all_observed_imminent_provider_names_map_exactly(self):\n        registry = pipeline.load_json(pipeline.REGISTRY_PATH, {}).get("leagues", [])\n        aliases = pipeline.generated_aliases(registry)\n        schedule_priority._install_conservative_team_mapping()\n        for provider_team, expected in CASES.items():\n            with self.subTest(provider_team=provider_team):\n                debug = {}\n                mapped, canonical = schedule_priority.target.odds_fetch.canonical_team_info(\n                    provider_team, "ARG", aliases, debug\n                )\n                self.assertEqual(expected, mapped)\n                self.assertEqual(expected, canonical)\n                self.assertFalse(debug.get("unmatchedTeams"))\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Validate ARG mapping regressions
        run: |
          python -m unittest tests/test_arg_provider_aliases.py
          python -m unittest tests/test_domestic_live_july_pipeline.py
      - name: Commit exact ARG aliases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mappings/domestic_team_aliases.json tests/test_arg_provider_aliases.py
          if git diff --cached --quiet; then
            echo "ARG aliases already complete."
          else
            git commit -m "Map all observed Argentina provider team names"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
