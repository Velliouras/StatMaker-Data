name: Betting V2 favorite audit (cached data only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/triggers/betting-v2-favorite-audit']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy scikit-learn
      - run: python scripts/audit_betting_v2_favorites.py
      - uses: actions/upload-artifact@v4
        with:
          name: betting-v2-favorite-audit
          path: reports/betting_v2/favorite_audit/
          retention-days: 7
