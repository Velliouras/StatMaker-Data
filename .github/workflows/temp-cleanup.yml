name: Temporary Final Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary workflows and reports
        run: |
          find .github/workflows -maxdepth 1 -type f -name 'temp-*.yml' -print0 | xargs -0 -r git rm
          find reports -maxdepth 1 -type f -name 'temp_*.json' -print0 | xargs -0 -r git rm
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No temporary files to clean."
          else
            git commit -m "Clean final ARG and T1 validation audits"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
