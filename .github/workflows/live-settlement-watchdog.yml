name: Stats Freshness and API Quota Watchdog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # Updating the stats watchdog must bootstrap quota monitoring and refresh fanout.
      - '.github/workflows/live-settlement-watchdog.yml'
      - '.github/scripts/publish_generated_paths.py'
      - 'tests/test_generated_publication.py'
      - 'scripts/api_football_usage.py'
      - 'tests/test_api_football_usage.py'
  workflow_run:
    # The existing five-minute final-score producer is the sole fast trigger.
    # On completion only the postmatch job runs; slower scorer jobs stay on cron.
    workflows: ["Priority Results and Official Standings"]
    types: [completed]
    branches: [main]
  schedule:
    # Fifteen-minute safety fallback and slower scorer/standings refreshes.
    # Existing shared budget guard strictly protects the 7,500/day provider quota.
    - cron: "8,23,38,53 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: statmaker-stats-freshness-watchdog
  cancel-in-progress: false

env:
  STATMAKER_API_BUDGET_ENFORCE: "true"
  STATMAKER_API_BUDGET_TOKEN: ${{ github.token }}
  STATMAKER_API_BUDGET_POLICY: ${{ github.workspace }}/config/api_football_refresh_policy.json
  STATMAKER_API_BUDGET_PROFILE: background
  PYTHONPATH: ${{ github.workspace }}/scripts/api_budget_runtime:${{ github.workspace }}:${{ github.workspace }}/scripts

jobs:
  quota-usage-snapshot:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            /scripts/api_budget_runtime/
            /config/api_football_refresh_policy.json
            .github/workflows/live-settlement-watchdog.yml
            tests/test_generated_publication.py
            .github/scripts/publish_generated_paths.py
            scripts/api_football_usage.py
            tests/test_api_football_usage.py
            data/statmaker/monitoring/
          sparse-checkout-cone-mode: false
      - name: Verify shared API budget guard before provider work
        run: |
          python -c "import urllib.request; assert getattr(urllib.request.urlopen, '_statmaker_budget', False), 'Shared provider budget guard is missing'"
      - name: Verify quota monitoring and publication
        run: |
          python -m unittest discover -s tests -p 'test_api_football_usage.py' -v
          python -m unittest discover -s tests -p 'test_generated_publication.py' -v
      - name: Record daily API-Football quota snapshot
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: >-
          python scripts/api_football_usage.py --reserve 1500
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Publish daily usage and CSV
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/statmaker/monitoring/api_football_usage.json data/statmaker/monitoring/api_football_usage.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record API-Football observed daily usage [skip ci]"
          python .github/scripts/publish_generated_paths.py --path-prefix data/statmaker/monitoring/


  refresh-priority-results-and-standings:
    if: ${{ github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/priority-results-standings.yml
    secrets: inherit

  refresh-domestic-scorer-events:
    if: ${{ github.event_name != 'workflow_run' }}
    needs: refresh-priority-results-and-standings
    uses: ./.github/workflows/domestic-results-context-refresh.yml
    with:
      watchdog: true
    secrets: inherit

  refresh-scorer-leaderboards:
    if: ${{ github.event_name != 'workflow_run' }}
    needs: refresh-domestic-scorer-events
    uses: ./.github/workflows/schedule-scorers-manual.yml
    with:
      watchdog: true
      phase: leaders
      max_requests: '6'
      lookback: '14'
    secrets: inherit

  refresh-uefa-scorers:
    if: ${{ github.event_name != 'workflow_run' }}
    needs: refresh-priority-results-and-standings
    uses: ./.github/workflows/league-tables-program-publish.yml
    with:
      watchdog: true
    secrets: inherit

  refresh-postmatch-statistics:
    # Independent, bounded worker. Called after each successful 5-minute results
    # run; on the 15-minute watchdog cron it follows the results refresh.
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) || github.event_name != 'workflow_run' }}
    needs: []
    uses: ./.github/workflows/recent-postmatch-stats.yml
    secrets: inherit
