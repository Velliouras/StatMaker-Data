name: Enrich Domestic Team Logos Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/enrich-domestic-team-logos-once.yml"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enrich current Domestic odds feed with team logos
        run: |
          python -m py_compile scripts/enrich_domestic_odds_team_logos.py
          python scripts/enrich_domestic_odds_team_logos.py
      - name: Guard changed paths
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              odds/odds_api_io/domestic_odds.json|reports/domestic_team_logo_enrichment.json)
                ;;
              *) echo "Unexpected generated change: $path"; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Commit logo metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add odds/odds_api_io/domestic_odds.json reports/domestic_team_logo_enrichment.json
          if git diff --cached --quiet; then
            echo "No team logo metadata changes."
          else
            git commit -m "Enrich Domestic odds with team logos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
