name: Odds Integrity Isolated Validation

on:
  push:
    branches:
      - fix/odds-upstream-dedupe-20260721
    paths:
      - ".github/odds-integrity-trigger"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run upstream integrity regressions
        run: |
          python -m py_compile \
            scripts/odds_market_integrity.py \
            scripts/refresh_domestic_odds_integrity.py \
            scripts/update_uefa_qualifier_odds_integrity.py
          python -m unittest tests/test_odds_market_integrity.py
          python scripts/odds_market_integrity.py odds/odds_api_io/domestic_odds.json

      - name: Record validated commit
        run: |
          printf '%s\n' "$GITHUB_SHA" > .github/odds-upstream-validation-passed
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/odds-upstream-validation-passed
          git commit -m "Record upstream odds validation success"
          git push origin HEAD:fix/odds-upstream-dedupe-20260721
