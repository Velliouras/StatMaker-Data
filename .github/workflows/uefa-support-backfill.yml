name: UEFA Team Support Backfill

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Maximum API-Football requests for missing UEFA participants"
        required: true
        default: "300"
        type: string
  push:
    branches: [main]
    paths:
      - '.github/triggers/uefa-support-backfill'
  schedule:
    # Runs after the first production odds refresh, using the live main-branch UEFA feeds.
    - cron: "37 6 * * *"

permissions:
  contents: write

concurrency:
  # Serialize every workflow that writes canonical StatMaker main data.
  # One running writer at a time prevents manifest/data rebase collisions.
  group: statmaker-canonical-main-writer
  queue: max
  cancel-in-progress: false

env:
  STATMAKER_API_BUDGET_ENFORCE: "true"
  STATMAKER_API_BUDGET_TOKEN: ${{ github.token }}
  STATMAKER_API_BUDGET_POLICY: ${{ github.workspace }}/config/api_football_refresh_policy.json
  STATMAKER_API_BUDGET_PROFILE: background
  PYTHONPATH: ${{ github.workspace }}/scripts/api_budget_runtime:${{ github.workspace }}:${{ github.workspace }}/scripts

jobs:
  backfill:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[budget-policy-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main data repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify shared API budget guard before provider work
        run: |
          python -c "import urllib.request; assert getattr(urllib.request.urlopen, '_statmaker_budget', False), 'Shared provider budget guard is missing'"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate support scripts
        run: |
          python -m py_compile \
            scripts/build_uefa_support_history.py \
            scripts/backfill_uefa_support_history.py \
            scripts/backfill_uefa_support_history_v2.py \
            scripts/uefa_verified_team_ids.py \
            scripts/betting_v2/phase1_uefa_backfill_feed.py \
            scripts/build_statmaker_update_manifest.py

      - name: Rebuild zero-call Domestic support history
        run: python scripts/build_uefa_support_history.py

      - name: Prepare current live UEFA feeds
        run: |
          mkdir -p "$RUNNER_TEMP/uefa_feeds"
          copied=0
          for name in champions_league_odds.json europa_league_odds.json conference_league_odds.json; do
            source="odds/odds_api_io/$name"
            if [ ! -s "$source" ]; then
              echo "UEFA feed is currently inactive or absent; skipping: $source"
              continue
            fi
            cp "$source" "$RUNNER_TEMP/uefa_feeds/$name"
            copied=$((copied + 1))
          done
          echo "Prepared $copied live UEFA feed(s); canonical fixture source will supplement empties."

      - name: Source integrity regressions for canonical UEFA participant feed
        run: python3 -m unittest discover -s tests -p 'test_betting_v2_phase1_uefa_backfill_feed.py' -v

      - name: Verify provider team IDs from immutable cached league/season
        run: python3 -m unittest discover -s tests -p 'test_uefa_verified_team_ids.py' -v

      - name: Repair participant feed from canonical App-Ready data
        run: |
          python3 scripts/betting_v2/phase1_uefa_backfill_feed.py \
            --root . \
            --feed-dir "$RUNNER_TEMP/uefa_feeds" \
            --report "$RUNNER_TEMP/phase1_uefa_feed_source.json"

      - name: Backfill only missing UEFA participant history and logos
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          INPUT_MAX_REQUESTS: ${{ github.event_name == 'push' && '80' || (github.event_name == 'workflow_dispatch' && inputs.max_requests || '200') }}
        run: |
          max_requests="${INPUT_MAX_REQUESTS:-200}"
          python scripts/backfill_uefa_support_history_v2.py \
            --feed-dir "$RUNNER_TEMP/uefa_feeds" \
            --min-matches 10 \
            --max-matches 12 \
            --fixture-lookback 30 \
            --max-requests "$max_requests"

      - name: Validate published support contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('data/statmaker/uefa_support_history.json').read_text(encoding='utf-8'))
          team = json.loads(Path('data/statmaker/uefa_team_support_history.json').read_text(encoding='utf-8'))
          logos = json.loads(Path('data/statmaker/uefa_team_logos.json').read_text(encoding='utf-8'))
          report = json.loads(Path('reports/uefa_support_team_backfill.json').read_text(encoding='utf-8'))
          if int(report.get('fixtureParticipantKeys') or 0) == 0:
              raise SystemExit('UEFA participant feed is empty: refusal to report a successful no-op')
          for label, payload in [('base', base), ('team', team)]:
              minimum = int(payload.get('minimumMatchesPerParticipant') or 10)
              for participant in payload.get('participants', []) or []:
                  count = len(participant.get('matches', []) or [])
                  if count < minimum:
                      raise SystemExit(f'{label} support below minimum: {participant.get("canonicalTeam")}={count}/{minimum}')

          if not isinstance(logos, dict):
              raise SystemExit('UEFA team logo catalog must be a JSON object')
          if int(report.get('apiRequestsUsed') or 0) > int(report.get('apiRequestCap') or 0):
              raise SystemExit('UEFA support backfill exceeded its API request cap')

          print(
              f"UEFA support validated: base={len(base.get('participants', []) or [])} "
              f"team_specific={len(team.get('participants', []) or [])} logos={len(logos)} "
              f"still_missing={len(report.get('stillMissing', []) or [])} "
              f"requests={report.get('apiRequestsUsed')}/{report.get('apiRequestCap')}"
          )
          PY

      # Persistent Actions artifact uploads are disabled by repository policy.
      - name: Rebuild main update manifest
        run: |
          python scripts/build_statmaker_update_manifest.py \
            --profile main \
            --branch main \
            --output data/statmaker/update_manifest.json

      - name: Commit UEFA support artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/statmaker/uefa_support_history.json \
            data/statmaker/uefa_team_support_history.json \
            data/statmaker/uefa_team_logos.json \
            data/statmaker/update_manifest.json \
            reports/uefa_support_team_backfill.json
          if git diff --cached --quiet; then
            echo "No UEFA support changes to commit."
          else
            git commit -m "Backfill missing UEFA participant support"
            # Preserve unpublished runner scratch; hash only the committed canonical tree.
            git stash push --include-untracked --message "Unpublished producer scratch"
            python .github/scripts/publish_generated_paths.py --rebuild-main-manifest \
              --path-prefix data/statmaker/uefa_support_history.json \
              --path-prefix data/statmaker/uefa_team_support_history.json \
              --path-prefix data/statmaker/uefa_team_logos.json \
              --path-prefix data/statmaker/update_manifest.json \
              --path-prefix reports/uefa_support_team_backfill.json
          fi
