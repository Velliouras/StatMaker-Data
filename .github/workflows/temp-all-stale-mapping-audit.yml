name: Temporary All Stale Mapping Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-all-stale-mapping-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit stale canonical mappings without provider calls
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path
          import audit_domestic_mapping as audit
          import domestic_live_july_pipeline as pipeline
          import update_domestic_odds_api_io as odds

          feed = json.loads(Path('odds/odds_api_io/domestic_odds.json').read_text(encoding='utf-8-sig'))
          config = pipeline.load_json(pipeline.DOMESTIC_CONFIG, {})
          registry = pipeline.load_json(pipeline.REGISTRY_PATH, {}).get('leagues', [])
          aliases = pipeline.generated_aliases(registry)
          canonicals = audit.canonical_teams(config)

          rows = []
          by_league = {}
          for league in feed.get('leagues', []) or []:
              if not isinstance(league, dict):
                  continue
              code = str(league.get('leagueCode') or '')
              for match in league.get('matches', []) or []:
                  if not isinstance(match, dict):
                      continue
                  status = str(match.get('teamMappingStatus') or '')
                  if status not in {'unmatched', 'partial'}:
                      continue
                  home_raw = str(match.get('providerHomeTeam') or '').strip()
                  away_raw = str(match.get('providerAwayTeam') or '').strip()
                  teams = []
                  for side, team in [('home', home_raw), ('away', away_raw)]:
                      if not team:
                          continue
                      debug = {}
                      mapped, canonical = odds.canonical_team_info(team, code, aliases, debug)
                      suggestion, audit_status, suggestions = audit.map_team(team, code, aliases, canonicals)
                      teams.append({
                          'side': side,
                          'providerTeam': team,
                          'productionCanonical': canonical,
                          'auditCanonical': suggestion,
                          'auditStatus': audit_status,
                          'suggestions': suggestions,
                      })
                  item = {
                      'leagueCode': code,
                      'date': match.get('date'),
                      'id': match.get('id') or match.get('matchId'),
                      'teamMappingStatus': status,
                      'marketCount': len(match.get('markets') or []),
                      'teams': teams,
                  }
                  rows.append(item)
                  by_league[code] = by_league.get(code, 0) + 1

          payload = {
              'staleMatchCount': len(rows),
              'byLeague': by_league,
              'matches': rows,
          }
          out = Path('reports/temp_all_stale_mapping_audit.json')
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/temp_all_stale_mapping_audit.json
          git commit -m "Audit all stale canonical team mappings"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
