name: StatMaker UAT Probability-First App-Ready Main

on:
  workflow_dispatch:
    inputs:
      statmaker_ref:
        description: "StatMaker UAT ref"
        required: true
        default: "uat-remove-bb-move-update-20260923"
        type: string
  push:
    branches: [main]
    paths:
      - '.github/app-ready-uat-direction-trigger'

permissions:
  contents: write

concurrency:
  group: statmaker-uat-probability-first-app-ready-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve UAT source ref
        id: source
        shell: bash
        env:
          DISPATCH_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.statmaker_ref || '' }}
        run: |
          set -euo pipefail
          ref="${DISPATCH_REF}"
          if [[ -z "$ref" ]]; then
            ref="$(sed -n '1p' .github/app-ready-uat-direction-trigger | tr -d '\r\n')"
          fi
          [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid StatMaker ref: $ref" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Validate canonical Domestic provider identity
        run: python scripts/validate_domestic_cache_provider_identity.py

      - name: Verify Asian competitions remain in PROD scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/statmaker/domestic_enriched/index.json').read_text(encoding='utf-8'))
          codes={
              str(row.get('leagueCode') or row.get('league_code') or '').strip().upper()
              for row in payload.get('leagues',[]) if isinstance(row,dict)
          }
          required={'CHN','JPN','KOR','SAU','UAE'}
          missing=sorted(required-codes)
          if missing:
              raise SystemExit('Asian competitions were removed from PROD data scope: '+','.join(missing))
          print('PROD_ASIAN_COMPETITIONS_PRESERVED_OK',','.join(sorted(required)))
          PY

      - name: Require private read token
        env:
          TOKEN: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
        run: test -n "$TOKEN" || (echo 'Missing STATMAKER_PRIVATE_READ_TOKEN' >&2; exit 1)

      - name: Checkout exact StatMaker UAT engine
        uses: actions/checkout@v4
        with:
          repository: Velliouras/StatMaker
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
          path: statmaker-private
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve UAT engine contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path
          models=Path('statmaker-private/app/src/main/java/com/statmaker/app/PreparedPatternRecommendationModels.kt').read_text()
          store=Path('statmaker-private/app/src/main/java/com/statmaker/app/PreparedBettingSnapshotStore.kt').read_text()
          rules=re.search(r'PREPARED_PATTERN_RULES_FINGERPRINT\s*=\s*"([^"]+)"', models)
          schema=re.search(r'DATABASE_VERSION\s*=\s*(\d+)', store)
          if not rules or not schema:
              raise SystemExit('Could not resolve UAT prepared contract')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write('APP_READY_PATTERN_RULES_FINGERPRINT='+rules.group(1)+'\n')
              out.write('APP_READY_PREPARED_SCHEMA_VERSION='+schema.group(1)+'\n')
          PY
          echo "APP_READY_STATMAKER_COMMIT=$(git -C statmaker-private rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Clone exact PROD App-Ready snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest=json.loads(Path('data/statmaker/app_ready/update_manifest.json').read_text(encoding='utf-8'))
          root=Path('app-ready-checkpoint')
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir(parents=True)

          for artifact in manifest.get('artifacts',[]):
              path=Path(str(artifact.get('path') or ''))
              if not path.is_file():
                  raise SystemExit(f'Missing PROD App-Ready artifact: {path}')
              with zipfile.ZipFile(path) as bundle:
                  for info in bundle.infolist():
                      if info.filename == 'bundle_manifest.json':
                          continue
                      target=(root / info.filename).resolve()
                      if root.resolve() not in target.parents and target != root.resolve():
                          raise SystemExit(f'Unsafe bundle path: {info.filename}')
                      bundle.extract(info, root)

          md=manifest.get('metadata',{})
          main_raw=str(md.get('mainManifestRaw') or '')
          uefa_raw=str(md.get('uefaManifestRaw') or '')
          if not main_raw or not uefa_raw:
              raise SystemExit('PROD App-Ready manifest is missing exact source manifests')

          prefs=root/'shared_prefs'
          prefs.mkdir(parents=True, exist_ok=True)
          xml_root=ET.Element('map')
          for name,value in (
              ('main_manifest_raw',main_raw),
              ('uefa_manifest_raw',uefa_raw),
          ):
              node=ET.SubElement(xml_root,'string',{'name':name})
              node.text=value
          ET.ElementTree(xml_root).write(
              prefs/'statmaker_data_manifests.xml',
              encoding='utf-8',
              xml_declaration=True,
          )

          versions_root=ET.Element('map')
          for name,value in (
              ('domestic_history_fingerprint',str(md.get('domesticHistoryFingerprint') or '')),
              ('uefa_support_fingerprint',str(md.get('uefaSupportFingerprint') or '')),
          ):
              if not value:
                  raise SystemExit(f'PROD App-Ready manifest missing {name}')
              node=ET.SubElement(versions_root,'string',{'name':name})
              node.text=value
          ET.ElementTree(versions_root).write(
              prefs/'statmaker_prepared_data_versions.xml',
              encoding='utf-8',
              xml_declaration=True,
          )

          required=[
              root/'databases/statmaker.db',
              root/'databases/statmaker_prepared_betting.db',
              root/'files/app_ready_odds/domestic.json',
              root/'files/app_ready_odds/champions_league.json',
              root/'files/app_ready_odds/europa_league.json',
              root/'files/app_ready_odds/conference_league.json',
          ]
          missing=[str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit('PROD App-Ready clone incomplete: '+','.join(missing))

          print(
              'UAT_EXACT_PROD_APP_READY_CLONED',
              manifest.get('contentVersion'),
              manifest.get('generatedAt'),
              md.get('mainContentVersion'),
              md.get('uefaContentVersion'),
          )
          PY

      - name: Materialize Probability-First candidates host-side
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_uat_direction_pattern_candidates.py \
            app-ready-checkpoint \
            app-ready-export/raw \
            app-ready-export/source
          python scripts/materialize_prepared_fixture_index.py \
            app-ready-export/raw/databases/statmaker_prepared_betting.db
          python scripts/validate_app_ready_retirement_contract.py \
            app-ready-export/raw/databases/statmaker_prepared_betting.db

      - name: Fetch exact Domestic enriched index from cloned PROD manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          source=Path('app-ready-export/source')
          main=json.loads((source/'main_manifest.json').read_text(encoding='utf-8'))
          item=next((x for x in main.get('artifacts',[]) if x.get('id')=='domestic_enriched_index'),None)
          if not item:
              raise SystemExit('Cloned PROD manifest missing domestic_enriched_index')
          url=str(item.get('url') or '')
          expected=str(item.get('sha256') or '')
          if not url or not expected:
              raise SystemExit('Cloned PROD domestic_enriched_index contract incomplete')
          data=urllib.request.urlopen(url,timeout=60).read()
          actual=hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'Exact PROD domestic_enriched_index hash mismatch: {actual} != {expected}')
          (source/'domestic_enriched_index.json').write_bytes(data)
          print('UAT_EXACT_PROD_DOMESTIC_INDEX_OK', actual[:12])
          PY

      - name: Build isolated UAT bundles
        env:
          APP_READY_PUBLISH_SUBDIR: data/statmaker/app_ready_uat/probability-first-v1
        run: python scripts/build_uat_app_ready_from_device.py app-ready-export/raw app-ready-export/out app-ready-export/source

      - name: Publish isolated UAT artifacts to Data main
        shell: bash
        run: |
          set -euo pipefail
          src="app-ready-export/out"
          rel="data/statmaker/app_ready_uat/probability-first-v1"
          staging="$(mktemp -d)"
          mkdir -p "$staging/payload"
          cp "$src"/app_ready_*_bundle-*.zip "$staging/payload/"
          cp "$src/update_manifest.json" "$staging/payload/update_manifest.json"

          published=false
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            rm -rf "$rel"
            mkdir -p "$rel"
            cp -a "$staging/payload/." "$rel/"
            git add "$rel"
            if git diff --cached --quiet; then
              echo "APP_READY_UAT_ALREADY_PUBLISHED"
              published=true
              break
            fi
            git config user.name "StatMaker UAT Artifact Bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Publish isolated UAT probability-first app-ready artifacts"
            if git push origin HEAD:main; then
              echo "APP_READY_UAT_PUBLISH_OK attempt=$attempt"
              published=true
              break
            fi
            sleep $((attempt * 2))
          done
          [[ "$published" == "true" ]] || { echo "UAT artifact publish failed" >&2; exit 1; }

      - name: Verify published UAT manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +main:refs/remotes/origin/main
          git show refs/remotes/origin/main:data/statmaker/app_ready_uat/probability-first-v1/update_manifest.json > /tmp/uat_manifest.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('/tmp/uat_manifest.json').read_text())
          md=m.get('metadata',{})
          assert m.get('profile') == 'app_ready_uat'
          assert md.get('uatProfile') == 'probability-first-v1'
          assert md.get('statmakerCommit') == os.environ['APP_READY_STATMAKER_COMMIT']
          assert md.get('preparedPatternRulesFingerprint') == os.environ['APP_READY_PATTERN_RULES_FINGERPRINT']
          assert md.get('engineContract') == 'uat-probability-first-v1-prod-source-data'
          assert int(md.get('preparedPatternCandidateCount') or 0) > 0
          print(
              'APP_READY_UAT_REMOTE_OK',
              md.get('statmakerCommit'),
              md.get('preparedPatternRulesFingerprint'),
              md.get('preparedPatternCandidateCount'),
              md.get('mainContentVersion'),
              md.get('uefaContentVersion'),
          )
          PY
