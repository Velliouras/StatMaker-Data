name: Enrich UEFA Qualifier Logos Build

on:
  push:
    branches:
      - build/uefa-qualifier-feed-20260720
    paths:
      - "scripts/enrich_uefa_qualifier_logos_build.py"
      - ".github/workflows/enrich-uefa-qualifier-logos-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich-uefa-qualifier-logos-build
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enrich UEFA qualifier team logos from cached API-Football data
        run: python scripts/enrich_uefa_qualifier_logos_build.py

      - name: Validate logo fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('odds/odds_api_io/champions_league_odds.json'),
              Path('odds/odds_api_io/europa_league_odds.json'),
              Path('odds/odds_api_io/conference_league_odds.json'),
          ]
          matches = covered = 0
          for path in paths:
              payload = json.loads(path.read_text(encoding='utf-8'))
              for match in payload.get('matches', []) or []:
                  matches += 1
                  if match.get('homeTeamLogo') and match.get('awayTeamLogo'):
                      covered += 1
          print(f'UEFA logo coverage: {covered}/{matches} matches with both logos')
          if covered == 0:
              raise SystemExit('No UEFA team logos resolved from cached API-Football data')
          PY

      - name: Commit enriched build-only feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            odds/odds_api_io/champions_league_odds.json \
            odds/odds_api_io/europa_league_odds.json \
            odds/odds_api_io/conference_league_odds.json \
            reports/uefa_qualifier_logo_enrichment.json
          if git diff --cached --quiet; then
            echo "No UEFA logo enrichment changes."
          else
            git commit -m "Enrich build-only UEFA qualifier team logos"
            git push origin HEAD:build/uefa-qualifier-feed-20260720
          fi
