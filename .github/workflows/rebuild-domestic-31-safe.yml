name: Rebuild Domestic 31 Safe

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/salvage_extra_12_exact_odds_from_history.py"
      - ".github/workflows/rebuild-domestic-31-safe.yml"
  push:
    branches: [rebuild-domestic-31-safe]
    paths:
      - "scripts/salvage_extra_12_exact_odds_from_history.py"
      - ".github/workflows/rebuild-domestic-31-safe.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  salvage-exact-history-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch with full history
        uses: actions/checkout@v4
        with:
          ref: rebuild-domestic-31-safe
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Salvage only exact non-expired odds for extra 12
        run: python scripts/salvage_extra_12_exact_odds_from_history.py

      - name: Validate preservation and inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/domestic_31_extra_odds_salvage.json').read_text(encoding='utf-8'))
          assert report.get('existingNonExtraObjectsPreserved') is True
          inventory = report.get('inventory') or {}
          feed = json.loads(Path('odds/odds_api_io/domestic_odds.json').read_text(encoding='utf-8'))
          assert (feed.get('registry') or {}).get('registryLeagueCount') == 31
          assert inventory.get('leagueRowCount') == len(feed.get('leagues', []) or [])
          for league in feed.get('leagues', []) or []:
              for match in league.get('matches', []) or []:
                  for market in match.get('markets', []) or []:
                      assert market.get('exactBookmakerOdds') is True
                      assert str(market.get('bookmaker') or '').strip()
                      assert float(market.get('odds')) > 1.0
          print(report)
          PY

      - name: Commit only salvaged exact odds and report to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds/odds_api_io/domestic_odds.json reports/domestic_31_extra_odds_salvage.json
          if git diff --cached --quiet; then
            echo "No historical exact odds available to add."
          else
            git commit -m "Salvage exact odds for extra Domestic leagues from Git history"
            git push origin HEAD:rebuild-domestic-31-safe
          fi
