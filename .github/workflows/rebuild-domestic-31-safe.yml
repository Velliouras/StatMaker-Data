name: Rebuild Domestic 31 Safe

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/refresh_extra_12_odds_safe.py"
      - ".github/workflows/rebuild-domestic-31-safe.yml"
  push:
    branches: [rebuild-domestic-31-safe]
    paths:
      - "scripts/refresh_extra_12_odds_safe.py"
      - ".github/workflows/rebuild-domestic-31-safe.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  refresh-extra12-odds-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: rebuild-domestic-31-safe
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh exact odds only for extra 12
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDS_API_IO_BOOKMAKERS: Bet365,Unibet
        run: python scripts/refresh_extra_12_odds_safe.py

      - name: Validate preservation and exact odds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          extra = {"SRB","BGR","SVN","HUN","CZE","SVK","ISL","LVA","LTU","EST","FIN2","NOR2"}
          report = json.loads(Path('reports/domestic_31_extra_odds_safe.json').read_text(encoding='utf-8'))
          assert report.get('existingLeagueObjectsPreserved') is True
          assert set(report.get('requested') or []) == extra
          feed = json.loads(Path('odds/odds_api_io/domestic_odds.json').read_text(encoding='utf-8'))
          assert (feed.get('registry') or {}).get('registryLeagueCount') == 31
          for league in feed.get('leagues', []) or []:
              for match in league.get('matches', []) or []:
                  for market in match.get('markets', []) or []:
                      assert market.get('exactBookmakerOdds') is True
                      assert str(market.get('bookmaker') or '').strip()
                      assert float(market.get('odds')) > 1.0
          print({
              'existingLeagueObjectsPreserved': True,
              'feedLeagueRows': len(feed.get('leagues', []) or []),
              'addedOrRefreshed': report.get('addedOrRefreshed'),
              'rateLimitRemaining': report.get('rateLimitRemaining'),
              'warnings': report.get('warnings'),
          })
          PY

      - name: Commit only odds data to isolated branch
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds/odds_api_io/domestic_odds.json reports/domestic_31_extra_odds_safe.json
          if git diff --cached --quiet; then
            echo "No odds changes."
          else
            git commit -m "Refresh exact odds for extra 12 without touching existing leagues"
            git push origin HEAD:rebuild-domestic-31-safe
          fi
