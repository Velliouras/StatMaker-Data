name: Betting V2 Cross Market Corner Counts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/triggers/betting-v2-cross-market-counts-20261018']
permissions:
  contents: write
concurrency:
  group: betting-v2-cross-market-counts
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify likelihood, quote boundaries and replay scoring
        run: |
          python -m pip install --quiet numpy scipy scikit-learn
          python -m unittest discover -s tests -p test_cross_market_counts.py -v
          python -m unittest discover -s tests -p test_cross_market_replay.py -v
      - name: Compare frozen baseline and new prior-only corner counts
        run: python -u scripts/betting_v2/research_cross_market.py --output reports/betting_v2/cross_market_counts_20261018
      # Persistent Actions artifact uploads are disabled by repository policy.
      - name: Save research reports and resumable checkpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          folder="reports/betting_v2/cross_market_counts_20261018"
          saved="$(mktemp -d)"
          if [ ! -d "$folder" ]; then exit 0; fi
          cp -a "$folder/." "$saved/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            mkdir -p "$folder"
            cp -a "$saved/." "$folder/"
            git add -- "$folder"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Checkpoint chronological cross-market corner research [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
