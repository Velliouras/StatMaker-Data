name: Probe ElaBet World Cup Odds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-elabet-wc-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Probe ElaBet World Cup odds
        run: python scripts/probe_elabet_wc_odds.py

      - name: Commit ElaBet probe output if changed
        run: |
          if git diff --quiet -- odds/elabet/world_cup_odds.json odds/elabet/debug_report.json odds/elabet/elabet_probe_snapshot.txt; then
            echo "No ElaBet probe changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds/elabet/world_cup_odds.json odds/elabet/debug_report.json odds/elabet/elabet_probe_snapshot.txt
          git commit -m "Update ElaBet World Cup odds probe"
          git push
