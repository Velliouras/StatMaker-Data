name: API-Football Fixture Stats Fetch

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Safe API request cap for this run"
        required: true
        default: "85"
        type: string
      priority_group:
        description: "Optional priority_group from config"
        required: false
        default: ""
        type: string
      league_id:
        description: "Optional API-Football league id"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  api-football-fixture-stats-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Nordic extra leagues
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          extra = json.loads((root / 'config/nordic_extra_leagues.json').read_text(encoding='utf-8'))['leagues']
          path = root / 'config/api_football_enrichment_leagues.json'
          cfg = json.loads(path.read_text(encoding='utf-8-sig'))
          leagues = cfg.setdefault('leagues', [])
          by_code = {str(x.get('leagueCode', '')).upper(): i for i, x in enumerate(leagues)}
          changed = False
          for item in extra:
              code = item['leagueCode']
              entry = {
                  'leagueCode': code,
                  'continent': 'Europe',
                  'country': item['country'],
                  'display_name': item['competition'],
                  'football_data_code': code,
                  'api_football_league_id': item['apiFootballLeagueId'],
                  'season': item.get('season', '2026'),
                  'app_season': item.get('season', '2026'),
                  'enabled': True,
                  'priority_group': 'scandinavia',
              }
              if code in by_code:
                  old = leagues[by_code[code]]
                  merged = {**old, **entry}
                  if merged != old:
                      leagues[by_code[code]] = merged
                      changed = True
              else:
                  leagues.append(entry)
                  changed = True
          if changed:
              cfg['version'] = max(int(cfg.get('version', 3)), 4)
              path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Nordic extra enrichment leagues applied: {changed}')
          PY

      - name: Fetch API-Football fixture statistics
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          args=(--max-requests "${{ inputs.max_requests }}")
          if [ -n "${{ inputs.priority_group }}" ]; then
            args+=(--priority-group "${{ inputs.priority_group }}")
          fi
          if [ -n "${{ inputs.league_id }}" ]; then
            args+=(--league-id "${{ inputs.league_id }}")
          fi
          python scripts/api_football_fetch_fixture_stats.py "${args[@]}"

      - name: Commit fixture statistics cache and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/api_football/fixture_stats reports/api_football_fixture_stats_fetch.json reports/api_football_fixture_stats_fetch.csv reports/api_football_fixture_stats_fetch.md
          if git diff --cached --quiet; then
            echo "No API-Football fixture statistics cache changes to commit."
          else
            git commit -m "Update API-Football fixture statistics cache"
            git push
          fi
