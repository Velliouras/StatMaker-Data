name: Betting V2 Phase 2 - chronological model QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/betting-v2-phase2-model-qa'

permissions:
  contents: read

concurrency:
  group: betting-v2-phase2-model-qa
  cancel-in-progress: false

jobs:
  chronological-model-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Sparse checkout of real archived history and model sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/betting_v2/*
            /tests/test_betting_v2_phase2_model_validation.py
            /data/statmaker/domestic_enriched/*
      - name: Verify Phase 2 Python sources
        run: |
          python3 -m py_compile scripts/betting_v2/phase2_model_validation.py scripts/betting_v2/walk_forward_elo.py scripts/betting_v2/walk_forward_goals.py tests/test_betting_v2_phase2_model_validation.py
      - name: Regression checks for chrono leakage, isolation and frozen calibration
        run: |
          python3 -m unittest discover -s tests -p 'test_betting_v2_phase2_model_validation.py' -v
          python3 -m unittest discover -s tests -p 'test_betting_v2_elo_fallback.py' -v
      - name: Real historical chronological xG and Elo holdouts
        run: |
          python3 scripts/betting_v2/phase2_model_validation.py \
            --repository-root . \
            --output "${RUNNER_TEMP}/betting-v2-phase2-model-validation.json"
      - name: Save model evidence (not App-Ready)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betting-v2-phase2-chronological-model-evidence
          path: ${{ runner.temp }}/betting-v2-phase2-model-validation.json
          if-no-files-found: warn
          retention-days: 14
