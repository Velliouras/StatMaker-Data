name: Update Domestic Active and July Odds

on:
  workflow_dispatch:
    inputs:
      cycle_size:
        description: "Number of active/July leagues to refresh in this run"
        required: true
        default: "8"
        type: string
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_domestic_live_july_odds.py"
      - "scripts/domestic_odds_expansion.py"
      - "scripts/domestic_market_expansion_v15.py"
      - "scripts/rebuild_domestic_expanded_markets_from_archive.py"
      - "scripts/update_domestic_odds_api_io.py"
      - "tests/test_domestic_live_july_pipeline.py"
      - "tests/test_domestic_market_expansion_v15.py"
      - ".github/workflows/update-domestic-live-july-odds.yml"

permissions:
  contents: write

concurrency:
  group: domestic-active-july-odds
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test registry, merge and exact-odds contracts
        id: tests
        continue-on-error: true
        run: |
          mkdir -p reports
          python -m unittest \
            tests/test_domestic_live_july_pipeline.py \
            tests/test_domestic_market_expansion_v15.py \
            > reports/domestic_live_july_odds_tests.log 2>&1
          cat reports/domestic_live_july_odds_tests.log

      - name: Refresh rotating exact-odds batch
        id: refresh
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDS_API_IO_BOOKMAKERS: ${{ vars.ODDS_API_IO_BOOKMAKERS || 'Bet365,Unibet' }}
          INPUT_CYCLE_SIZE: ${{ inputs.cycle_size }}
        run: |
          cycle_size="${INPUT_CYCLE_SIZE:-8}"
          python scripts/refresh_domestic_live_july_odds.py \
            --cycle-size "$cycle_size" \
            > reports/domestic_live_july_odds.log 2>&1
          cat reports/domestic_live_july_odds.log

      - name: Validate canonical betting and full provider archive
        id: validate
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY' > reports/domestic_live_july_odds_validate.log 2>&1
          import datetime as dt
          import json
          from pathlib import Path

          root = Path('.')
          registry = json.loads((root / 'data/statmaker/domestic_live_july_registry.json').read_text(encoding='utf-8'))
          feed = json.loads((root / 'odds/odds_api_io/domestic_odds.json').read_text(encoding='utf-8'))
          archive = json.loads((root / 'odds/odds_api_io/domestic_provider_markets.json').read_text(encoding='utf-8'))
          registry_codes = {str(row.get('leagueCode') or '') for row in registry.get('leagues', [])}
          feed_codes = {str(row.get('leagueCode') or '') for row in feed.get('leagues', [])}
          archive_codes = {str(row.get('leagueCode') or '') for row in archive.get('leagues', [])}
          if not registry_codes or registry_codes != feed_codes or registry_codes != archive_codes:
              raise SystemExit(
                  f'Registry mismatch: registry={len(registry_codes)} feed={len(feed_codes)} archive={len(archive_codes)}'
              )

          today = dt.datetime.now(dt.timezone.utc).date().isoformat()
          matches = 0
          markets = 0
          for league in feed.get('leagues', []) or []:
              for match in league.get('matches', []) or []:
                  date = str(match.get('date') or '')[:10]
                  if date and date < today:
                      raise SystemExit(f'Expired odds match: {league.get("leagueCode")} {date}')
                  if match.get('teamMappingStatus') != 'matched' or match.get('usableForStats') is not True:
                      raise SystemExit(f'Unmatched teams in production odds: {league.get("leagueCode")}')
                  matches += 1
                  for market in match.get('markets', []) or []:
                      if market.get('exactBookmakerOdds') is not True:
                          raise SystemExit('Non-exact odds market found')
                      if not market.get('bookmaker') or float(market.get('odds') or 0) <= 1.0:
                          raise SystemExit('Invalid bookmaker/price in exact market')
                      markets += 1

          provider_matches = 0
          provider_payloads = 0
          for league in archive.get('leagues', []) or []:
              for match in league.get('matches', []) or []:
                  date = str(match.get('date') or '')[:10]
                  if date and date < today:
                      raise SystemExit(f'Expired provider archive match: {league.get("leagueCode")} {date}')
                  provider_matches += 1
                  for payload in match.get('providerMarkets', []) or []:
                      if payload.get('exactProviderPayload') is not True:
                          raise SystemExit('Non-exact provider payload found')
                      if not payload.get('bookmaker') or not isinstance(payload.get('market'), dict):
                          raise SystemExit('Invalid full provider market payload')
                      provider_payloads += 1
          print(
              f'Validated {len(feed_codes)} leagues, {matches} canonical matches, '
              f'{markets} canonical exact markets, {provider_matches} provider matches, '
              f'{provider_payloads} complete provider market payloads'
          )
          PY
          cat reports/domestic_live_july_odds_validate.log

      - name: Write odds workflow status
        run: |
          {
            echo "tests=${{ steps.tests.outcome }}"
            echo "refresh=${{ steps.refresh.outcome }}"
            echo "validate=${{ steps.validate.outcome }}"
            echo "commit=${GITHUB_SHA}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > reports/domestic_live_july_odds_workflow_status.txt

      - name: Commit validated odds artifacts
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            odds/odds_api_io/domestic_odds.json \
            odds/odds_api_io/domestic_provider_markets.json \
            reports/domestic_odds_debug.json \
            reports/domestic_live_july_odds_refresh.json \
            reports/domestic_live_july_odds_tests.log \
            reports/domestic_live_july_odds.log \
            reports/domestic_live_july_odds_validate.log \
            reports/domestic_live_july_odds_workflow_status.txt \
            data/statmaker/domestic_live_july_state.json
          if git diff --cached --quiet; then
            echo "No active/July Domestic odds changes to commit."
          else
            git commit -m "Update active and July Domestic exact odds"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Preserve failed-run diagnostics
        if: steps.validate.outcome != 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            reports/domestic_live_july_odds_tests.log \
            reports/domestic_live_july_odds_workflow_status.txt
          if [ -f reports/domestic_live_july_odds.log ]; then git add reports/domestic_live_july_odds.log; fi
          if [ -f reports/domestic_live_july_odds_validate.log ]; then git add reports/domestic_live_july_odds_validate.log; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record active and July Domestic odds failure"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail when odds refresh is not valid
        if: steps.validate.outcome != 'success'
        run: exit 1
