          assert status.get('artifactCount') == len(artifacts) == 2
          assert {item.get('id') for item in artifacts} == {'app_ready_stats_bundle','app_ready_betting_bundle'}
          metadata=manifest.get('metadata',{})
          assert metadata.get('domesticHistoryFingerprint') not in {'', '0|0|0'}
          assert int(metadata.get('preparedBettingSchemaVersion') or 0) == 12
          assert metadata.get('preparedPatternRulesFingerprint') == 'pattern-policy-v2-final-read-model-v6-probability-first-prod'
          assert metadata.get('statmakerCommit') == os.environ.get('EXPECTED_STATMAKER_COMMIT')
          assert metadata.get('engineContract') == 'probability-first-prod-schema12-v6-retired-inputs-v1'
          assert metadata.get('inputRetirementContract') == 'asian-and-handicap-market-types-only-before-engine-v2'
          assert metadata.get('preparedSimulationContract') == 'monte-carlo-v1-prod-data-uat-engine'
          assert int(metadata.get('preparedSimulationRowCount') or 0) > 0
          assert int(metadata.get('preparedSimulationRuns') or 0) >= 10000
          assert int(metadata.get('preparedMatchSimulationCount') or 0) > 0
          assert metadata.get('preparedTeamEloContract') == 'team-elo-v1'
          assert int(metadata.get('preparedTeamEloCount') or 0) > 0
          assert int(metadata.get('preparedTeamEloLeagueCount') or 0) > 0
          assert metadata.get('preparedLeagueSimulationContract') == 'league-season-monte-carlo-v3-all-domestic-elo'
          assert int(metadata.get('preparedLeagueSimulationCount') or 0) > 0
          assert int(metadata.get('preparedLeagueSimulationTeamCount') or 0) > 0
          assert int(metadata.get('preparedLeagueSimulationRuns') or 0) >= 10000
          assert str(metadata.get('preparedPatternGenerationId') or '').strip()
          assert int(metadata.get('preparedPatternCandidateCount') or 0) > 0
          eligible=int(metadata.get('preparedPatternRecommendationEligibleCount') or 0)
          performance_rows=int(metadata.get('preparedPerformanceRowCount') or 0)
          opponent_required=int(metadata.get('preparedOpponentAdjustedRequiredCount') or 0)
          opponent_models=int(metadata.get('preparedOpponentModelCount') or 0)
          favorite_shadow=int(metadata.get('preparedFavoriteShadowCount') or 0)
          assert eligible > 0
          assert performance_rows == eligible
          assert opponent_required == 0 or opponent_models > 0
          assert opponent_models == 0 or favorite_shadow > 0
          assert status.get('preparedPatternGenerationId') == metadata.get('preparedPatternGenerationId')
          assert int(status.get('preparedPatternRecommendationEligibleCount') or 0) == eligible
          assert int(status.get('preparedPerformanceRowCount') or 0) == performance_rows
          assert int(status.get('preparedOpponentModelCount') or 0) == opponent_models
          assert int(status.get('preparedFavoriteShadowCount') or 0) == favorite_shadow
          assert status.get('statmakerCommit') == metadata.get('statmakerCommit')
          print(
              'APP_READY_PUBLISH_OK',
              status['contentVersion'],
              status['generatedAt'],
              'generation='+metadata['preparedPatternGenerationId'],
              'candidates='+str(metadata['preparedPatternCandidateCount']),
              'eligible='+str(metadata['preparedPatternRecommendationEligibleCount']),
              'performance='+str(metadata['preparedPerformanceRowCount']),
              'opponent_models='+str(metadata['preparedOpponentModelCount']),
              'favorite_shadow='+str(metadata['preparedFavoriteShadowCount']),
