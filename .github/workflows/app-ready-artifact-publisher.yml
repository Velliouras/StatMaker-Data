name: StatMaker App-Ready Artifact Publisher

# Current-season Domestic read-model regeneration trigger.
on:
  workflow_dispatch:
    inputs:
      statmaker_ref:
        description: "Private StatMaker ref"
        required: true
        default: "main"
        type: string
      force:
        description: "Force generation"
        required: true
        default: false
        type: boolean
  workflow_run:
    # GitHub suppresses ordinary push-triggered workflow recursion for commits made
    # with GITHUB_TOKEN. Chain the heavyweight publisher only from canonical producers
    # whose changes must reach the immutable phone read-model promptly.
    workflows:
      - "Domestic Statistics Universe"
      - "Domestic Targeted Stats Backfill"
      - "Odds Integrity Production Refresh"
      - "Domestic Proposal Readiness Rebuild"
      - "Build StatMaker Domestic Enriched"
      - "Greece Super League 2 Sync"
      - "Turkey Super Lig Schedule Sync"
      - "Domestic Archive Betting Rehydrate"
      - "Domestic Enriched Cache Rebuild"
      - "API-Football Targeted Fixture Schedule Refresh"
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'data/statmaker/update_manifest.json'
      - 'odds/odds_api_io/domestic_odds.json'
      - 'data/statmaker/uefa_support_history.json'
      - 'data/statmaker/uefa_team_support_history.json'
      - 'data/statmaker/domestic_proposal_readiness.json'
      - 'mappings/domestic_team_aliases.json'
      - 'data/statmaker/domestic_enriched/**'
      - 'data/api_football/domestic_normalized_fixture_stats.json'
      - '.github/app-ready-rebuild-trigger'
  schedule:
    - cron: "20 2,6,10,14,18,22 * * *"

permissions:
  contents: write
  actions: read
concurrency:
  # Failed/cancelled upstream workflow_run events are no-op runs. Give those runs a
  # unique key so they cannot cancel a valid publisher already building a generation.
  group: statmaker-app-ready-v2-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || 'active' }}
  # Never cancel a valid in-flight generation. A completed generation is publishable even if
  # newer canonical inputs arrive while it is building; the next queued run will catch up.
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      APP_READY_UAT_SOURCE: "true"
    # The prepared source phase has its own explicit 90-minute ceiling and failure checkpoint.
    # Keep the job ceiling above that so GitHub never killss the runner before the checkpoint trap.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Validate canonical Domestic provider identity
        run: python scripts/validate_domestic_cache_provider_identity.py

      - name: Check source versions
        id: preflight
        shell: bash
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          STATMAKER_TOKEN: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
          STATMAKER_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.statmaker_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +build/uefa-qualifier-feed-20260720:refs/remotes/origin/build/uefa-qualifier-feed-20260720
          python - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request
          from pathlib import Path

          token=str(os.environ.get('STATMAKER_TOKEN') or '').strip()
          ref=str(os.environ.get('STATMAKER_REF') or 'main').strip() or 'main'
          if not token:
              raise SystemExit('Missing STATMAKER_PRIVATE_READ_TOKEN')
          request=urllib.request.Request(
              'https://api.github.com/repos/Velliouras/StatMaker/commits/' + urllib.parse.quote(ref, safe=''),
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'statmaker-app-ready-publisher',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              expected_statmaker_commit=str(json.load(response).get('sha') or '').strip()
          if not expected_statmaker_commit:
              raise SystemExit(f'Could not resolve StatMaker ref: {ref}')

          main=json.loads(Path('data/statmaker/update_manifest.json').read_text())
          uefa=json.loads(subprocess.check_output(['git','show','origin/build/uefa-qualifier-feed-20260720:data/statmaker/uefa_update_manifest.json'],text=True))
          p=Path('data/statmaker/app_ready/update_manifest.json'); old=json.loads(p.read_text()) if p.is_file() else {}
          m=old.get('metadata',{})
          changed=m.get('mainContentVersion')!=main.get('contentVersion') or m.get('uefaContentVersion')!=uefa.get('contentVersion')
          expected_rules='pattern-policy-v2-final-read-model-v6-probability-first-prod'
          expected_schema=12
          expected_simulation_contract='monte-carlo-v1-prod-data-uat-engine'
          expected_elo_contract='team-elo-v1'
          expected_league_simulation_contract='league-season-monte-carlo-v3-all-domestic-elo'
          contract_migration=(
              str(m.get('preparedPatternRulesFingerprint') or '') != expected_rules or
              int(m.get('preparedBettingSchemaVersion') or 0) != expected_schema or
              str(m.get('statmakerCommit') or '') != expected_statmaker_commit or
              str(m.get('preparedSimulationContract') or '') != expected_simulation_contract or
              int(m.get('preparedSimulationRowCount') or 0) <= 0 or
              int(m.get('preparedSimulationRuns') or 0) < 10000 or
              int(m.get('preparedMatchSimulationCount') or 0) <= 0 or
              str(m.get('preparedTeamEloContract') or '') != expected_elo_contract or
              int(m.get('preparedTeamEloCount') or 0) <= 0 or
              int(m.get('preparedTeamEloLeagueCount') or 0) <= 0 or
              str(m.get('preparedLeagueSimulationContract') or '') != expected_league_simulation_contract or
              int(m.get('preparedLeagueSimulationCount') or 0) <= 0 or
              int(m.get('preparedLeagueSimulationTeamCount') or 0) <= 0 or
              int(m.get('preparedLeagueSimulationRuns') or 0) < 10000
          )
          generate=os.environ.get('FORCE','false').lower()=='true' or not old or changed or contract_migration
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"generate={'true' if generate else 'false'}\n")
              f.write(f"contract_migration={'true' if contract_migration else 'false'}\n")
              f.write(f"statmaker_commit={expected_statmaker_commit}\n")
          PY

      - name: Require private read token
        if: steps.preflight.outputs.generate == 'true'
        env: {TOKEN: "${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}"}
        run: test -n "$TOKEN" || (echo 'Missing STATMAKER_PRIVATE_READ_TOKEN' >&2; exit 1)

      - name: Checkout current StatMaker production source
        if: steps.preflight.outputs.generate == 'true'
        uses: actions/checkout@v4
        with:
          repository: Velliouras/StatMaker
          # Production App-Ready artifacts must be generated from the production StatMaker branch.
          # workflow_dispatch may explicitly override the ref for controlled testing only.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.statmaker_ref || 'main' }}
          token: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
          path: statmaker-private
          fetch-depth: 0
          persist-credentials: false

      - name: Stage off-device legacy builder
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/stage_app_ready_producer.sh" "$GITHUB_WORKSPACE/statmaker-private"

      - uses: actions/setup-java@v4
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        with: {distribution: temurin, java-version: '17'}

      - name: Verify preinstalled Android SDK
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo 'ANDROID_HOME is not set on this runner' >&2; exit 1; }
          test -d "$ANDROID_HOME" || { echo "ANDROID_HOME does not exist: $ANDROID_HOME" >&2; exit 1; }

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" && -x "$ANDROID_HOME/tools/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          test -n "$SDKMANAGER" || {
            echo "sdkmanager was not found under $ANDROID_HOME" >&2
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          }

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Using preinstalled Android SDK: $ANDROID_HOME"
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - uses: gradle/actions/setup-gradle@v4
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))

      - name: Compile off-device builder
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        working-directory: statmaker-private
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Enable KVM acceleration
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm || (echo '/dev/kvm is unavailable on this runner' >&2; exit 1)
          sudo chown "$USER" /dev/kvm
          sudo chmod 600 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Restore exact prepared checkpoint for v10 resume
        if: steps.preflight.outputs.generate == 'true' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149')
        uses: actions/download-artifact@v4
        with:
          name: statmaker-app-ready-prepared-checkpoint
          path: app-ready-checkpoint-incoming
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33283282657

      - name: Locate resumable prepared checkpoint
        id: checkpoint_lookup
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          api = os.environ["API_URL"].rstrip("/")
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "statmaker-app-ready-checkpoint",
          }

          try:
              req = urllib.request.Request(
                  f"{api}/repos/{repo}/actions/artifacts?name=statmaker-app-ready-prepared-checkpoint&per_page=100",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
          except Exception as exc:
              print("APP_READY_CHECKPOINT_LIST_UNAVAILABLE", type(exc).__name__, str(exc))
              raise SystemExit(0)

          artifacts = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == "statmaker-app-ready-prepared-checkpoint"
              and not item.get("expired", False)
          ]
          artifacts.sort(key=lambda item: item.get("created_at", ""), reverse=True)
          if not artifacts:
              print("APP_READY_CHECKPOINT_ARTIFACT_NONE")
              raise SystemExit(0)

          artifact = artifacts[0]
          run_id = str((artifact.get("workflow_run") or {}).get("id") or "")
          if not run_id:
              print("APP_READY_CHECKPOINT_RUN_ID_MISSING", artifact.get("id"))
              raise SystemExit(0)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\n")
              output.write(f"artifact_id={artifact.get('id', '')}\n")

          print(
              "APP_READY_CHECKPOINT_LOCATED",
              f"id={artifact.get('id')}",
              f"run_id={run_id}",
              f"created_at={artifact.get('created_at')}",
          )
          PY

      - name: Restore resumable prepared checkpoint
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149')) && steps.checkpoint_lookup.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: statmaker-app-ready-prepared-checkpoint
          path: app-ready-checkpoint-incoming
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.checkpoint_lookup.outputs.run_id }}

      - name: Materialize v10 candidates host-side from checkpoint
        if: steps.preflight.outputs.generate == 'true' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149')
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app-ready-export
          mkdir -p app-ready-export/source
          python scripts/materialize_app_ready_pattern_candidates.py \
            app-ready-checkpoint-incoming \
            app-ready-export/raw \
            app-ready-export/source
          python scripts/materialize_prepared_fixture_index.py \
            app-ready-export/raw/databases/statmaker_prepared_betting.db

          # The checkpoint was generated by publisher #149 from this exact Data commit.
          # Use its matching enriched index so the stats DB and source manifest validate coherently.
          RECOVERY_SOURCE_COMMIT="851a0c9318f61c070d3695d7dd27f5182b5ad53a"
          git fetch --no-tags origin "$RECOVERY_SOURCE_COMMIT"
          git show "$RECOVERY_SOURCE_COMMIT:data/statmaker/domestic_enriched/index.json" \
            > app-ready-export/source/domestic_enriched_index.json

          python scripts/build_app_ready_from_device.py \
            app-ready-export/raw \
            app-ready-export/out \
            app-ready-export/source

      - name: Produce indexed read models off-device
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_ID: com.statmaker.app.uat.local
          # Producer contract values come from the freshly staged PROD source via GITHUB_ENV.
          APP_READY_RECOMMENDATION_ONLY: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149') && 'true' || 'false' }}
          APP_READY_SOURCE_ONLY: "true"
          # Explicit elapsed-time ceiling. The shell monitor has no hidden iteration timeout.
          APP_READY_PREPARED_MAX_SECONDS: "5400"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 5120M
          heap-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash "$GITHUB_WORKSPACE/scripts/run_app_ready_emulator.sh"

      - name: Save prepared checkpoint for downstream retry
        if: ${{ always() && steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149')) && hashFiles('app-ready-checkpoint/checkpoint.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: statmaker-app-ready-prepared-checkpoint
          path: app-ready-checkpoint
          if-no-files-found: error
          retention-days: 1

      - name: Materialize current v11 candidates host-side
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          rm -rf app-ready-export
          mkdir -p app-ready-export/source
          python scripts/materialize_uat_direction_pattern_candidates.py \
            app-ready-checkpoint \
            app-ready-export/raw \
            app-ready-export/source
          python scripts/materialize_prepared_fixture_index.py \
            app-ready-export/raw/databases/statmaker_prepared_betting.db
          # Match Simulation consumes prepared_team_elo, so Elo must exist first.
          python scripts/materialize_prepared_team_elo.py \
            app-ready-export/raw/databases/statmaker_prepared_betting.db
          python scripts/materialize_prepared_simulations.py \
            app-ready-export/raw/databases/statmaker_prepared_betting.db \
            --runs 10000
          python scripts/materialize_prepared_league_simulations.py \
            app-ready-export/raw/databases/statmaker_prepared_betting.db \
            --runs 10000
          python scripts/materialize_prepared_uefa_simulations.py \
            app-ready-export/raw/databases/statmaker_prepared_betting.db \
            --runs 10000

      - name: Stage canonical repository inputs
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        shell: bash
        run: |
          set -euo pipefail
          s="app-ready-export/source"
          mkdir -p "$s"
          cp data/statmaker/update_manifest.json "$s/main_manifest.json"
          cp data/statmaker/domestic_enriched/index.json "$s/domestic_enriched_index.json"
          cp odds/odds_api_io/domestic_odds.json "$s/domestic.json"
          git show origin/build/uefa-qualifier-feed-20260720:data/statmaker/uefa_update_manifest.json > "$s/uefa_manifest.json"
          git show origin/build/uefa-qualifier-feed-20260720:odds/odds_api_io/champions_league_odds.json > "$s/champions_league.json"
          git show origin/build/uefa-qualifier-feed-20260720:odds/odds_api_io/europa_league_odds.json > "$s/europa_league.json"
          git show origin/build/uefa-qualifier-feed-20260720:odds/odds_api_io/conference_league_odds.json > "$s/conference_league.json"
          test -s "$s/main_manifest.json"
          test -s "$s/domestic_enriched_index.json"
          test -s "$s/uefa_manifest.json"
          test -s "$s/domestic.json"
          test -s "$s/champions_league.json"
          test -s "$s/europa_league.json"
          test -s "$s/conference_league.json"

      - name: Materialize precomputed Score Edge from existing Monte Carlo and staged exact bookmaker odds
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        run: |
          python scripts/materialize_prepared_score_edge.py \
            app-ready-export/raw/databases/statmaker_prepared_betting.db \
            --source-dir app-ready-export/source

      - name: Build immutable bundles
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        run: python scripts/build_app_ready_from_device.py app-ready-export/raw app-ready-export/out app-ready-export/source

      - name: Verify prepared simulation survived immutable bundle
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149'))
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3, tempfile, zipfile
          from pathlib import Path

          out=Path('app-ready-export/out')
          manifest=json.loads((out/'update_manifest.json').read_text(encoding='utf-8'))
          artifact=next(
              item for item in manifest.get('artifacts',[])
              if item.get('id')=='app_ready_betting_bundle'
          )
          bundle=out/Path(str(artifact.get('path') or '')).name
          if not bundle.is_file():
              raise SystemExit(f'Prepared betting bundle missing: {bundle}')

          with tempfile.TemporaryDirectory() as td:
              db=Path(td)/'statmaker_prepared_betting.db'
              with zipfile.ZipFile(bundle) as archive:
                  with archive.open('databases/statmaker_prepared_betting.db') as src:
                      db.write_bytes(src.read())
              con=sqlite3.connect(f'file:{db}?mode=ro',uri=True)
              try:
                  expected_tables={
                      'prepared_simulations',
                      'prepared_match_simulations',
                      'prepared_team_elo',
                      'prepared_team_elo_meta',
                      'prepared_league_simulation_meta',
                      'prepared_league_team_simulations',
                  }
                  tables={
                      row[0] for row in con.execute(
                          "SELECT name FROM sqlite_master WHERE type='table'"
                      )
                      if row[0] in expected_tables
                  }
                  if tables != expected_tables:
                      raise SystemExit(f'Immutable App-Ready bundle is missing simulation/Elo tables: {tables}')
                  rows=int(con.execute('SELECT COUNT(*) FROM prepared_simulations').fetchone()[0])
                  match_rows=int(con.execute('SELECT COUNT(*) FROM prepared_match_simulations').fetchone()[0])
                  runs=int(con.execute('SELECT COALESCE(MAX(simulation_runs),0) FROM prepared_simulations').fetchone()[0])
                  elo_rows=int(con.execute('SELECT COUNT(*) FROM prepared_team_elo').fetchone()[0])
                  elo_meta_rows=int(con.execute('SELECT COUNT(*) FROM prepared_team_elo_meta').fetchone()[0])
                  league_rows=int(con.execute('SELECT COUNT(*) FROM prepared_league_simulation_meta').fetchone()[0])
                  league_team_rows=int(con.execute('SELECT COUNT(*) FROM prepared_league_team_simulations').fetchone()[0])
                  league_runs=int(con.execute('SELECT COALESCE(MAX(simulation_runs),0) FROM prepared_league_simulation_meta').fetchone()[0])
                  if rows<=0 or match_rows<=0 or runs<1000:
                      raise SystemExit(
                          f'Invalid prepared simulation bundle rows={rows} match_rows={match_rows} runs={runs}'
                      )
                  if elo_rows<=0 or elo_meta_rows<=0:
                      raise SystemExit(f'Invalid prepared Elo bundle rows={elo_rows} meta_rows={elo_meta_rows}')
                  if league_rows<=0 or league_team_rows<=0 or league_runs<1000:
                      raise SystemExit(
                          f'Invalid league simulation bundle leagues={league_rows} teams={league_team_rows} runs={league_runs}'
                      )
                  print(
                      'APP_READY_SIMULATION_BUNDLE_OK',
                      f'rows={rows}', f'match_rows={match_rows}', f'runs={runs}',
                      f'elo_rows={elo_rows}', f'league_rows={league_rows}',
                      f'league_team_rows={league_team_rows}', f'league_runs={league_runs}'
                  )
              finally:
                  con.close()
          PY

      - name: Revalidate canonical source versions
        id: source_guard
        if: steps.preflight.outputs.generate == 'true'
        shell: bash
        env:
          HOST_RECOVERY: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main
          git fetch --no-tags --depth=1 origin +build/uefa-qualifier-feed-20260720:refs/remotes/origin/build/uefa-qualifier-feed-20260720
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          incoming=json.loads(Path('app-ready-export/out/update_manifest.json').read_text())
          metadata=incoming.get('metadata',{})
          expected_main=str(metadata.get('mainContentVersion') or '')
          expected_uefa=str(metadata.get('uefaContentVersion') or '')
          current_main=json.loads(subprocess.check_output(
              ['git','show','refs/remotes/origin/main:data/statmaker/update_manifest.json'],
              text=True,
          ))
          current_uefa=json.loads(subprocess.check_output(
              ['git','show','refs/remotes/origin/build/uefa-qualifier-feed-20260720:data/statmaker/uefa_update_manifest.json'],
              text=True,
          ))
          actual_main=str(current_main.get('contentVersion') or '')
          actual_uefa=str(current_uefa.get('contentVersion') or '')
          recovery=os.environ.get('HOST_RECOVERY','false').lower() == 'true'
          source_matches=(expected_main == actual_main and expected_uefa == actual_uefa)
          if recovery:
              print(
                  'APP_READY_RECOVERY_SOURCE_ACCEPTED',
                  f'main={expected_main[:12]} current={actual_main[:12]}',
                  f'uefa={expected_uefa[:12]} current={actual_uefa[:12]}',
              )
          elif not source_matches:
              print(
                  'APP_READY_SOURCE_ADVANCED_PUBLISHING_COMPLETED_GENERATION',
                  f'main={expected_main[:12]}->{actual_main[:12]}',
                  f'uefa={expected_uefa[:12]}->{actual_uefa[:12]}',
              )
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write("current=true\n")
          PY

      - name: Report stale generation skip
        if: steps.preflight.outputs.generate == 'true' && steps.source_guard.outputs.current != 'true'
        run: echo "Canonical source changed while app-ready was building; stale generation was intentionally not published."

      - name: Publish current and previous generations
        if: steps.preflight.outputs.generate == 'true' && steps.source_guard.outputs.current == 'true'
        shell: bash
        env:
          RECOVERY_PUBLISH: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover v10 candidates host-side from checkpoint 149') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def sha256(path):
              h=hashlib.sha256()
              with Path(path).open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
              return h.hexdigest()

          src=Path('app-ready-export/out'); dst=Path('data/statmaker/app_ready'); dst.mkdir(parents=True,exist_ok=True)
          incoming=json.loads((src/'update_manifest.json').read_text())
          artifacts=incoming.get('artifacts',[])
          if incoming.get('schemaVersion') != 1 or len(artifacts) != 2:
              raise SystemExit('Invalid app-ready manifest contract')
          for item in artifacts:
              f=src/Path(item['path']).name
              if not f.is_file(): raise SystemExit(f'Missing built artifact {f.name}')
              if f.stat().st_size != int(item['bytes']): raise SystemExit(f'Artifact size mismatch {f.name}')
              if sha256(f) != item['sha256']: raise SystemExit(f'Artifact SHA256 mismatch {f.name}')

          mp=dst/'update_manifest.json'; old=json.loads(mp.read_text()) if mp.is_file() else None
          names=lambda m:{Path(x['path']).name for x in m.get('artifacts',[])} if m else set()
          current, previous=names(incoming), names(old)
          for n in current: shutil.copy2(src/n,dst/n)
          keep=current|previous|{'update_manifest.json','publish_status.json'}
          for f in dst.glob('app_ready_*_bundle-*.zip'):
              if f.name not in keep: f.unlink()
          shutil.copy2(src/'update_manifest.json',mp)

          status={
              'schemaVersion':1,
              'status':'READY',
              'contentVersion':incoming.get('contentVersion',''),
              'generatedAt':incoming.get('generatedAt',''),
              'verifiedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'artifactCount':len(artifacts),
              'mainContentVersion':incoming.get('metadata',{}).get('mainContentVersion',''),
              'uefaContentVersion':incoming.get('metadata',{}).get('uefaContentVersion',''),
              'statmakerCommit':incoming.get('metadata',{}).get('statmakerCommit',''),
              'preparedBettingSchemaVersion':incoming.get('metadata',{}).get('preparedBettingSchemaVersion',0),
              'preparedPatternRulesFingerprint':incoming.get('metadata',{}).get('preparedPatternRulesFingerprint',''),
              'preparedPatternGenerationId':incoming.get('metadata',{}).get('preparedPatternGenerationId',''),
              'preparedPatternCandidateCount':incoming.get('metadata',{}).get('preparedPatternCandidateCount',0),
              'preparedPatternRecommendationEligibleCount':incoming.get('metadata',{}).get('preparedPatternRecommendationEligibleCount',0),
              'preparedPerformanceRowCount':incoming.get('metadata',{}).get('preparedPerformanceRowCount',0),
              'preparedOpponentAdjustedRequiredCount':incoming.get('metadata',{}).get('preparedOpponentAdjustedRequiredCount',0),
              'preparedOpponentModelCount':incoming.get('metadata',{}).get('preparedOpponentModelCount',0),
              'preparedFavoriteShadowCount':incoming.get('metadata',{}).get('preparedFavoriteShadowCount',0),
              'recoveryPublish':__import__('os').environ.get('RECOVERY_PUBLISH','false').lower() == 'true',
          }
          (dst/'publish_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          if [ -z "$(git status --porcelain -- data/statmaker/app_ready)" ]; then exit 0; fi
          git config user.name "StatMaker Artifact Bot"
          git config user.email "actions@users.noreply.github.com"

          if [[ "${RECOVERY_PUBLISH:-false}" == "true" ]]; then
            # Recovery generation is already fully validated. Never rebase the workflow/code
            # commit chain onto a moving main branch: that replays unrelated canonical producer
            # commits and causes conflicts. Preserve only the generated app_ready directory,
            # reset to the latest canonical main, then commit ONLY those immutable artifacts.
            recovery_dir="$(mktemp -d)"
            cp -a data/statmaker/app_ready "$recovery_dir/app_ready"

            published=false
            for attempt in 1 2 3 4 5; do
              git fetch --no-tags origin +main:refs/remotes/origin/main
              git reset --hard refs/remotes/origin/main
              rm -rf data/statmaker/app_ready
              mkdir -p data/statmaker
              cp -a "$recovery_dir/app_ready" data/statmaker/app_ready
              git add data/statmaker/app_ready

              if git diff --cached --quiet; then
                echo "APP_READY_RECOVERY_ALREADY_PUBLISHED"
                published=true
                break
              fi

              git commit -m "Publish verified app-ready StatMaker read models"
              if git push origin HEAD:main; then
                echo "APP_READY_RECOVERY_PUBLISH_OK attempt=$attempt"
                published=true
                break
              fi
              echo "APP_READY_RECOVERY_PUBLISH_RETRY attempt=$attempt"
            done
            [[ "$published" == "true" ]] || {
              echo "Could not publish recovery app-ready artifacts after 5 retries" >&2
              exit 1
            }
          else
            # Normal generations are already validated. Preserve only the immutable app_ready
            # tree, then replay that tree onto the latest main. Never rebase the long-lived
            # workflow checkout: doing so can replay unrelated producer commits after main moves.
            publish_dir="$(mktemp -d)"
            cp -a data/statmaker/app_ready "$publish_dir/app_ready"

            published=false
            for attempt in 1 2 3 4 5; do
              git fetch --no-tags origin +main:refs/remotes/origin/main
              git fetch --no-tags origin +build/uefa-qualifier-feed-20260720:refs/remotes/origin/build/uefa-qualifier-feed-20260720

              # Publish the fully validated generation even if canonical inputs advanced while it
              # was building. A later queued publisher will catch up to the newer source version.
              python - <<'PY'
          import json, subprocess
          from pathlib import Path
          incoming=json.loads(Path('app-ready-export/out/update_manifest.json').read_text())
          metadata=incoming.get('metadata',{})
          expected_main=str(metadata.get('mainContentVersion') or '')
          expected_uefa=str(metadata.get('uefaContentVersion') or '')
          current_main=json.loads(subprocess.check_output(
              ['git','show','refs/remotes/origin/main:data/statmaker/update_manifest.json'],
              text=True,
          ))
          current_uefa=json.loads(subprocess.check_output(
              ['git','show','refs/remotes/origin/build/uefa-qualifier-feed-20260720:data/statmaker/uefa_update_manifest.json'],
              text=True,
          ))
          actual_main=str(current_main.get('contentVersion') or '')
          actual_uefa=str(current_uefa.get('contentVersion') or '')
          if expected_main != actual_main or expected_uefa != actual_uefa:
              print(
                  'APP_READY_CONCURRENT_SOURCE_ADVANCE_ALLOWED',
                  f'main={expected_main[:12]}->{actual_main[:12]}',
                  f'uefa={expected_uefa[:12]}->{actual_uefa[:12]}',
              )
          PY

              git reset --hard refs/remotes/origin/main
              rm -rf data/statmaker/app_ready
              mkdir -p data/statmaker
              cp -a "$publish_dir/app_ready" data/statmaker/app_ready
              git add data/statmaker/app_ready

              if git diff --cached --quiet; then
                echo "APP_READY_ALREADY_PUBLISHED"
                published=true
                break
              fi

              git commit -m "Publish verified app-ready StatMaker read models"
              if git push origin HEAD:main; then
                echo "APP_READY_PUBLISH_OK attempt=$attempt"
                published=true
                break
              fi

              echo "APP_READY push attempt ${attempt} lost a remote race; retrying immutable artifacts only."
              sleep $((attempt * 2))
            done

            [[ "$published" == "true" ]] || {
              echo "Could not publish app-ready artifacts after 5 retries" >&2
              exit 1
            }
          fi

      - name: Verify published generation
        if: steps.preflight.outputs.generate == 'true' && steps.source_guard.outputs.current == 'true'
        shell: bash
        env:
          EXPECTED_STATMAKER_COMMIT: ${{ steps.preflight.outputs.statmaker_commit }}
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$local_sha" = "$remote_sha"
          python - <<'PY'
          import json, os
          from pathlib import Path
          status=json.loads(Path('data/statmaker/app_ready/publish_status.json').read_text())
          manifest=json.loads(Path('data/statmaker/app_ready/update_manifest.json').read_text())
          artifacts=manifest.get('artifacts',[])
          assert status.get('status') == 'READY'
