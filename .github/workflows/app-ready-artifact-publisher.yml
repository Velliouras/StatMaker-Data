name: StatMaker App-Ready Artifact Publisher

# Current-season Domestic read-model regeneration trigger.
on:
  workflow_dispatch:
    inputs:
      statmaker_ref:
        description: "Private StatMaker ref"
        required: true
        default: "uat-instant-prepared-search-20260828"
        type: string
      force:
        description: "Force generation"
        required: true
        default: false
        type: boolean
  workflow_run:
    # GitHub suppresses ordinary push-triggered workflow recursion for commits made
    # with GITHUB_TOKEN. Chain the heavyweight publisher only from canonical producers
    # whose changes must reach the immutable phone read-model promptly.
    workflows:
      - "Domestic Statistics Universe"
      - "Domestic Targeted Stats Backfill"
      - "Odds Integrity Production Refresh"
      - "Build StatMaker Domestic Enriched"
      - "Greece Super League 2 Sync"
      - "Domestic Archive Betting Rehydrate"
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/app-ready-artifact-publisher.yml'
      - 'data/statmaker/update_manifest.json'
      - 'odds/odds_api_io/domestic_odds.json'
      - 'data/statmaker/uefa_support_history.json'
      - 'data/statmaker/uefa_team_support_history.json'
      - 'data/statmaker/domestic_proposal_readiness.json'
      - 'mappings/domestic_team_aliases.json'
      - 'data/statmaker/domestic_enriched/**'
      - 'data/api_football/domestic_normalized_fixture_stats.json'
      - 'scripts/patch_app_ready_producer.py'
      - 'scripts/app_ready_v10/AppReadyPatternPublisherBridge.kt'
      - 'scripts/patch_prepared_publisher_diagnostics.py'
      - 'scripts/patch_prepared_publisher_bulk.py'
      - 'scripts/run_app_ready_emulator.sh'
      - 'scripts/build_app_ready_from_device.py'
  schedule:
    - cron: "20 2,6,10,14,18,22 * * *"

permissions:
  contents: write
  actions: read
concurrency:
  # Failed/cancelled upstream workflow_run events are no-op runs. Give those runs a
  # unique key so they cannot cancel a valid publisher already building a generation.
  group: statmaker-app-ready-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || 'active' }}
  # A deliberate publisher-code push supersedes older in-flight publisher attempts.
  # Normal schedule/workflow_run triggers never cancel a valid expensive generation.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Validate canonical Domestic provider identity
        run: python scripts/validate_domestic_cache_provider_identity.py

      - name: Check source versions
        id: preflight
        shell: bash
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +build/uefa-qualifier-feed-20260720:refs/remotes/origin/build/uefa-qualifier-feed-20260720
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          main=json.loads(Path('data/statmaker/update_manifest.json').read_text())
          uefa=json.loads(subprocess.check_output(['git','show','origin/build/uefa-qualifier-feed-20260720:data/statmaker/uefa_update_manifest.json'],text=True))
          p=Path('data/statmaker/app_ready/update_manifest.json'); old=json.loads(p.read_text()) if p.is_file() else {}
          m=old.get('metadata',{})
          changed=m.get('mainContentVersion')!=main.get('contentVersion') or m.get('uefaContentVersion')!=uefa.get('contentVersion')
          expected_rules='pattern-policy-v2-final-read-model-v3'
          expected_schema=10
          contract_migration=(
              str(m.get('preparedPatternRulesFingerprint') or '') != expected_rules or
              int(m.get('preparedBettingSchemaVersion') or 0) < expected_schema
          )
          generate=os.environ.get('FORCE','false').lower()=='true' or not old or changed or contract_migration
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"generate={'true' if generate else 'false'}\n")
              f.write(f"contract_migration={'true' if contract_migration else 'false'}\n")
          PY

      - name: Require private read token
        if: steps.preflight.outputs.generate == 'true'
        env: {TOKEN: "${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}"}
        run: test -n "$TOKEN" || (echo 'Missing STATMAKER_PRIVATE_READ_TOKEN' >&2; exit 1)

      - name: Checkout current StatMaker UAT
        if: steps.preflight.outputs.generate == 'true'
        uses: actions/checkout@v4
        with:
          repository: Velliouras/StatMaker
          # Until the v10 Android patch is committed to UAT, scheduled publishers use the
          # validated source-generation branch. workflow_dispatch can still override the ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.statmaker_ref || 'uat-instant-prepared-search-20260828' }}
          token: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
          path: statmaker-private
          fetch-depth: 0
          persist-credentials: false

      - name: Stage off-device legacy builder
        if: steps.preflight.outputs.generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd statmaker-private
          LEGACY_BUILDER_REF="origin/automation/app-ready-v2-bootstrap-20260817"
          LEGACY_BUILDER_PATH="app/src/main/java/com/statmaker/app/WelcomeDataUpdater.kt"
          LEGACY_BUILDER_BLOB="b329ef56878dc991d797b17f64c4f127c71f6e63"

          if ! git rev-parse --verify --quiet "${LEGACY_BUILDER_REF}^{commit}" >/dev/null; then
            echo "Pinned legacy builder ref is unavailable in checkout: ${LEGACY_BUILDER_REF}" >&2
            exit 1
          fi

          ACTUAL_BLOB="$(git rev-parse "${LEGACY_BUILDER_REF}:${LEGACY_BUILDER_PATH}")"
          if [[ "${ACTUAL_BLOB}" != "${LEGACY_BUILDER_BLOB}" ]]; then
            echo "Pinned legacy builder blob mismatch." >&2
            echo "Expected: ${LEGACY_BUILDER_BLOB}" >&2
            echo "Actual:   ${ACTUAL_BLOB}" >&2
            exit 1
          fi

          git show "${LEGACY_BUILDER_REF}:${LEGACY_BUILDER_PATH}" > "${LEGACY_BUILDER_PATH}"
          python "$GITHUB_WORKSPACE/scripts/patch_app_ready_producer.py"
          python "$GITHUB_WORKSPACE/scripts/patch_prepared_publisher_diagnostics.py"

      - uses: actions/setup-java@v4
        if: steps.preflight.outputs.generate == 'true'
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        if: steps.preflight.outputs.generate == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.preflight.outputs.generate == 'true'

      - name: Compile off-device builder
        if: steps.preflight.outputs.generate == 'true'
        working-directory: statmaker-private
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Enable KVM acceleration
        if: steps.preflight.outputs.generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm || (echo '/dev/kvm is unavailable on this runner' >&2; exit 1)
          sudo chown "$USER" /dev/kvm
          sudo chmod 600 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Restore exact prepared checkpoint for v10 resume
        if: steps.preflight.outputs.generate == 'true' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Resume v10 recommendations from checkpoint')
        uses: actions/download-artifact@v4
        with:
          name: statmaker-app-ready-prepared-checkpoint
          path: app-ready-checkpoint-incoming
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33272027960

      - name: Restore resumable prepared checkpoint
        if: steps.preflight.outputs.generate == 'true' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Resume v10 recommendations from checkpoint'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          rm -rf app-ready-checkpoint-incoming
          mkdir -p app-ready-checkpoint-incoming
          python - <<'PY'
          import io, json, os, time, urllib.error, urllib.request, zipfile
          from pathlib import Path

          api = os.environ["API_URL"].rstrip("/")
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "statmaker-app-ready-checkpoint",
          }

          try:
              req = urllib.request.Request(
                  f"{api}/repos/{repo}/actions/artifacts?per_page=100",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
          except Exception as exc:
              print("APP_READY_CHECKPOINT_LIST_UNAVAILABLE", type(exc).__name__, str(exc))
              raise SystemExit(0)

          artifacts = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == "statmaker-app-ready-prepared-checkpoint"
              and not item.get("expired", False)
          ]
          artifacts.sort(key=lambda item: item.get("created_at", ""), reverse=True)
          if not artifacts:
              print("APP_READY_CHECKPOINT_ARTIFACT_NONE")
              raise SystemExit(0)

          artifact = artifacts[0]
          raw = None
          for attempt in range(1, 6):
              try:
                  req = urllib.request.Request(artifact["archive_download_url"], headers=headers)
                  with urllib.request.urlopen(req, timeout=180) as response:
                      raw = response.read()
                  break
              except Exception as exc:
                  print(
                      "APP_READY_CHECKPOINT_DOWNLOAD_RETRY",
                      f"attempt={attempt}",
                      type(exc).__name__,
                      str(exc),
                  )
                  if attempt < 5:
                      time.sleep(10 * attempt)

          if not raw:
              print("APP_READY_CHECKPOINT_DOWNLOAD_UNAVAILABLE continuing_without_checkpoint")
              raise SystemExit(0)

          try:
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  archive.extractall("app-ready-checkpoint-incoming")
          except Exception as exc:
              print("APP_READY_CHECKPOINT_ARCHIVE_INVALID", type(exc).__name__, str(exc))
              raise SystemExit(0)

          checkpoint = Path("app-ready-checkpoint-incoming/checkpoint.json")
          if not checkpoint.is_file():
              print("APP_READY_CHECKPOINT_JSON_MISSING continuing_without_checkpoint")
              raise SystemExit(0)

          print(
              "APP_READY_CHECKPOINT_ARTIFACT_RESTORED",
              f"id={artifact.get('id')}",
              f"created_at={artifact.get('created_at')}",
          )
          PY

      - name: Produce indexed read models off-device
        if: steps.preflight.outputs.generate == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_ID: com.statmaker.app.uat.local
          APP_READY_RECOMMENDATION_ONLY: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Resume v10 recommendations from checkpoint') && 'true' || 'false' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 5120M
          heap-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash "$GITHUB_WORKSPACE/scripts/run_app_ready_emulator.sh"

      - name: Persist resumable prepared checkpoint
        if: always() && steps.preflight.outputs.generate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: statmaker-app-ready-prepared-checkpoint
          path: app-ready-checkpoint
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6
          overwrite: true

      - name: Stage canonical repository inputs
        if: steps.preflight.outputs.generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          s="app-ready-export/source"
          mkdir -p "$s"
          cp data/statmaker/update_manifest.json "$s/main_manifest.json"
          cp data/statmaker/domestic_enriched/index.json "$s/domestic_enriched_index.json"
          cp odds/odds_api_io/domestic_odds.json "$s/domestic.json"
          git show origin/build/uefa-qualifier-feed-20260720:data/statmaker/uefa_update_manifest.json > "$s/uefa_manifest.json"
          git show origin/build/uefa-qualifier-feed-20260720:odds/odds_api_io/champions_league_odds.json > "$s/champions_league.json"
          git show origin/build/uefa-qualifier-feed-20260720:odds/odds_api_io/europa_league_odds.json > "$s/europa_league.json"
          git show origin/build/uefa-qualifier-feed-20260720:odds/odds_api_io/conference_league_odds.json > "$s/conference_league.json"
          test -s "$s/main_manifest.json"
          test -s "$s/domestic_enriched_index.json"
          test -s "$s/uefa_manifest.json"
          test -s "$s/domestic.json"
          test -s "$s/champions_league.json"
          test -s "$s/europa_league.json"
          test -s "$s/conference_league.json"

      - name: Build immutable bundles
        if: steps.preflight.outputs.generate == 'true'
        run: python scripts/build_app_ready_from_device.py app-ready-export/raw app-ready-export/out app-ready-export/source

      - name: Revalidate canonical source versions
        id: source_guard
        if: steps.preflight.outputs.generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main
          git fetch --no-tags --depth=1 origin +build/uefa-qualifier-feed-20260720:refs/remotes/origin/build/uefa-qualifier-feed-20260720
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          incoming=json.loads(Path('app-ready-export/out/update_manifest.json').read_text())
          metadata=incoming.get('metadata',{})
          expected_main=str(metadata.get('mainContentVersion') or '')
          expected_uefa=str(metadata.get('uefaContentVersion') or '')
          current_main=json.loads(subprocess.check_output(
              ['git','show','refs/remotes/origin/main:data/statmaker/update_manifest.json'],
              text=True,
          ))
          current_uefa=json.loads(subprocess.check_output(
              ['git','show','refs/remotes/origin/build/uefa-qualifier-feed-20260720:data/statmaker/uefa_update_manifest.json'],
              text=True,
          ))
          actual_main=str(current_main.get('contentVersion') or '')
          actual_uefa=str(current_uefa.get('contentVersion') or '')
          current=expected_main == actual_main and expected_uefa == actual_uefa
          if not current:
              print(
                  'APP_READY_STALE_SOURCE_SKIP',
                  f'main={expected_main[:12]}->{actual_main[:12]}',
                  f'uefa={expected_uefa[:12]}->{actual_uefa[:12]}',
              )
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"current={'true' if current else 'false'}\n")
          PY

      - name: Report stale generation skip
        if: steps.preflight.outputs.generate == 'true' && steps.source_guard.outputs.current != 'true'
        run: echo "Canonical source changed while app-ready was building; stale generation was intentionally not published."

      - name: Publish current and previous generations
        if: steps.preflight.outputs.generate == 'true' && steps.source_guard.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def sha256(path):
              h=hashlib.sha256()
              with Path(path).open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
              return h.hexdigest()

          src=Path('app-ready-export/out'); dst=Path('data/statmaker/app_ready'); dst.mkdir(parents=True,exist_ok=True)
          incoming=json.loads((src/'update_manifest.json').read_text())
          artifacts=incoming.get('artifacts',[])
          if incoming.get('schemaVersion') != 1 or len(artifacts) != 2:
              raise SystemExit('Invalid app-ready manifest contract')
          for item in artifacts:
              f=src/Path(item['path']).name
              if not f.is_file(): raise SystemExit(f'Missing built artifact {f.name}')
              if f.stat().st_size != int(item['bytes']): raise SystemExit(f'Artifact size mismatch {f.name}')
              if sha256(f) != item['sha256']: raise SystemExit(f'Artifact SHA256 mismatch {f.name}')

          mp=dst/'update_manifest.json'; old=json.loads(mp.read_text()) if mp.is_file() else None
          names=lambda m:{Path(x['path']).name for x in m.get('artifacts',[])} if m else set()
          current, previous=names(incoming), names(old)
          for n in current: shutil.copy2(src/n,dst/n)
          keep=current|previous|{'update_manifest.json','publish_status.json'}
          for f in dst.glob('app_ready_*_bundle-*.zip'):
              if f.name not in keep: f.unlink()
          shutil.copy2(src/'update_manifest.json',mp)

          status={
              'schemaVersion':1,
              'status':'READY',
              'contentVersion':incoming.get('contentVersion',''),
              'generatedAt':incoming.get('generatedAt',''),
              'verifiedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'artifactCount':len(artifacts),
              'mainContentVersion':incoming.get('metadata',{}).get('mainContentVersion',''),
              'uefaContentVersion':incoming.get('metadata',{}).get('uefaContentVersion',''),
              'statmakerCommit':subprocess.check_output(['git','-C','statmaker-private','rev-parse','HEAD'],text=True).strip(),
              'preparedBettingSchemaVersion':incoming.get('metadata',{}).get('preparedBettingSchemaVersion',0),
              'preparedPatternRulesFingerprint':incoming.get('metadata',{}).get('preparedPatternRulesFingerprint',''),
              'preparedPatternGenerationId':incoming.get('metadata',{}).get('preparedPatternGenerationId',''),
              'preparedPatternCandidateCount':incoming.get('metadata',{}).get('preparedPatternCandidateCount',0),
          }
          (dst/'publish_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          if [ -z "$(git status --porcelain -- data/statmaker/app_ready)" ]; then exit 0; fi
          git config user.name "StatMaker Artifact Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/statmaker/app_ready
          git commit -m "Publish verified app-ready StatMaker read models"

          # Never rebase a bundle built from source version A onto a newer canonical
          # source version B. Rebase is allowed only when the canonical manifests
          # still match the versions embedded in the generated app-ready manifest.
          git fetch --no-tags origin +main:refs/remotes/origin/main
          git fetch --no-tags origin +build/uefa-qualifier-feed-20260720:refs/remotes/origin/build/uefa-qualifier-feed-20260720
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          incoming=json.loads(Path('app-ready-export/out/update_manifest.json').read_text())
          metadata=incoming.get('metadata',{})
          expected_main=str(metadata.get('mainContentVersion') or '')
          expected_uefa=str(metadata.get('uefaContentVersion') or '')
          current_main=json.loads(subprocess.check_output(
              ['git','show','refs/remotes/origin/main:data/statmaker/update_manifest.json'],
              text=True,
          ))
          current_uefa=json.loads(subprocess.check_output(
              ['git','show','refs/remotes/origin/build/uefa-qualifier-feed-20260720:data/statmaker/uefa_update_manifest.json'],
              text=True,
          ))
          actual_main=str(current_main.get('contentVersion') or '')
          actual_uefa=str(current_uefa.get('contentVersion') or '')
          if expected_main != actual_main or expected_uefa != actual_uefa:
              raise SystemExit(
                  'Refusing stale app-ready publish after concurrent canonical update: '
                  f'main={expected_main[:12]}->{actual_main[:12]} '
                  f'uefa={expected_uefa[:12]}->{actual_uefa[:12]}'
              )
          PY
          git rebase refs/remotes/origin/main
          git push origin HEAD:main

      - name: Verify published generation
        if: steps.preflight.outputs.generate == 'true' && steps.source_guard.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$local_sha" = "$remote_sha"
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('data/statmaker/app_ready/publish_status.json').read_text())
          manifest=json.loads(Path('data/statmaker/app_ready/update_manifest.json').read_text())
          artifacts=manifest.get('artifacts',[])
          assert status.get('status') == 'READY'
          assert status.get('contentVersion') == manifest.get('contentVersion')
          assert status.get('artifactCount') == len(artifacts) == 2
          assert {item.get('id') for item in artifacts} == {'app_ready_stats_bundle','app_ready_betting_bundle'}
          metadata=manifest.get('metadata',{})
          assert metadata.get('domesticHistoryFingerprint') not in {'', '0|0|0'}
          assert int(metadata.get('preparedBettingSchemaVersion') or 0) >= 10
          assert metadata.get('preparedPatternRulesFingerprint') == 'pattern-policy-v2-final-read-model-v3'
          assert str(metadata.get('preparedPatternGenerationId') or '').strip()
          assert int(metadata.get('preparedPatternCandidateCount') or 0) > 0
          assert status.get('preparedPatternGenerationId') == metadata.get('preparedPatternGenerationId')
          print(
              'APP_READY_PUBLISH_OK',
              status['contentVersion'],
              status['generatedAt'],
              'generation='+metadata['preparedPatternGenerationId'],
              'candidates='+str(metadata['preparedPatternCandidateCount']),
          )
          PY
