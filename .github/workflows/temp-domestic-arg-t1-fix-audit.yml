name: Temporary ARG T1 Fix Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-domestic-arg-t1-fix-audit.yml"

permissions:
  contents: write

concurrency:
  group: domestic-arg-t1-fix-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture exact provider ARG and T1 mapping
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          import os
          from pathlib import Path
          import update_domestic_odds_api_io as odds
          import audit_domestic_mapping as audit

          root = Path('.')
          config = json.loads((root / 'config/domestic_leagues.json').read_text(encoding='utf-8-sig'))
          live = json.loads((root / 'data/statmaker/domestic_live_july_registry.json').read_text(encoding='utf-8-sig'))
          configured = [x for x in config.get('leagues', []) if bool(x.get('enabled', True))]
          by_code = {str(x.get('leagueCode') or ''): x for x in configured}
          live_codes = {str(x.get('leagueCode') or '') for x in live.get('leagues', [])}

          debug = {'warnings': [], 'apiCalls': []}
          providers = odds.discover_provider_leagues(os.environ['ODDS_API_IO_KEY'], debug)
          aliases = audit.generated_aliases(config)
          canonicals = audit.canonical_teams(config)

          targeted = []
          for code in ('ARG', 'T1'):
              row = by_code[code]
              candidates = audit.provider_candidates(row, providers)
              chosen = candidates[0] if candidates else None
              result = {
                  'leagueCode': code,
                  'country': row.get('country'),
                  'competition': row.get('competition'),
                  'inLiveRegistry': code in live_codes,
                  'configuredSlug': row.get('providerLeagueSlug'),
                  'bestCandidate': chosen,
                  'events': [],
                  'teamMappings': [],
              }
              if chosen and chosen.get('slug'):
                  events = odds.fetch_events_for_league(
                      os.environ['ODDS_API_IO_KEY'],
                      str(chosen['slug']),
                      7,
                      debug,
                  )
                  result['events'] = [
                      {
                          'id': odds.event_id(e),
                          'home': odds.event_home(e),
                          'away': odds.event_away(e),
                          'kickoff': odds.event_kickoff(e),
                      }
                      for e in events
                  ]
                  for team in audit.event_teams(events):
                      canonical, status, suggestions = audit.map_team(team, code, aliases, canonicals)
                      result['teamMappings'].append({
                          'providerTeam': team,
                          'canonicalTeam': canonical,
                          'status': status,
                          'suggestions': suggestions,
                      })
              targeted.append(result)

          payload = {
              'providerLeagueCount': len(providers),
              'configuredLeagueCount': len(configured),
              'liveRegistryLeagueCount': len(live_codes),
              'targeted': targeted,
              'rateLimitRemaining': debug.get('rateLimitRemaining'),
              'apiCallCount': len(debug.get('apiCalls', [])),
              'warnings': debug.get('warnings', []),
          }
          out = root / 'reports' / 'temp_domestic_arg_t1_fix_audit.json'
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/temp_domestic_arg_t1_fix_audit.json
          git commit -m "Capture ARG and T1 provider fix audit"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
