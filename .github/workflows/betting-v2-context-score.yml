name: Betting V2 Contextual Model Scores
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: betting-v2-forward-context
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Score existing published forecasts against cached outcomes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy scipy scikit-learn
          folder="reports/betting_v2/forward_context_20261018"
          python -u scripts/betting_v2/forward_context.py --output "$folder" --score-only
          git diff --exit-code -- "$folder/candidate.json" "$folder/PROTOCOL.md" "$folder/index.json" "$folder/publication_evidence.json" "$folder/*.json.gz"
      # Persistent Actions artifact uploads are disabled by repository policy.
      - name: Publish score reports without replacing frozen evidence
        shell: bash
        run: |
          set -euo pipefail
          folder="reports/betting_v2/forward_context_20261018"
          saved="$(mktemp -d)"
          for pattern in '*_score.json' summary.json RESULTS_GR.md status.json; do
            for file in "$folder"/$pattern; do
              if [ -f "$file" ]; then cp "$file" "$saved/"; fi
            done
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            mkdir -p "$folder"
            for file in "$saved"/*; do
              [ -f "$file" ] || continue
              cp "$file" "$folder/"
              git add -- "$folder/$(basename "$file")"
            done
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Score frozen contextual forecasts from cached outcomes [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
