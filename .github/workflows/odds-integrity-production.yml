name: Odds Integrity Production Refresh

on:
  workflow_dispatch:
    inputs:
      cycle_size:
        description: "Number of Domestic leagues to refresh in this cycle"
        required: true
        default: "16"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/domestic-odds-refresh-request"
  schedule:
    # Every 4 hours. Greece: 04:17, 08:17, 12:17, 16:17, 20:17, 00:17 during EEST;
    # 03:17, 07:17, 11:17, 15:17, 19:17, 23:17 during EET. Cron itself is always UTC.
    - cron: "17 1,5,9,13,17,21 * * *"

permissions:
  contents: write

# All workflows that can rewrite domestic_odds.json share this non-cancelling lock.
# This prevents an odds refresh from racing the context/lineup/squad writers.
concurrency:
  # Serialize every workflow that writes canonical StatMaker main data.
  # One running writer at a time prevents manifest/data rebase collisions.
  group: statmaker-canonical-main-writer
  cancel-in-progress: false

jobs:
  validate-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run odds integrity regressions
        run: |
          python -m py_compile \
            scripts/statmaker_domestic_scope.py \
            scripts/odds_market_integrity.py \
            scripts/refresh_domestic_odds_integrity.py \
            scripts/refresh_domestic_odds_schedule_priority.py \
            scripts/domestic_odds_expansion.py \
            scripts/enrich_domestic_odds_team_logos.py \
            scripts/update_uefa_qualifier_odds_integrity.py \
            scripts/annotate_domestic_odds_movement.py \
            scripts/build_domestic_proposal_readiness.py \
            scripts/build_statmaker_update_manifest.py \
            scripts/enrich_domestic_match_context.py \
            scripts/reattach_domestic_match_context.py \
            scripts/refresh_domestic_lineups.py \
            scripts/refresh_domestic_squads.py
          python -m unittest \
            tests/test_statmaker_domestic_scope.py \
            tests/test_odds_market_integrity.py \
            tests/test_refresh_domestic_odds_integrity.py \
            tests/test_domestic_schedule_only_validation.py \
            tests/test_domestic_proposal_readiness.py \
            tests/test_statmaker_update_manifest.py

      - name: Validate current Domestic feed without writing
        run: python scripts/odds_market_integrity.py odds/odds_api_io/domestic_odds.json

      - name: Snapshot current Domestic odds
        run: cp odds/odds_api_io/domestic_odds.json "$RUNNER_TEMP/domestic_odds_before.json"

      - name: Refresh imminent schedule and rotating Domestic exact odds
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDS_API_IO_BOOKMAKERS: ${{ vars.ODDS_API_IO_BOOKMAKERS || 'Bet365,Unibet' }}
          ODDS_API_IO_DOMESTIC_RATE_LIMIT_RESERVE: "45"
          ODDS_API_IO_RATE_LIMIT_WAIT_MAX_SECONDS: "420"
          ODDS_API_IO_RATE_LIMIT_WAIT_BUFFER_SECONDS: "2"
          STATMAKER_DOMESTIC_SCHEDULE_HORIZON_DAYS: "3"
          STATMAKER_DOMESTIC_EXACT_ODDS_HORIZON_DAYS: "7"
          INPUT_CYCLE_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.cycle_size || '16' }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            cycle_size="1"
          else
            cycle_size="${INPUT_CYCLE_SIZE:-16}"
          fi
          python scripts/refresh_domestic_odds_schedule_priority.py --cycle-size "$cycle_size"

      - name: Preserve unexpired Domestic matches omitted by rotation
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          before_path = Path(os.environ["RUNNER_TEMP"]) / "domestic_odds_before.json"
          feed_path = Path("odds/odds_api_io/domestic_odds.json")
          before = json.loads(before_path.read_text(encoding="utf-8"))
          feed = json.loads(feed_path.read_text(encoding="utf-8"))
          today = dt.datetime.now(dt.timezone.utc).date().isoformat()

          def match_key(match):
              match_id = str(match.get("id") or match.get("matchId") or "").strip()
              if match_id:
                  return ("id", match_id)
              return (
                  "fixture",
                  str(match.get("canonicalHomeTeam") or match.get("homeTeam") or "").strip().casefold(),
                  str(match.get("canonicalAwayTeam") or match.get("awayTeam") or "").strip().casefold(),
                  str(match.get("date") or match.get("kickoff") or "")[:10],
              )

          old_by_code = {
              str(league.get("leagueCode") or ""): league
              for league in before.get("leagues", []) or []
          }
          fresh_by_code = {
              str(league.get("leagueCode") or ""): league
              for league in feed.get("leagues", []) or []
          }
          restored = 0
          for code, old_league in old_by_code.items():
              new_league = fresh_by_code.get(code)
              if new_league is None:
                  feed.setdefault("leagues", []).append(old_league)
                  restored += len(old_league.get("matches", []) or [])
                  continue
              fresh_matches = list(new_league.get("matches", []) or [])
              seen = {match_key(match) for match in fresh_matches}
              for old_match in old_league.get("matches", []) or []:
                  date = str(old_match.get("date") or old_match.get("kickoff") or "")[:10]
                  if date and date < today:
                      continue
                  key = match_key(old_match)
                  if key not in seen:
                      fresh_matches.append(old_match)
                      seen.add(key)
                      restored += 1
              new_league["matches"] = fresh_matches

          feed.setdefault("debug", {})["unexpiredMatchesRestoredAfterRotatingRefresh"] = restored
          feed_path.write_text(json.dumps(feed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Preserved {restored} unexpired Domestic matches.")
          PY

      - name: Enrich Domestic team logos
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/enrich_domestic_odds_team_logos.py

      - name: Sanitize Domestic betting feed
        run: |
          python scripts/odds_market_integrity.py \
            odds/odds_api_io/domestic_odds.json \
            --write \
            --report-dir reports

      - name: Annotate Domestic odds movement
        run: |
          python scripts/annotate_domestic_odds_movement.py \
            "$RUNNER_TEMP/domestic_odds_before.json" \
            odds/odds_api_io/domestic_odds.json

      - name: Restore cached Domestic match context
        # Zero provider calls. A rotating odds rebuild may replace match objects, so restore
        # cached injuries/availability, confirmed formations and current-squad continuity.
        run: |
          python scripts/reattach_domestic_match_context.py
          python scripts/refresh_domestic_lineups.py --attach-only
          python scripts/refresh_domestic_squads.py --attach-only

      - name: Build market-specific Domestic proposal readiness
        run: python scripts/build_domestic_proposal_readiness.py

      - name: Build Domestic update manifest
        run: |
          python scripts/build_statmaker_update_manifest.py \
            --profile main \
            --branch main \
            --output data/statmaker/update_manifest.json

      - name: Commit Domestic feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            odds/odds_api_io/domestic_odds.json \
            odds/odds_api_io/domestic_provider_markets.json \
            data/statmaker/domestic_live_july_state.json \
            data/statmaker/domestic_proposal_readiness.json \
            data/statmaker/domestic_match_context_cache.json \
            data/statmaker/update_manifest.json \
            reports/domestic_odds_debug.json \
            reports/domestic_live_july_odds_refresh.json \
            reports/domestic_corner_archive_rebuild.json \
            reports/domestic_expanded_market_rebuild.json \
            reports/domestic_team_logo_enrichment.json \
            reports/domestic_odds_integrity.json \
            reports/domestic_proposal_readiness.json \
            reports/domestic_lineup_watch.json \
            reports/domestic_squad_context.json
          if git diff --cached --quiet; then
            echo "No Domestic odds/readiness changes."
          else
            git commit -m "Sanitize Domestic exact odds and proposal readiness"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Save shared scripts before UEFA checkout
        run: |
          cp scripts/odds_market_integrity.py "$RUNNER_TEMP/odds_market_integrity.py"
          cp scripts/build_statmaker_update_manifest.py "$RUNNER_TEMP/build_statmaker_update_manifest.py"

      - name: Switch to live UEFA feed branch
        run: |
          git fetch origin build/uefa-qualifier-feed-20260720
          git checkout -B build/uefa-qualifier-feed-20260720 origin/build/uefa-qualifier-feed-20260720

      - name: Refresh CL EL and Conference exact odds
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDS_API_IO_BOOKMAKERS: ${{ vars.ODDS_API_IO_BOOKMAKERS || 'Bet365,Unibet' }}
        run: |
          PYTHONPATH="$RUNNER_TEMP:scripts" python - <<'PY'
          import update_uefa_qualifier_odds_build as target
          from odds_market_integrity import install_parser_guard

          install_parser_guard(target.base.odds)
          raise SystemExit(target.main())
          PY

      - name: Sanitize UEFA betting feeds
        run: |
          python "$RUNNER_TEMP/odds_market_integrity.py" \
            odds/odds_api_io/champions_league_odds.json \
            odds/odds_api_io/europa_league_odds.json \
            odds/odds_api_io/conference_league_odds.json \
            --write \
            --report-dir reports

      - name: Build UEFA update manifest
        run: |
          python "$RUNNER_TEMP/build_statmaker_update_manifest.py" \
            --profile uefa \
            --branch build/uefa-qualifier-feed-20260720 \
            --output data/statmaker/uefa_update_manifest.json

      - name: Commit UEFA feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            odds/odds_api_io/champions_league_odds.json \
            odds/odds_api_io/europa_league_odds.json \
            odds/odds_api_io/conference_league_odds.json \
            data/statmaker/uefa_update_manifest.json \
            reports/champions_league_odds_debug.json \
            reports/europa_league_odds_debug.json \
            reports/conference_league_odds_debug.json \
            reports/uefa_qualifier_build_refresh.json \
            reports/champions_league_odds_integrity.json \
            reports/europa_league_odds_integrity.json \
            reports/conference_league_odds_integrity.json
          if git diff --cached --quiet; then
            echo "No UEFA odds changes."
          else
            git commit -m "Sanitize UEFA exact odds integrity"
            git push origin HEAD:build/uefa-qualifier-feed-20260720
          fi