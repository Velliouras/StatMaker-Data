name: Betting V2 Expanded Count Calibration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/triggers/betting-v2-expanded-calibration-20261019']
permissions:
  contents: write
concurrency:
  group: betting-v2-expanded-calibration
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify chronological calibrator invariants
        run: |
          python -m pip install --quiet numpy scipy scikit-learn
          python -m unittest discover -s tests -p test_probability_recalibration.py -v
          python -m unittest discover -s tests -p test_expanded_calibration.py -v
      - name: Evaluate prior-only calibration on all recovered count forecasts
        run: python -u scripts/betting_v2/research_expanded_calibration.py --output reports/betting_v2/expanded_calibration_20261019
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expanded-calibration
          path: reports/betting_v2/expanded_calibration_20261019/
          retention-days: 30
      - name: Save research evidence and resumable checkpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          folder="reports/betting_v2/expanded_calibration_20261019"
          saved="$(mktemp -d)"
          if [ ! -d "$folder" ]; then exit 0; fi
          cp -a "$folder/." "$saved/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            mkdir -p "$folder"
            cp -a "$saved/." "$folder/"
            git add -- "$folder"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Save expanded prior-only calibration and exact-price comparisons [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
