name: Update Domestic Odds-API.io Odds

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run scope: league, group, or all"
        required: true
        default: "all"
        type: choice
        options:
          - league
          - group
          - all
      target:
        description: "League code such as NOR, group such as scandinavia, or all_initial"
        required: false
        default: "all_initial"
        type: string
      dry_run:
        description: "Run without API calls and write structural JSON/report"
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - "scripts/update_domestic_odds_api_io.py"
      - "scripts/update_domestic_odds_api_io_push_aware.py"
      - "scripts/rebuild_domestic_btts_from_archive.py"
      - "scripts/audit_domestic_btts_rebuild.py"
      - "scripts/rebuild_domestic_corners_from_archive.py"
      - ".github/workflows/update-domestic-odds-api-io.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/update_domestic_odds_api_io.py"
      - "scripts/update_domestic_odds_api_io_push_aware.py"
      - "scripts/rebuild_domestic_btts_from_archive.py"
      - "scripts/audit_domestic_btts_rebuild.py"
      - "scripts/rebuild_domestic_corners_from_archive.py"
      - ".github/workflows/update-domestic-odds-api-io.yml"

permissions:
  contents: write

concurrency:
  group: update-domestic-odds-api-io-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-domestic-odds-api-io:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Nordic extra leagues
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          extra = json.loads((root / 'config/nordic_extra_leagues.json').read_text(encoding='utf-8'))['leagues']
          path = root / 'config/domestic_leagues.json'
          cfg = json.loads(path.read_text(encoding='utf-8-sig'))
          leagues = cfg.setdefault('leagues', [])
          groups = cfg.setdefault('groups', {})
          by_code = {str(x.get('leagueCode', '')).upper(): i for i, x in enumerate(leagues)}
          changed = False
          for item in extra:
              code = item['leagueCode']
              entry = {
                  'leagueCode': code,
                  'continent': 'Europe',
                  'country': item['country'],
                  'competition': item['competition'],
                  'season': item.get('season', '2026'),
                  'group': 'scandinavia',
                  'apiFootballLeagueId': item['apiFootballLeagueId'],
                  'enabled': True,
                  'enabledForStats': True,
                  'enabledForOdds': True,
                  'enabledForBetting': True,
                  'providerLeagueSlug': None,
                  'searchTerms': item.get('searchTerms', [f"{item['country']} {item['competition']}", item['competition']]),
              }
              if code in by_code:
                  old = leagues[by_code[code]]
                  merged = {**old, **entry}
                  if merged != old:
                      leagues[by_code[code]] = merged
                      changed = True
              else:
                  leagues.append(entry)
                  changed = True
              for group_name in ['scandinavia', 'all_blue_yellow', 'all_initial']:
                  values = groups.setdefault(group_name, [])
                  if code not in values:
                      values.append(code)
                      changed = True
          if changed:
              cfg['version'] = max(int(cfg.get('version', 3)), 4)
              path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Nordic extra domestic leagues applied: {changed}')
          PY

      - name: Verify corner-line policy and fetch Domestic odds
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDS_API_IO_BOOKMAKERS: ${{ vars.ODDS_API_IO_BOOKMAKERS || 'Bet365,Unibet' }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'all' }}
          RUN_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all_initial' }}
          RUN_DRY: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          args=(--mode "$RUN_MODE" --target "$RUN_TARGET")
          if [ "$RUN_DRY" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/update_domestic_odds_api_io_push_aware.py "${args[@]}"

      - name: Protect last usable Domestic odds artifact
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path('odds/odds_api_io/domestic_odds.json')
          current = json.loads(path.read_text(encoding='utf-8'))
          previous = json.loads(
              subprocess.check_output(
                  ['git', 'show', f'HEAD:{path.as_posix()}'],
                  text=True,
                  encoding='utf-8',
              )
          )

          def usable_match_count(payload):
              return sum(
                  1
                  for league in payload.get('leagues', []) or []
                  for match in league.get('matches', []) or []
                  if match.get('usableForStats') and match.get('markets')
              )

          warnings = current.get('debug', {}).get('warnings', []) or []
          stopped_by_guard = any(
              'rateLimitRemaining is below guard' in str(warning)
              for warning in warnings
          )
          current_count = usable_match_count(current)
          previous_count = usable_match_count(previous)

          if stopped_by_guard and current_count < previous_count:
              subprocess.run(
                  ['git', 'checkout', 'HEAD', '--', path.as_posix()],
                  check=True,
              )
              print(
                  'Restored previous Domestic odds artifact because the rate-limit '
                  f'guard reduced usable matches from {previous_count} to {current_count}.'
              )
          else:
              print(
                  'Domestic odds artifact accepted: '
                  f'usable matches {previous_count} -> {current_count}; '
                  f'rate-limit guard={stopped_by_guard}.'
              )
          PY

      - name: Rebuild full-time BTTS from exact provider archive
        run: python scripts/rebuild_domestic_btts_from_archive.py

      - name: Audit rebuilt full-time BTTS
        run: python scripts/audit_domestic_btts_rebuild.py

      - name: Rebuild exact corners from provider archive
        run: python scripts/rebuild_domestic_corners_from_archive.py

      - name: Commit updated domestic odds JSON
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            odds/odds_api_io/domestic_odds.json \
            reports/domestic_odds_debug.json \
            reports/domestic_btts_archive_rebuild.json \
            reports/domestic_corner_archive_rebuild.json
          if git diff --cached --quiet; then
            echo "No domestic odds changes to commit."
          else
            git commit -m "Update Domestic Odds-API.io odds"
            git push
          fi
