name: "Betting V2 - offline QA (zero provider quota)"

# Manual dispatch or one single, dedicated push-marker. No recurring schedule.
on:
  workflow_dispatch:
  # One-shot push trigger, limited to a dedicated request marker on Data/main.
  # Ordinary code/data changes and Android commits do NOT trigger QA.
  push:
    branches: [main]
    paths:
      - 'reports/betting_v2/run_offline_qa_2026-10-10.txt'

permissions:
  contents: read
  # Write only commit CI status, never push files or release artifacts.
  statuses: write

concurrency:
  group: betting-v2-offline-qa-manual
  cancel-in-progress: false

jobs:
  pilot:
    name: "Unit tests and independent xG/ELO holdouts"
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      # No API credentials are passed to the offline scripts.
      # No betting publisher, API-Football / odds fetcher or Android build.
    steps:
      - name: Checkout Data/main (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish pending offline QA status
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="betting-v2/offline-qa" \
            -f description="Offline V2 tests and dual-model pilot running; no live picks" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Betting V2 standard-library regression tests
        id: tests
        run: python -m unittest discover -s tests -p 'test_betting_v2*.py' -v
      - name: Execute full OFFLINE Betting V2 Python pilot
        id: offline
        # Diagnostic phase is independent: a failing unit test cannot hide pilot errors.
        # Keep the overall workflow FAILED when any step fails.
        if: ${{ always() && !cancelled() }}
        run: python scripts/betting_v2/run_pilot.py --repository-root .
      - name: Inspect cached bookmaker odds provenance OFFLINE
        id: cached_odds
        if: ${{ always() && steps.offline.outcome == 'success' }}
        run: python scripts/betting_v2/audit_cached_odds_provenance.py --repository-root .
      - name: Show fail-closed certification summary
        id: shadow_gate
        if: ${{ always() && steps.offline.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f = Path('reports/betting_v2/shadow_manifest.json')
          data = json.loads(f.read_text(encoding='utf-8'))
          assert data['certificationStatus'] == 'BLOCKED'
          assert data['liveRecommendationsPublished'] == 0
          assert data['api']['callsMadeByThisPublisher'] == 0
          print(json.dumps({
              'status': data['certificationStatus'],
              'liveRecommendationsPublished': data['liveRecommendationsPublished'],
              'providerCalls': data['api']['callsMadeByThisPublisher'],
              'blockingReasons': data.get('blockingReasons', []),
          }, ensure_ascii=False, indent=2))
          PY
      - name: Publish verifiable GitHub commit QA status
        # Existing connector can read this status without looking up a run ID.
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          UNIT_OUTCOME: ${{ steps.tests.outcome }}
          PILOT_OUTCOME: ${{ steps.offline.outcome }}
          GATE_OUTCOME: ${{ steps.shadow_gate.outcome }}
          ODDS_AUDIT_OUTCOME: ${{ steps.cached_odds.outcome }}
        run: |
          if [[ "$UNIT_OUTCOME" == "success" && "$PILOT_OUTCOME" == "success" && "$GATE_OUTCOME" == "success" && "$ODDS_AUDIT_OUTCOME" == "success" ]]; then
            outcome=success
            description="Full offline V2 tests and dual-model research pilot passed; no STRONG certification"
          else
            outcome=failure
            description="Offline V2 QA failed; inspect unit tests, model pilot or fail-closed manifest"
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$outcome" \
            -f context="betting-v2/offline-qa" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Attach bounded offline pilot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betting-v2-offline-qa
          path: |
            reports/betting_v2/pilot_model.json
            reports/betting_v2/pilot_elo_fallback_model.json
            reports/betting_v2/pilot_market_holdout.json
            reports/betting_v2/pilot_elo_market_holdout.json
            reports/betting_v2/pilot_cached_odds_provenance.json
            reports/betting_v2/shadow_manifest.json
          if-no-files-found: warn
          retention-days: 7
