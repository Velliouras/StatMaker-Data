name: Betting V2 Forward Candidate Research
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: betting-v2-forward-candidate
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify research math and freeze new fixtures from cached inputs
        run: |
          python -m pip install --quiet numpy scipy scikit-learn
          python -m unittest discover -s tests -p test_market_calibration.py -v
          python -m unittest discover -s tests -p test_market_residual.py -v
          python -m unittest discover -s tests -p test_paired_count.py -v
          python -m unittest discover -s tests -p test_forward_candidate.py -v
          python -m unittest discover -s tests -p test_forward_summary.py -v
          python -u scripts/betting_v2/forward_candidate.py --output reports/betting_v2/forward_candidate_20261016
      # Persistent Actions artifact uploads are disabled by repository policy.
      - name: Save immutable forecasts and updated scores only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          folder="reports/betting_v2/forward_candidate_20261016"
          evidence="$(mktemp -d)"
          if [ ! -d "$folder" ]; then exit 0; fi
          cp -a "$folder/." "$evidence/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            mkdir -p "$folder"
            cp -a "$evidence/." "$folder/"
            git add "$folder"
            if git diff --cached --quiet; then published=true; break; fi
            git commit -m "Freeze future candidate research and score available completed fixtures [skip ci]"
            if git push origin HEAD:main; then published=true; break; fi
          done
          [[ "$published" == "true" ]]
      - name: Record publication timing after successful evidence push
        run: |
          set -euo pipefail
          python scripts/betting_v2/forward_candidate.py --output reports/betting_v2/forward_candidate_20261016 --record-publication
          proof="reports/betting_v2/forward_candidate_20261016/publication_evidence.json"
          saved="$(mktemp)"
          cp "$proof" "$saved"
          for attempt in 1 2 3; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            python - "$saved" "$proof" <<'PY'
          import json,sys
          from pathlib import Path
          incoming,target=map(Path,sys.argv[1:]);old=json.loads(target.read_text()) if target.exists() else {}
          for key,value in json.loads(incoming.read_text()).items():
              if key in old and old[key]['sha256']!=value['sha256']:raise ValueError('Publication proof hash changed')
              if key not in old or value['publiclyVerifiedAtUTC']<old[key]['publiclyVerifiedAtUTC']:old[key]=value
          target.write_text(json.dumps(old,indent=2)+'\n')
          PY
            git add "$proof"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record public-before-kickoff eligibility for forward research [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
