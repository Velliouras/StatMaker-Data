name: Saturday Parity Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saturday-parity-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current data
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact published Saturday state
        uses: actions/checkout@v4
        with:
          ref: 5480af5d0636eb37b8b5aec84e6ee576a7195587
          path: saturday-repo
          fetch-depth: 1

      - name: Audit final Saturday versus current recommendation universe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          import zipfile
          from pathlib import Path

          retired = {
              "RESULT_ASIAN_HANDICAP",
              "HT_RESULT_ASIAN_HANDICAP",
              "ASIAN_MATCH_GOALS_TOTAL",
              "ASIAN_FIRST_HALF_GOALS_TOTAL",
              "ASIAN_MATCH_CORNERS_TOTAL",
              "ASIAN_CORNER_HANDICAP",
              "CORNER_HANDICAP",
          }

          saturday_bundle=Path("saturday-repo/data/statmaker/app_ready/app_ready_betting_bundle-8fb26ad587037355a319637fe8cb77c35b12f8f3ce14d82dde1a517d4622ef40.zip")
          if not saturday_bundle.is_file():
              raise SystemExit(f"Exact Saturday published bundle missing: {saturday_bundle}")

          manifest=json.loads(Path("data/statmaker/app_ready/update_manifest.json").read_text())
          current_bundle=Path(next(a["path"] for a in manifest["artifacts"] if a["id"]=="app_ready_betting_bundle"))
          if not current_bundle.is_file():
              raise SystemExit(f"Current bundle missing: {current_bundle}")

          def extract_db(bundle: Path, root: Path):
              root.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(bundle) as z:
                  names=[n for n in z.namelist() if n.endswith("databases/statmaker_prepared_betting.db")]
                  if len(names)!=1:
                      raise SystemExit(f"{bundle}: expected one prepared DB, got {names}")
                  z.extract(names[0],root)
                  return root/names[0]

          saturday_db=extract_db(saturday_bundle,Path("sat-extract"))
          current_db=extract_db(current_bundle,Path("cur-extract"))

          def audit(label,db):
              con=sqlite3.connect(f"file:{db}?mode=ro",uri=True)
              try:
                  gen=con.execute(
                      "SELECT generation_id,candidate_count FROM prepared_pattern_generation WHERE state='ready' ORDER BY built_at_ms DESC LIMIT 1"
                  ).fetchone()
                  gid=str(gen[0])
                  print("FINAL_PARITY_GENERATION",f"label={label}",f"generation={gid}",f"candidates={gen[1]}")

                  all_rows=con.execute(
                      """
                      SELECT c.market_family,COUNT(*)
                      FROM prepared_pattern_candidates c
                      WHERE c.generation_id=?
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                      GROUP BY c.market_family
                      ORDER BY COUNT(*) DESC,c.market_family
                      """,(gid,)
                  ).fetchall()
                  all_total=sum(int(r[1]) for r in all_rows)
                  print("FINAL_PARITY_ALL_STRONG",f"label={label}",f"strong={all_total}")

                  placeholders=",".join("?" for _ in retired)
                  rows=con.execute(
                      f"""
                      SELECT c.market_family,
                             COUNT(*) AS n,
                             COUNT(DISTINCT c.match_key) AS matches,
                             ROUND(AVG(c.selection_odd),3) AS avg_odd
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                        AND COALESCE(s.identity_sub_market_key,'') NOT IN ({placeholders})
                      GROUP BY c.market_family
                      ORDER BY n DESC,c.market_family
                      """,
                      (gid,*sorted(retired))
                  ).fetchall()
                  total=sum(int(r[1]) for r in rows)
                  result=sum(int(r[1]) for r in rows if r[0] in {"1X2","Double Chance","Draw No Bet"})
                  print("FINAL_PARITY_NO_RETIRED_SUMMARY",f"label={label}",f"strong={total}",f"result={result}",f"result_pct={(100*result/total if total else 0):.1f}")
                  for fam,n,matches,avg_odd in rows:
                      print("FINAL_PARITY_NO_RETIRED_MARKET",f"label={label}",f"family={fam}",f"count={n}",f"matches={matches}",f"avg_odd={avg_odd}")

                  if label=="current":
                      date_rows=con.execute(
                          f"""
                          SELECT c.market_family,
                                 COUNT(*) AS candidates,
                                 SUM(CASE WHEN c.recommendation_eligible=1 THEN 1 ELSE 0 END) AS eligible,
                                 SUM(CASE WHEN c.recommendation_eligible=1 AND c.value_tier='STRONG_VALUE' AND c.selection_odd>=1.50 THEN 1 ELSE 0 END) AS strong,
                                 COUNT(DISTINCT c.match_key) AS matches
                          FROM prepared_pattern_candidates c
                          JOIN prepared_selections s
                            ON s.competition_id=c.competition_id
                           AND s.snapshot_version=c.snapshot_version
                           AND s.selection_key=c.selection_key
                          WHERE c.generation_id=?
                            AND c.local_date='2026-09-19'
                            AND COALESCE(s.identity_sub_market_key,'') NOT IN ({placeholders})
                          GROUP BY c.market_family
                          ORDER BY candidates DESC,c.market_family
                          """,(gid,*sorted(retired))
                      ).fetchall()
                      for fam,candidates,eligible,strong,matches in date_rows:
                          print("FINAL_PARITY_CURRENT_0919",f"family={fam}",f"candidates={candidates}",f"eligible={eligible}",f"strong={strong}",f"matches={matches}")
              finally:
                  con.close()

          audit("saturday",saturday_db)
          audit("current",current_db)
          PY
