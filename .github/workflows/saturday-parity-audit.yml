name: Saturday Parity Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saturday-parity-audit.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download exact Saturday prepared checkpoint
        uses: actions/download-artifact@v4
        with:
          name: statmaker-app-ready-prepared-checkpoint
          path: saturday-checkpoint
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34699462130

      - name: Audit Saturday versus current recommendation universe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          import zipfile
          import tempfile
          from pathlib import Path

          retired = {
              "RESULT_ASIAN_HANDICAP",
              "HT_RESULT_ASIAN_HANDICAP",
              "ASIAN_MATCH_GOALS_TOTAL",
              "ASIAN_FIRST_HALF_GOALS_TOTAL",
              "ASIAN_MATCH_CORNERS_TOTAL",
              "ASIAN_CORNER_HANDICAP",
              "CORNER_HANDICAP",
          }

          def locate_db(root: Path):
              direct=list(root.rglob("statmaker_prepared_betting.db"))
              if direct:
                  return direct[0], None
              zips=list(root.rglob("*.zip"))
              for zpath in zips:
                  try:
                      with zipfile.ZipFile(zpath) as z:
                          names=[n for n in z.namelist() if n.endswith("databases/statmaker_prepared_betting.db") or n.endswith("statmaker_prepared_betting.db")]
                          if names:
                              tmp=tempfile.TemporaryDirectory()
                              z.extract(names[0],tmp.name)
                              return Path(tmp.name)/names[0], tmp
                  except zipfile.BadZipFile:
                      pass
              raise SystemExit(f"No prepared betting DB found under {root}")

          manifest=json.loads(Path("data/statmaker/app_ready/update_manifest.json").read_text())
          current_path=Path(next(a["path"] for a in manifest["artifacts"] if a["id"]=="app_ready_betting_bundle"))
          current_root=Path("current-extract")
          current_root.mkdir(exist_ok=True)
          with zipfile.ZipFile(current_path) as z:
              names=[n for n in z.namelist() if n.endswith("databases/statmaker_prepared_betting.db")]
              if len(names)!=1:
                  raise SystemExit(f"Current bundle prepared DB mismatch: {names}")
              z.extract(names[0],current_root)
              current_db=current_root/names[0]

          saturday_db, saturday_tmp=locate_db(Path("saturday-checkpoint"))

          def audit(label, db):
              con=sqlite3.connect(f"file:{db}?mode=ro",uri=True)
              try:
                  gen=con.execute(
                      "SELECT generation_id,candidate_count FROM prepared_pattern_generation WHERE state='ready' ORDER BY built_at_ms DESC LIMIT 1"
                  ).fetchone()
                  gid=str(gen[0])
                  print("PARITY_GENERATION",f"label={label}",f"generation={gid}",f"candidates={gen[1]}")
                  placeholders=",".join("?" for _ in retired)
                  rows=con.execute(
                      f"""
                      SELECT c.market_family,
                             COUNT(*) AS n,
                             COUNT(DISTINCT c.match_key) AS matches,
                             ROUND(AVG(c.selection_odd),3) AS avg_odd
                      FROM prepared_pattern_candidates c
                      JOIN prepared_selections s
                        ON s.competition_id=c.competition_id
                       AND s.snapshot_version=c.snapshot_version
                       AND s.selection_key=c.selection_key
                      WHERE c.generation_id=?
                        AND c.recommendation_eligible=1
                        AND c.value_tier='STRONG_VALUE'
                        AND c.selection_odd>=1.50
                        AND COALESCE(s.identity_sub_market_key,'') NOT IN ({placeholders})
                      GROUP BY c.market_family
                      ORDER BY n DESC,c.market_family
                      """,
                      (gid,*sorted(retired)),
                  ).fetchall()
                  total=sum(int(r[1]) for r in rows)
                  result=sum(int(r[1]) for r in rows if r[0] in {"1X2","Double Chance","Draw No Bet"})
                  print("PARITY_NO_RETIRED_SUMMARY",f"label={label}",f"strong={total}",f"result={result}",f"result_pct={(100*result/total if total else 0):.1f}")
                  for fam,n,matches,avg_odd in rows:
                      print("PARITY_NO_RETIRED_MARKET",f"label={label}",f"family={fam}",f"count={n}",f"matches={matches}",f"avg_odd={avg_odd}")

                  if label=="current":
                      date_rows=con.execute(
                          f"""
                          SELECT c.market_family,
                                 COUNT(*) AS candidates,
                                 SUM(CASE WHEN c.recommendation_eligible=1 THEN 1 ELSE 0 END) AS eligible,
                                 SUM(CASE WHEN c.recommendation_eligible=1 AND c.value_tier='STRONG_VALUE' AND c.selection_odd>=1.50 THEN 1 ELSE 0 END) AS strong,
                                 COUNT(DISTINCT c.match_key) AS matches
                          FROM prepared_pattern_candidates c
                          JOIN prepared_selections s
                            ON s.competition_id=c.competition_id
                           AND s.snapshot_version=c.snapshot_version
                           AND s.selection_key=c.selection_key
                          WHERE c.generation_id=?
                            AND c.local_date='2026-09-19'
                            AND COALESCE(s.identity_sub_market_key,'') NOT IN ({placeholders})
                          GROUP BY c.market_family
                          ORDER BY candidates DESC,c.market_family
                          """,
                          (gid,*sorted(retired)),
                      ).fetchall()
                      for fam,candidates,eligible,strong,matches in date_rows:
                          print("PARITY_CURRENT_0919",f"family={fam}",f"candidates={candidates}",f"eligible={eligible}",f"strong={strong}",f"matches={matches}")
              finally:
                  con.close()

          audit("saturday",saturday_db)
          audit("current",current_db)
          if saturday_tmp is not None:
              saturday_tmp.cleanup()
          PY
