name: API-Football Odds Capability Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe API-Football pre-match odds capabilities
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python scripts/probe_api_football_odds_capabilities.py --force --sample-days 7

      - name: Commit capability report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/api_football_odds_capability_probe.json
          if git diff --cached --quiet; then
            echo "No API-Football odds capability report changes."
          else
            git commit -m "Probe API-Football odds capabilities"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
