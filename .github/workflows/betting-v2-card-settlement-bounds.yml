name: Betting V2 Card Settlement Bounds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/triggers/betting-v2-card-settlement-bounds-20261018']
permissions:
  contents: write
concurrency:
  group: betting-v2-card-settlement-bounds
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify uncertain card count and settlement bounds
        run: |
          python -m pip install --quiet numpy scipy scikit-learn
          python -m unittest discover -s tests -p test_card_settlement_bounds.py -v
      - name: Bound uncertain card settlements on all recovered offers
        run: python -u scripts/betting_v2/audit_card_bounds.py --output reports/betting_v2/card_settlement_bounds_20261018
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-settlement-bounds
          path: reports/betting_v2/card_settlement_bounds_20261018/
          retention-days: 30
      - name: Save research evidence and resumable checkpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          folder="reports/betting_v2/card_settlement_bounds_20261018"
          saved="$(mktemp -d)"
          if [ ! -d "$folder" ]; then exit 0; fi
          cp -a "$folder/." "$saved/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            mkdir -p "$folder"
            cp -a "$saved/." "$folder/"
            git add -- "$folder"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Checkpoint card settlement bounds and unresolved contracts [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
