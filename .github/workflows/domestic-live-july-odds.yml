name: Domestic Active and July Exact Odds

on:
  workflow_dispatch:
    inputs:
      cycle_size:
        description: "Leagues to refresh in this Odds-API.io cycle"
        required: true
        default: "8"
        type: string
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_domestic_live_july_odds.py"
      - "scripts/domestic_odds_expansion.py"
      - "scripts/odds_api_io_market_audit.py"
      - "tests/test_domestic_market_expansion.py"
      - ".github/workflows/domestic-live-july-odds.yml"

permissions:
  contents: write

concurrency:
  group: domestic-active-july-exact-odds
  cancel-in-progress: true

jobs:
  refresh-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test exact market expansion
        run: |
          python -m unittest tests/test_domestic_market_expansion.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import odds_api_io_market_audit as audit
          print(audit.run_market_audit_self_check())
          PY

      - name: Refresh rotating exact-odds batch
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDS_API_IO_BOOKMAKERS: ${{ vars.ODDS_API_IO_BOOKMAKERS || 'Bet365,Unibet' }}
          INPUT_CYCLE_SIZE: ${{ inputs.cycle_size }}
        run: |
          cycle_size="${INPUT_CYCLE_SIZE:-8}"
          python scripts/refresh_domestic_live_july_odds.py --cycle-size "$cycle_size"

      - name: Validate exact odds contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          registry = json.loads((root / 'data/statmaker/domestic_live_july_registry.json').read_text(encoding='utf-8'))
          odds = json.loads((root / 'odds/odds_api_io/domestic_odds.json').read_text(encoding='utf-8'))
          registry_codes = {str(item.get('leagueCode') or '') for item in registry.get('leagues', [])}
          odds_codes = {str(item.get('leagueCode') or '') for item in odds.get('leagues', [])}
          if registry_codes != odds_codes:
              raise SystemExit('Odds feed no longer matches the active/July registry')
          for league in odds.get('leagues', []):
              for match in league.get('matches', []) or []:
                  if match.get('teamMappingStatus') != 'matched' or match.get('usableForStats') is not True:
                      raise SystemExit('Odds match without canonical stats mapping')
                  for market in match.get('markets', []) or []:
                      if market.get('exactBookmakerOdds') is not True or not market.get('bookmaker'):
                          raise SystemExit('Non-exact or anonymous market in production odds feed')
                      if market.get('market') == 'DOUBLE_CHANCE' and market.get('selection') not in {'1X', 'X2', '12'}:
                          raise SystemExit('Invalid Double Chance selection')
          print('Exact Domestic odds contract valid')
          PY

      - name: Commit refreshed exact odds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            odds/odds_api_io/domestic_odds.json \
            data/statmaker/domestic_live_july_state.json \
            reports/domestic_odds_debug.json \
            reports/domestic_live_july_odds_refresh.json
          if git diff --cached --quiet; then
            echo "No exact Domestic odds changes to commit."
          else
            git commit -m "Refresh active and July exact odds"
            git push origin HEAD:main
          fi
