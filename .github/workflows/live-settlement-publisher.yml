name: Live Settlement Publisher

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Safe API-Football request cap for this run"
        required: true
        default: "80"
        type: string
  push:
    branches:
      - main
    paths:
      - 'scripts/refresh_live_settlements.py'
      - 'scripts/reconcile_canonical_settlement_gaps.py'
      - 'scripts/refresh_fixture_validity.py'
      - 'scripts/refresh_fixture_validity_priority.py'
      - 'scripts/materialize_canonical_recommendation_ledger.py'
      - 'scripts/apply_fixture_disposition_overrides.py'
      - 'data/statmaker/fixture_disposition_overrides.json'
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  # This is the latency-critical settlement lane. It owns only live settlement/validity artifacts
  # and must never wait behind heavyweight canonical producers. A newer scheduled run supersedes
  # an older one if runner scheduling ever causes overlap.
  group: statmaker-live-settlement-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate live settlement producers
        run: |
          python -m py_compile \
            scripts/api_football_fetch_fixture_stats.py \
            scripts/api_football_daily_quota_guard.py \
            scripts/refresh_live_settlements.py \
            scripts/reconcile_canonical_settlement_gaps.py \
            scripts/refresh_fixture_validity.py \
            scripts/refresh_fixture_validity_priority.py \
            scripts/materialize_canonical_recommendation_ledger.py \
            scripts/apply_fixture_disposition_overrides.py

      - name: Refresh completed fixtures and canonical fixture validity
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_DAILY_RESERVE: "1500"
          INPUT_MAX_REQUESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_requests || '80' }}
        shell: bash
        run: |
          set -euo pipefail
          total="${INPUT_MAX_REQUESTS:-80}"
          if ! [[ "$total" =~ ^[0-9]+$ ]] || (( total < 2 )); then total=80; fi

          validity=4
          if (( total <= 6 )); then validity=$((total - 2)); fi
          if (( validity < 0 )); then validity=0; fi

          # Materialize first so the just-finished Athens day is present before the exact-id gap pass.
          # This stage is repository-only and consumes no provider quota.
          python scripts/materialize_canonical_recommendation_ledger.py --backfill-dates 1

          # Spend only what is needed on past canonical recommendations that have an authoritative
          # API-Football fixture id but are absent from the rolling settlement cache. Unused capacity
          # is immediately returned to the normal date-driven live producer below.
          gap_cap=$((total - validity - 2))
          if (( gap_cap > 8 )); then gap_cap=8; fi
          if (( gap_cap < 0 )); then gap_cap=0; fi
          gap_log="$(mktemp)"
          python scripts/reconcile_canonical_settlement_gaps.py --max-requests "$gap_cap" | tee "$gap_log"
          gap_used="$(sed -n 's/.* requests=\([0-9][0-9]*\).*/\1/p' "$gap_log" | tail -n 1)"
          rm -f "$gap_log"
          if ! [[ "${gap_used:-}" =~ ^[0-9]+$ ]]; then gap_used=0; fi
          if (( gap_used > gap_cap )); then gap_used=$gap_cap; fi

          settlement=$((total - validity - gap_used))
          if (( settlement < 2 )); then settlement=2; fi
          python scripts/refresh_live_settlements.py --max-requests "$settlement"

          python scripts/refresh_fixture_validity_priority.py --max-requests "$validity"
          python scripts/apply_fixture_disposition_overrides.py

          # The validity bridge can transiently touch the shared ledger in legacy-compatible form.
          # Re-materialize once, without provider calls, so the published artifact is always v3 and
          # the identity integrity gate remains authoritative.
          python scripts/materialize_canonical_recommendation_ledger.py --backfill-dates 1

      - name: Publish latency-critical settlement artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ownership boundary: update_manifest.json belongs to the canonical producer lane.
          # Fixture-validity helpers may refresh it in the worktree for standalone/manual runs,
          # but this 15-minute publisher must never commit that shared file or contend with the
          # heavyweight canonical writers that rebuild it.
          git restore --source=HEAD --worktree --staged data/statmaker/update_manifest.json

          git add \
            data/statmaker/live_settlements.json \
            data/api_football/live_settlement_cache.json \
            data/statmaker/fixture_validity.json \
            data/statmaker/canonical_recommendation_ledger.json

          if git diff --cached --quiet; then
            echo "No new completed fixtures, settlement statistics, canonical ledger rows or fixture dispositions."
            exit 0
          fi

          git commit -m "Refresh live settlement and fixture validity"

          # Other producers may advance main while this short run is executing. They no longer
          # touch this lane's owned artifacts, so rebasing is expected to be conflict-free. Retry
          # only non-fast-forward races; fail closed if the ownership contract is ever violated.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Live settlement ownership conflict detected during rebase."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Live settlement push attempt ${attempt} lost a remote race; retrying."
            sleep $((attempt * 4))
          done

          echo "Could not publish live settlement feed after retries."
          exit 1
