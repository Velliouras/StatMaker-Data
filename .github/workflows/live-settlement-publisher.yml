name: Live Settlement Publisher

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Safe API-Football request cap for this run"
        required: true
        default: "80"
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-settlement-publisher.yml'
      - 'scripts/refresh_live_settlements.py'
      - 'scripts/reconcile_canonical_settlement_gaps.py'
      - 'scripts/reconcile_canonical_ledger_identity.py'
      - 'scripts/refresh_fixture_validity.py'
      - 'scripts/refresh_fixture_validity_priority.py'
      - 'scripts/materialize_canonical_recommendation_ledger.py'
      - 'scripts/apply_fixture_disposition_overrides.py'
      - 'data/statmaker/fixture_disposition_overrides.json'
  schedule:
    # Keep API-Football pressure bounded. The exact-id canonical reconciliation below remains
    # authoritative, so completed recommendations settle correctly on the next 15-minute cycle.
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: statmaker-live-settlement-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate live settlement producers
        run: |
          python -m py_compile \
            scripts/api_football_fetch_fixture_stats.py \
            scripts/api_football_daily_quota_guard.py \
            scripts/refresh_live_settlements.py \
            scripts/reconcile_canonical_settlement_gaps.py \
            scripts/reconcile_canonical_ledger_identity.py \
            scripts/refresh_fixture_validity.py \
            scripts/refresh_fixture_validity_priority.py \
            scripts/materialize_canonical_recommendation_ledger.py \
            scripts/apply_fixture_disposition_overrides.py

      - name: Validate settlement registry identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          path = Path('data/statmaker/domestic_live_july_registry.json')
          root = json.loads(path.read_text(encoding='utf-8-sig'))
          rows = [
              row for row in root.get('leagues', [])
              if isinstance(row, dict) and row.get('enabledForStats') is not False
          ]
          grouped = defaultdict(list)
          for row in rows:
              provider = row.get('api_football_league_id') or row.get('apiFootballLeagueId')
              season = str(
                  row.get('targetApiSeason')
                  or row.get('historyApiSeason')
                  or row.get('season')
                  or ''
              ).strip()
              if provider is None:
                  continue
              grouped[(int(provider), season)].append(row)

          ambiguous = []
          for (provider, season), candidates in grouped.items():
              if len(candidates) <= 1:
                  continue
              active = [
                  row for row in candidates
                  if str(row.get('lifecycle') or '').strip().lower() == 'active'
              ]
              if len(active) == 1:
                  continue
              ambiguous.append({
                  'providerLeagueId': provider,
                  'season': season,
                  'leagueCodes': [str(row.get('leagueCode') or '') for row in candidates],
                  'activeLeagueCodes': [str(row.get('leagueCode') or '') for row in active],
              })

          if ambiguous:
              raise SystemExit(
                  'SETTLEMENT_REGISTRY_IDENTITY_AMBIGUOUS ' + json.dumps(ambiguous[:20], ensure_ascii=False)
              )
          print('SETTLEMENT_REGISTRY_IDENTITY_OK', f'groups={len(grouped)}')
          PY

      - name: Refresh completed fixtures and canonical fixture validity
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_DAILY_RESERVE: "1500"
          INPUT_MAX_REQUESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_requests || '80' }}
        shell: bash
        run: |
          set -euo pipefail
          total="${INPUT_MAX_REQUESTS:-80}"
          if ! [[ "$total" =~ ^[0-9]+$ ]] || (( total < 2 )); then total=80; fi

          validity=4
          if (( total <= validity + 2 )); then validity=$((total - 2)); fi
          if (( validity < 0 )); then validity=0; fi

          # Rebuild recommendation history first, then repair stale historical team/fixture identity
          # from the already-published explicit-final feed. Both steps are repository-only.
          python scripts/materialize_canonical_recommendation_ledger.py --backfill-dates 1
          python scripts/reconcile_canonical_ledger_identity.py

          gap_cap=$((total - validity - 2))
          if (( gap_cap > 8 )); then gap_cap=8; fi
          if (( gap_cap < 0 )); then gap_cap=0; fi
          gap_log="$(mktemp)"
          python scripts/reconcile_canonical_settlement_gaps.py --max-requests "$gap_cap" | tee "$gap_log"
          gap_used="$(sed -n 's/.* requests=\([0-9][0-9]*\).*/\1/p' "$gap_log" | tail -n 1)"
          rm -f "$gap_log"
          if ! [[ "${gap_used:-}" =~ ^[0-9]+$ ]]; then gap_used=0; fi
          if (( gap_used > gap_cap )); then gap_used=$gap_cap; fi

          settlement=$((total - validity - gap_used))
          if (( settlement < 2 )); then settlement=2; fi
          python scripts/refresh_live_settlements.py --max-requests "$settlement"

          if (( validity > 0 )); then
            python scripts/refresh_fixture_validity_priority.py --max-requests "$validity"
          fi
          python scripts/apply_fixture_disposition_overrides.py

          # Re-materialization may restore an old historical row from an immutable pre-match bundle;
          # immediately re-apply the same unique-final identity reconciliation before publication.
          python scripts/materialize_canonical_recommendation_ledger.py --backfill-dates 1
          python scripts/reconcile_canonical_ledger_identity.py

      - name: Publish latency-critical settlement artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git restore --source=HEAD --worktree --staged data/statmaker/update_manifest.json

          git add \
            data/statmaker/live_settlements.json \
            data/api_football/live_settlement_cache.json \
            data/statmaker/fixture_validity.json \
            data/statmaker/canonical_recommendation_ledger.json

          if git diff --cached --quiet; then
            echo "No new completed fixtures, settlement statistics, canonical ledger rows or fixture dispositions."
            exit 0
          fi

          git commit -m "Refresh live settlement and fixture validity"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Live settlement ownership conflict detected during rebase."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Live settlement push attempt ${attempt} lost a remote race; retrying."
            sleep $((attempt * 4))
          done

          echo "Could not publish live settlement feed after retries."
          exit 1
