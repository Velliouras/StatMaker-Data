name: UAT Betting Compile and Regression Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uat-betting-compile-validation.yml'

permissions:
  contents: read

concurrency:
  group: statmaker-uat-betting-compile
  cancel-in-progress: true

jobs:
  kotlin-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout exact Android UAT source
        uses: actions/checkout@v4
        with:
          repository: Velliouras/StatMaker
          ref: uat
          token: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
          path: statmaker-uat
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Compile Betting V2 engine from current Android UAT
        working-directory: statmaker-uat
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Run only V2 master-spec engine contract regressions
        working-directory: statmaker-uat
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon \
            --tests com.statmaker.app.BettingEngineV2Test \
            -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process

      # Persistent Actions artifact uploads are disabled by repository policy.
