name: Betting V2 Historical CSV Price Research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/triggers/betting-v2-csv-price-research-v2']
permissions:
  contents: write
concurrency:
  group: betting-v2-csv-price-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install numerical dependencies and verify archive-only replay rules
        run: |
          python -m pip install --quiet numpy scipy scikit-learn
          python -m unittest discover -s tests -p test_research_csv_prices.py -v
          python -m unittest discover -s tests -p test_exact_forecast_adapter.py -v
      - name: Import official archive prices and replay immutable prior-month predictions
        run: >-
          python -u scripts/betting_v2/research_csv_prices.py
          --input reports/betting_v2/csv_prices_v2_20261016/frozen_predictions.json.gz
          --manifest reports/betting_v2/csv_prices_v2_20261016/input_manifest.json
          --output reports/betting_v2/csv_prices_v2_20261016
          --source-cache reports/betting_v2/csv_prices_20261016/sources
          --resolve-schedule-aliases
      # Persistent Actions artifact uploads are disabled by repository policy.
      - name: Persist archive research checkpoint only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$(mktemp -d)"
          cp -a reports/betting_v2/csv_prices_v2_20261016/. "$evidence/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin +main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            mkdir -p reports/betting_v2/csv_prices_v2_20261016
            cp -a "$evidence/." reports/betting_v2/csv_prices_v2_20261016/
            git add reports/betting_v2/csv_prices_v2_20261016
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Save historical CSV price research evidence [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
