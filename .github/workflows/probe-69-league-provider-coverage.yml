name: Probe 69-League Provider Coverage

on:
  push:
    branches:
      - statmaker-69-league-expansion-v2

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe API-Football and Odds-API.io once each
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.request import Request, urlopen

          root = Path('.')
          sys.path.insert(0, str((root / 'scripts').resolve()))
          import run_scoped_domestic_registry as rolling
          import statmaker_top_flight_expansion as expansion
          import update_domestic_odds_api_io as odds

          rows = expansion.expansion_leagues()
          expected = expansion.expansion_codes()
          if len(expected) != 16:
              raise SystemExit(f'Expected 16 expansion leagues, got {len(expected)}')

          api_key = os.environ['API_FOOTBALL_KEY'].strip()
          request = Request(
              'https://v3.football.api-sports.io/leagues',
              headers={
                  'x-apisports-key': api_key,
                  'Accept': 'application/json',
                  'User-Agent': 'StatMaker-Data 69-league coverage probe',
              },
              method='GET',
          )
          with urlopen(request, timeout=45) as response:
              payload = json.loads(response.read().decode('utf-8'))
              remaining = response.headers.get('x-ratelimit-requests-remaining')
              limit = response.headers.get('x-ratelimit-requests-limit')

          catalog = [item for item in payload.get('response', []) if isinstance(item, dict)]
          by_id = {
              int((item.get('league') or {}).get('id')): item
              for item in catalog
              if (item.get('league') or {}).get('id') is not None
          }
          today = dt.datetime.now(dt.timezone.utc).date()
          api_missing = []
          api_ready = []
          for row in rows:
              code = row['leagueCode']
              league_id = int(row['apiFootballLeagueId'])
              item = by_id.get(league_id)
              if item is None:
                  api_missing.append(code)
                  print(f'API_FOOTBALL_MISSING code={code} id={league_id}')
                  continue
              seasons = [s for s in item.get('seasons', []) if isinstance(s, dict)]
              choice = rolling.select_target_season_rolling(seasons, today)
              league_name = (item.get('league') or {}).get('name')
              country = (item.get('country') or {}).get('name')
              if choice is None:
                  print(f'API_FOOTBALL_NO_ACTIVE_WINDOW code={code} id={league_id} name={league_name} country={country}')
              else:
                  season, lifecycle = choice
                  api_ready.append(code)
                  print(
                      f'API_FOOTBALL_OK code={code} id={league_id} name={league_name} country={country} '
                      f'season={season.get("year")} start={season.get("start")} end={season.get("end")} lifecycle={lifecycle}'
                  )
          print(f'API_FOOTBALL_SUMMARY found={16-len(api_missing)}/16 ready_now_or_45d={len(api_ready)}/16 remaining={remaining} limit={limit}')
          if api_missing:
              raise SystemExit(f'API-Football expansion IDs missing: {api_missing}')

          odds_key = os.environ['ODDS_API_IO_KEY'].strip()
          debug = {'warnings': [], 'apiCalls': []}
          provider_leagues = odds.discover_provider_leagues(odds_key, debug)
          odds_matched = []
          odds_missing = []
          for row in rows:
              match = odds.match_provider_league(row, provider_leagues)
              code = row['leagueCode']
              if match is None:
                  odds_missing.append(code)
                  print(f'ODDS_API_IO_MISSING code={code} country={row.get("country")} competition={row.get("competition")}')
              else:
                  odds_matched.append(code)
                  print(
                      f'ODDS_API_IO_OK code={code} name={match.get("name")} slug={match.get("slug")} '
                      f'events={match.get("eventsCount")}'
                  )
          print(
              f'ODDS_API_IO_SUMMARY matched={len(odds_matched)}/16 missing={len(odds_missing)} '
              f'rateLimitRemaining={debug.get("rateLimitRemaining")}'
          )
          print(f'ODDS_API_IO_MISSING_CODES={",".join(odds_missing)}')
          PY
