name: Validate UAT Strict Update Client

on:
  pull_request:
    branches: [uat-artifact-ci-base]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require private read token
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Load current published UAT manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_url="https://raw.githubusercontent.com/Velliouras/StatMaker-Data/uat/data/statmaker/app_ready/update_manifest.json?ts=$(date +%s%N)"
          curl --fail --silent --show-error --location "$manifest_url" -o /tmp/uat-app-ready-manifest.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          manifest = json.loads(Path('/tmp/uat-app-ready-manifest.json').read_text(encoding='utf-8'))
          assert manifest['schemaVersion'] == 1
          assert manifest['branch'] == 'uat'
          artifacts = {item['id']: item for item in manifest['artifacts']}
          print(f"EXPECTED_VERSION={manifest['contentVersion']}")
          print(f"EXPECTED_STATS={artifacts['app_ready_stats_bundle']['sha256']}")
          print(f"EXPECTED_BETTING={artifacts['app_ready_betting_bundle']['sha256']}")
          PY

      - name: Checkout isolated UAT client
        uses: actions/checkout@v4
        with:
          repository: Velliouras/StatMaker
          ref: fix/uat-strict-performance-20260731
          token: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Prepare runtime validation
        shell: bash
        run: |
          cat > validate-uat-update.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          : "${EXPECTED_VERSION:?}"
          : "${EXPECTED_STATS:?}"
          : "${EXPECTED_BETTING:?}"

          package="com.statmaker.app.uat"
          activity="$package/com.statmaker.app.StatMakerUatWelcomeActivity"
          diagnostics="shared_prefs/statmaker_uat_update_diagnostics.xml"
          app_ready="shared_prefs/statmaker_app_ready_artifacts.xml"

          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell pm clear "$package"

          read_file() {
            adb shell run-as "$package" cat "$1" 2>/dev/null | tr -d '\r' || true
          }

          fail_with_diagnostics() {
            local message="$1"
            echo "$message"
            echo "--- diagnostics ---"
            read_file "$diagnostics"
            echo "--- app-ready prefs ---"
            read_file "$app_ready"
            exit 1
          }

          wait_for_result() {
            local label="$1"
            local deadline=$(( $(date +%s%3N) + 15000 ))
            while (( $(date +%s%3N) < deadline )); do
              local xml elapsed
              xml="$(read_file "$diagnostics")"
              if grep -q '>failure<' <<<"$xml"; then
                fail_with_diagnostics "$label failed"
              fi
              if grep -q '>success<' <<<"$xml"; then
                elapsed="$(sed -n 's/.*name="elapsed_ms" value="\([0-9][0-9]*\)".*/\1/p' <<<"$xml" | head -1 || true)"
                [[ -n "$elapsed" ]] || fail_with_diagnostics "$label has no elapsed_ms"
                (( elapsed <= 10000 )) || fail_with_diagnostics "$label exceeded 10 seconds: ${elapsed}ms"
                grep -q "$EXPECTED_VERSION" <<<"$xml" || \
                  fail_with_diagnostics "$label activated a different content version"
                echo "$label=${elapsed}ms version=$EXPECTED_VERSION"
                return
              fi
              sleep 0.20
            done
            fail_with_diagnostics "$label produced no result"
          }

          adb shell am start -W -n "$activity"
          wait_for_result "cold_update"

          app_xml="$(read_file "$app_ready")"
          grep -q "$EXPECTED_STATS" <<<"$app_xml" || \
            fail_with_diagnostics "Cold update did not activate current stats hash"
          grep -q "$EXPECTED_BETTING" <<<"$app_xml" || \
            fail_with_diagnostics "Cold update did not activate current betting hash"

          for path in \
            databases/statmaker.db \
            databases/statmaker_prepared_betting.db \
            files/app_ready_odds/domestic.json \
            files/app_ready_odds/champions_league.json \
            files/app_ready_odds/europa_league.json \
            files/app_ready_odds/conference_league.json; do
            adb shell run-as "$package" test -s "$path" || \
              fail_with_diagnostics "Missing installed file: $path"
          done

          adb shell am force-stop "$package"
          adb shell am start -W -n "$activity"
          wait_for_result "current_version_update"
          SCRIPT
          chmod +x validate-uat-update.sh

      - name: Build, install and measure strict update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          script: ./validate-uat-update.sh
