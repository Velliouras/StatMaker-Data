name: Audit Domestic Market Shapes v16

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/audit_domestic_market_shapes_v16.py"
      - ".github/workflows/audit-domestic-market-shapes-v16.yml"

permissions:
  contents: write

concurrency:
  group: domestic-market-shapes-v16
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit exact provider market shapes
        run: python scripts/audit_domestic_market_shapes_v16.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/domestic_market_shapes_v16.json
          if git diff --cached --quiet; then
            echo "No audit changes."
          else
            git commit -m "Record Domestic market shapes v16"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
