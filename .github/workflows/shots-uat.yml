name: Shots SOT UAT Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/triggers/shots-uat']
  schedule:
    - cron: '45 */4 * * *'
  workflow_run:
    workflows: ['Odds Integrity Production Refresh', 'Domestic Statistics Universe', 'Domestic Historical Closure']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: statmaker-shots-uat
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /config/
            /mappings/
            /data/statmaker/domestic_enriched/
            /data/statmaker/league_tables/
            /data/statmaker/domestic_match_context_cache.json
            /data/statmaker/uat/shots_v1/
            /data/statmaker/uefa_support_history.json
            /data/statmaker/uefa_team_support_history.json
            /data/statmaker/uefa_current_stats.json
            /data/api_football/league_tables/
            /odds/odds_api_io/domestic_odds.json
            /odds/odds_api_io/domestic_provider_markets.json
            /reports/betting_v2/prior_market_calibration_20261018/history.json.gz
            /reports/betting_v2/market_first_counts_20261018/quotes_*.json.gz
            /reports/betting_v2/quote_receipts/
      - name: Read existing UEFA odds branch
        uses: actions/checkout@v4
        with:
          ref: build/uefa-qualifier-feed-20260720
          path: .sources/uefa
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /odds/odds_api_io/champions_league_odds.json
            /odds/odds_api_io/europa_league_odds.json
            /odds/odds_api_io/conference_league_odds.json
            /data/statmaker/uefa_update_manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install catboost==1.2.8 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Verify leakage, probabilities, exact prices and settlement
        run: python -m unittest scripts.shots_uat.test_contract -v
      - name: Verify existing cached history loader
        run: |
          python -c "from scripts.shots_uat.feed import load_history; print('CACHED_HISTORY', len(load_history()))"
      - name: Train frozen initial bank when absent
        run: |
          if [ ! -f data/statmaker/uat/shots_v1/model/bank.json ]; then
            python -m scripts.shots_uat.train
          fi
      - name: Replay fixed bank against archived October quotes
        run: |
          if ! python -c "import json; from scripts.shots_uat.model import POLICY_ID; from scripts.shots_uat.feed import OUT; p=OUT/'validation.json'; raise SystemExit(0 if p.exists() and json.loads(p.read_text()).get('policyId') == POLICY_ID else 1)"; then
            python -m scripts.shots_uat.replay
          fi
      - name: Stage prospective issues from cached data
        run: python -m scripts.shots_uat.feed --stage-issues
      - name: Publish immutable issues before exposing them to the app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/statmaker/uat/shots_v1/model data/statmaker/uat/shots_v1/ledger.json data/statmaker/uat/shots_v1/validation.json data/statmaker/uat/shots_v1/observations.json data/statmaker/uat/shots_v1/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'UAT: issue Shots/SOT selections with frozen CatBoost bank'
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 4 ]; then exit 1; fi
            done
          fi
      - name: Verify public pre-kickoff commit and grade exact cached results
        run: python -m scripts.shots_uat.feed --publish
      - name: Publish independent UAT read model
        run: |
          git add data/statmaker/uat/shots_v1
          if ! git diff --cached --quiet; then
            git commit -m 'UAT: refresh Shots/SOT feed and Performance Daily settlements'
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 4 ]; then exit 1; fi
            done
          fi
