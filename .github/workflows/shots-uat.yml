name: Shots SOT UAT Feed

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      results_only:
        description: Settle existing immutable issues without generating new picks
        type: boolean
        required: false
        default: false
permissions:
  contents: write

concurrency:
  group: statmaker-shots-uat
  # Result publications must not be discarded when another trigger arrives during a run.
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Result events only settle existing immutable issues; do not run the candidate pipeline.
      RESULTS_ONLY: ${{ inputs.results_only || (github.event_name == 'workflow_run' && (github.event.workflow_run.name == 'UEFA Current Stats Refresh' || github.event.workflow_run.name == 'Model Performance Settlement Refresh')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[settlements-only]')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/scripts/publish_generated_paths.py
            /tests/test_generated_publication.py
            /tests/test_primary_snapshot_bindings.py
            /config/
            /mappings/
            /data/statmaker/domestic_enriched/
            /data/statmaker/league_tables/
            /data/statmaker/domestic_match_context_cache.json
            /data/statmaker/uat/shots_v1/
            /data/statmaker/betting_v1/
            /data/statmaker/uat/market_watch/
            /docs/market-watch/
            /docs/.nojekyll
            /data/statmaker/uefa_support_history.json
            /data/statmaker/uefa_team_support_history.json
            /data/statmaker/uefa_current_stats.json
            /data/statmaker/live_settlements.json
            /data/api_football/league_tables/
            /odds/odds_api_io/domestic_odds.json
            /odds/odds_api_io/domestic_provider_markets.json
            /reports/betting_v2/prior_market_calibration_20261018/history.json.gz
            /reports/betting_v2/market_first_counts_20261018/quotes_*.json.gz
            /reports/betting_v2/market_first_counts_20261018/priced_*.json
            /reports/betting_v2/forward_market_first_20261018/
            /reports/market_watch/count_paper_v1/
            /reports/market_watch/all_paper_v1/
            /reports/betting_v2/quote_receipts/
            /reports/betting_v2/uat_factorized_20261016/
            /reports/betting_v2/oof_research_20261016/*_2026-10-01_pretest_state.json.gz
            /reports/betting_v2/model_revision_20261016/
            /reports/betting_v2/model_revision_calibration_20261016/
            /reports/betting_v2/all_market_revision_20261016/
      - name: Read existing UEFA odds branch
        uses: actions/checkout@v4
        with:
          ref: build/uefa-qualifier-feed-20260720
          path: .sources/uefa
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /odds/odds_api_io/champions_league_odds.json
            /odds/odds_api_io/europa_league_odds.json
            /odds/odds_api_io/conference_league_odds.json
            /data/statmaker/uefa_update_manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install catboost==1.2.8 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Verify leakage, probabilities, exact prices and settlement
        run: python -m unittest scripts.shots_uat.test_contract scripts.shots_uat.test_results scripts.shots_uat.test_production scripts.shots_uat.test_repricing scripts.shots_uat.test_daily scripts.market_watch.test_policy scripts.market_watch.test_catalog scripts.market_watch.test_recommend -v
      - name: Verify API-Football quote binding and repricing
        run: python -m unittest discover -s tests -p test_primary_snapshot_bindings.py -v
      - name: Verify existing cached history loader
        run: |
          python -c "from scripts.shots_uat.feed import load_history; print('CACHED_HISTORY', len(load_history()))"
      - name: Require the existing deployed model bank
        if: env.RESULTS_ONLY != 'true'
        run: test -f data/statmaker/uat/shots_v1/model/bank.json
      - name: Stage prospective issues from cached data
        if: env.RESULTS_ONLY != 'true'
        run: |
          python -m scripts.market_watch.build
          python -m scripts.shots_uat.feed --stage-issues
      - name: Publish immutable issues before exposing them to the app
        if: env.RESULTS_ONLY != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/statmaker/uat/shots_v1 data/statmaker/betting_v1 data/statmaker/uat/market_watch docs/market-watch docs/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'UAT: issue Shots/SOT selections with frozen CatBoost bank'
            python .github/scripts/publish_generated_paths.py --path-prefix data/statmaker/uat/ --path-prefix data/statmaker/betting_v1/ --path-prefix docs/market-watch/ --path-prefix docs/.nojekyll
          fi
      - name: Verify public pre-kickoff commit and grade exact cached results
        run: python -m scripts.shots_uat.feed --publish
      - name: Publish the same immutable issues for production
        run: python -m scripts.shots_uat.publish_production
      - name: Publish Singles read models and settlements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/statmaker/uat/shots_v1 data/statmaker/betting_v1 data/statmaker/uat/market_watch docs/market-watch docs/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'UAT: refresh Shots/SOT feed and Performance Daily settlements'
            python .github/scripts/publish_generated_paths.py --path-prefix data/statmaker/uat/ --path-prefix data/statmaker/betting_v1/ --path-prefix docs/market-watch/ --path-prefix docs/.nojekyll
          fi

