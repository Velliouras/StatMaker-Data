name: Domestic Lineup Watch

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Maximum API-Football requests for confirmed lineups from current Data/main"
        required: true
        default: "3"
        type: string
  schedule:
    # Rolling pre-match watcher. Offset from the 4-hour full context workflow at :05.
    - cron: "20,50 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/domestic-lineup-watch.yml"
      - "scripts/refresh_domestic_lineup_mappings.py"
      - "scripts/refresh_domestic_lineups.py"

permissions:
  contents: write

concurrency:
  # Serialize every workflow that writes canonical StatMaker main data.
  # One running writer at a time prevents manifest/data rebase collisions.
  group: statmaker-canonical-main-writer
  queue: max
  cancel-in-progress: false

env:
  STATMAKER_API_BUDGET_ENFORCE: "true"
  STATMAKER_API_BUDGET_TOKEN: ${{ github.token }}
  STATMAKER_API_BUDGET_POLICY: ${{ github.workspace }}/config/api_football_refresh_policy.json
  STATMAKER_API_BUDGET_PROFILE: background
  PYTHONPATH: ${{ github.workspace }}/scripts/api_budget_runtime:${{ github.workspace }}:${{ github.workspace }}/scripts

jobs:
  lineups:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[budget-policy-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none

      - name: Verify shared API budget guard before provider work
        run: |
          python -c "import urllib.request; assert getattr(urllib.request.urlopen, '_statmaker_budget', False), 'Shared provider budget guard is missing'"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate rolling lineup watcher
        run: |
          python -m py_compile \
            scripts/refresh_domestic_lineup_mappings.py \
            scripts/refresh_domestic_lineups.py

      - name: Refresh missing near-kickoff fixture mappings
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DOMESTIC_LINEUP_MAPPING_API_REQUEST_CAP: "1"
        run: python scripts/refresh_domestic_lineup_mappings.py

      - name: Refresh confirmed lineups and formations
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DOMESTIC_LINEUP_API_REQUEST_CAP: ${{ github.event_name == 'workflow_dispatch' && inputs.max_requests || '3' }}
        run: python scripts/refresh_domestic_lineups.py

      - name: Ignore timestamp-only odds rewrites
        shell: bash
        run: |
          set -euo pipefail
          odds="odds/odds_api_io/domestic_odds.json"
          if git diff --quiet -- "$odds"; then
            echo "Domestic odds unchanged."
            exit 0
          fi

          substantive="$({
            git diff --unified=0 -- "$odds" \
              | grep -E '^[+-]' \
              | grep -Ev '^(---|\+\+\+)' \
              | grep -v '"generatedAt"[[:space:]]*:'
          } || true)"
          if [ -z "$substantive" ]; then
            echo "Only volatile generatedAt values changed; restoring canonical odds artifact."
            git checkout -- "$odds"
          else
            echo "Substantive Domestic odds/context changes detected; keeping artifact update."
          fi

      - name: Rebuild app update manifest
        run: |
          python scripts/build_statmaker_update_manifest.py \
            --profile main \
            --branch main \
            --output data/statmaker/update_manifest.json

      - name: Validate hard request caps
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mapping = json.loads(Path('reports/domestic_lineup_mapping_watch.json').read_text(encoding='utf-8'))
          lineup = json.loads(Path('reports/domestic_lineup_watch.json').read_text(encoding='utf-8'))
          mapping_used = int(mapping.get('requestsUsed') or 0)
          mapping_cap = int(mapping.get('requestCap') or 0)
          lineup_used = int(lineup.get('requestsUsed') or 0)
          lineup_cap = int(lineup.get('requestCap') or 0)
          if mapping_used > mapping_cap:
            raise SystemExit(f'Lineup mapping request cap exceeded: {mapping_used}/{mapping_cap}')
          if lineup_used > lineup_cap:
            raise SystemExit(f'Lineup request cap exceeded: {lineup_used}/{lineup_cap}')
          print(
              f"Lineup mapping: calls={mapping_used}/{mapping_cap} "
              f"unmapped={mapping.get('nearKickoffUnmapped')} added={mapping.get('fixtureMappingsAdded')}"
          )
          print(
              f"Lineup watch: calls={lineup_used}/{lineup_cap} eligible={lineup.get('eligibleFixtures')} "
              f"confirmed={lineup.get('confirmedLineupsAdded')} formations={lineup.get('confirmedFormationPairsAdded')}"
          )
          PY

      - name: Commit lineup context artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            odds/odds_api_io/domestic_odds.json \
            data/statmaker/domestic_match_context_cache.json \
            data/statmaker/update_manifest.json \
            reports/domestic_lineup_mapping_watch.json \
            reports/domestic_lineup_watch.json
          if git diff --cached --quiet; then
            echo "No Domestic lineup-context changes."
          else
            git commit -m "Refresh Domestic confirmed lineups"
            # Preserve unpublished runner scratch; hash only the committed canonical tree.
            git stash push --include-untracked --message "Unpublished producer scratch"
            python .github/scripts/publish_generated_paths.py --rebuild-main-manifest \
              --path-prefix odds/odds_api_io/domestic_odds.json \
              --path-prefix data/statmaker/domestic_match_context_cache.json \
              --path-prefix data/statmaker/update_manifest.json \
              --path-prefix reports/domestic_lineup_mapping_watch.json \
              --path-prefix reports/domestic_lineup_watch.json
          fi
