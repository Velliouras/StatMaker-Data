name: Domestic Results Venue and Scorers Refresh

on:
  workflow_call:
    inputs:
      watchdog:
        type: boolean
        default: false
  schedule:
    # Two windows after European evening matches and the following morning.
    # 32 calls each, preserving the previous 64-call daily ceiling.
    - cron: '35 23 * * *'
    - cron: '10 7 * * *'
  workflow_run:
    # Recovery trigger if a scheduled refresh is skipped or delayed.
    # The stored window marker blocks duplicate provider requests.
    workflows: ["Domestic Lineup Watch"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/triggers/domestic-results-context-refresh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statmaker-canonical-main-writer
  queue: max
  cancel-in-progress: false

env:
  STATMAKER_API_BUDGET_ENFORCE: "true"
  STATMAKER_API_BUDGET_TOKEN: ${{ github.token }}
  STATMAKER_API_BUDGET_POLICY: ${{ github.workspace }}/config/api_football_refresh_policy.json
  STATMAKER_API_BUDGET_PROFILE: rolling
  WATCHDOG_REFRESH: ${{ inputs.watchdog }}
  PYTHONPATH: ${{ github.workspace }}/scripts/api_budget_runtime:${{ github.workspace }}:${{ github.workspace }}/scripts

jobs:
  refresh:
    if: ${{ inputs.watchdog || ((github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule' && (contains(github.event.workflow_run.run_started_at, 'T00:') || contains(github.event.workflow_run.run_started_at, 'T01:') || contains(github.event.workflow_run.run_started_at, 'T07:') || contains(github.event.workflow_run.run_started_at, 'T08:') || contains(github.event.workflow_run.run_started_at, 'T09:')))) && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[budget-policy-only]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /.github/scripts/publish_generated_paths.py
            /scripts/
            /tests/
            /config/
            /data/statmaker/domestic_enriched/index.json
            /data/statmaker/priority_refresh/
            /data/statmaker/schedule_scorers/
            /data/api_football/schedule_scorers/
      - name: Include selected current-season scorer archives
        run: python scripts/scorer_refresh_sources.py
      - name: Verify shared API budget guard before provider work
        run: |
          python -c "import urllib.request; assert getattr(urllib.request.urlopen, '_statmaker_budget', False), 'Shared provider budget guard is missing'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check window freshness before spending provider quota
        id: freshness
        shell: bash
        run: |
          args=()
          if [ "$WATCHDOG_REFRESH" = "true" ]; then args+=(--watchdog); fi
          python scripts/refresh_domestic_match_context.py --check-window "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Validate scorer refresh regression tests (offline)
        if: steps.freshness.outputs.refresh_needed == 'true'
        run: python -m unittest discover -s tests -p 'test_scorer_refresh_freshness.py' -v
      - name: Validate producer syntax and canonical plan
        if: steps.freshness.outputs.refresh_needed == 'true'
        run: |
          python -m py_compile scripts/refresh_domestic_match_context.py
          python scripts/refresh_domestic_match_context.py --max-requests 32 --quota-reserve 1500
      - name: Fetch actual venues and verified event scorers with strict budget
        if: steps.freshness.outputs.refresh_needed == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          test -n "$API_FOOTBALL_KEY" || { echo "Missing API_FOOTBALL_KEY"; exit 1; }
          args=()
          if [ "$WATCHDOG_REFRESH" = "true" ]; then args+=(--watchdog); fi
          python scripts/refresh_domestic_match_context.py --execute --max-requests 32 --quota-reserve 1500 "${args[@]}"
      - name: Validate read model before publication
        if: steps.freshness.outputs.refresh_needed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/statmaker/schedule_scorers/domestic_match_context.json').read_text())
          assert data['contract']=='statmaker-domestic-match-context-v1'
          assert data['schemaVersion']==1
          for v in data['fixtureVenues'].values():
              assert isinstance(v,str) and v.strip()
          assert all(x['fixtureId'] and x['team'] and x['player'] for x in data['goalEvents'])
          assert data['apiCallsDuringGeneration']<=32
          print('DOMESTIC_CONTEXT_OK',data['coverage'])
          PY
      - name: Publish only verified domestic match context
        if: steps.freshness.outputs.refresh_needed == 'true'
        run: |
          set -euo pipefail
          git config user.name "statmaker-data-bot"
          git config user.email "statmaker-data-bot@users.noreply.github.com"
          if [ -d data/api_football/schedule_scorers/events ]; then
            git add data/api_football/schedule_scorers/events/
          fi
          if [ -d data/api_football/schedule_scorers/fixtures ]; then
            git add data/api_football/schedule_scorers/fixtures/
          fi
          git add data/statmaker/schedule_scorers/domestic_match_context.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Domestic venues and scorer timelines [skip ci]"
            python .github/scripts/publish_generated_paths.py --path-prefix data/api_football/schedule_scorers/ --path-prefix data/statmaker/schedule_scorers/domestic_match_context.json
          fi
