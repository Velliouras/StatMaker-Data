name: Temporary T1 Canonical Inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-t1-canonical-inspect.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect T1 without provider calls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path('odds/odds_api_io/domestic_odds.json').read_text(encoding='utf-8-sig'))
          rows = [x for x in feed.get('leagues', []) if x.get('leagueCode') == 'T1']
          if len(rows) != 1:
              raise SystemExit(f'Expected one T1 canonical row, found {len(rows)}')
          league = rows[0]
          matches = [m for m in league.get('matches', []) if isinstance(m, dict)]
          payload = {
              'leagueCode': league.get('leagueCode'),
              'country': league.get('country'),
              'competition': league.get('competition'),
              'season': league.get('season'),
              'providerLeagueSlug': league.get('providerLeagueSlug'),
              'matchCount': len(matches),
              'bettableMatchCount': sum(1 for m in matches if m.get('markets')),
              'scheduleOnlyCount': sum(1 for m in matches if m.get('scheduleOnly') is True),
              'mappingStatuses': sorted({str(m.get('teamMappingStatus') or '') for m in matches}),
              'matches': [
                  {
                      'id': m.get('id') or m.get('matchId'),
                      'date': m.get('date'),
                      'kickoff': m.get('kickoff'),
                      'homeTeam': m.get('homeTeam'),
                      'awayTeam': m.get('awayTeam'),
                      'providerHomeTeam': m.get('providerHomeTeam'),
                      'providerAwayTeam': m.get('providerAwayTeam'),
                      'teamMappingStatus': m.get('teamMappingStatus'),
                      'scheduleOnly': m.get('scheduleOnly'),
                      'scheduleSource': m.get('scheduleSource'),
                      'marketCount': len(m.get('markets') or []),
                  }
                  for m in matches
              ],
          }
          out = Path('reports/temp_t1_canonical_inspect.json')
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/temp_t1_canonical_inspect.json
          git commit -m "Inspect canonical T1 feed state"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
