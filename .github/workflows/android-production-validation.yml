name: StatMaker Android Production Validation

on:
  workflow_dispatch:
    inputs:
      statmaker_ref:
        description: "StatMaker production ref"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".github/android-production-validation-request"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/android-production-validation-request
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve requested StatMaker ref
        id: source
        shell: bash
        env:
          DISPATCH_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.statmaker_ref || '' }}
        run: |
          set -euo pipefail
          ref="${DISPATCH_REF}"
          if [[ -z "$ref" ]]; then
            ref="$(sed -n '1p' .github/android-production-validation-request | tr -d '\r\n')"
          fi
          [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid StatMaker ref: $ref" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Require private read token
        env:
          TOKEN: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
        run: test -n "$TOKEN" || (echo "Missing STATMAKER_PRIVATE_READ_TOKEN" >&2; exit 1)

      - name: Checkout StatMaker production source
        uses: actions/checkout@v4
        with:
          repository: Velliouras/StatMaker
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ secrets.STATMAKER_PRIVATE_READ_TOKEN }}
          path: statmaker-prod
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Compile production Android sources
        working-directory: statmaker-prod
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2 \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Isolate focused regression sources
        working-directory: statmaker-prod
        shell: bash
        run: |
          set -euo pipefail
          find app/src/test -type f -name '*.kt' \
            ! -name 'DomesticCurrentMembershipTest.kt' \
            ! -name 'ModelPerformanceConfidenceTest.kt' \
            ! -name 'StreakKickoffWindowTest.kt' \
            ! -name 'StreakKickoffLocalizationTest.kt' \
            ! -name 'StreakPatternScannerBttsTest.kt' \
            ! -name 'StreakPatternScannerWdlTest.kt' \
            ! -name 'StreakPatternDiscoveryTest.kt' \
            ! -name 'ProductionBettingReleaseTest.kt' \
            ! -name 'AppReadyChannelRoutingTest.kt' \
            -delete

      - name: Run focused regression tests
        working-directory: statmaker-prod
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests "com.statmaker.app.DomesticCurrentMembershipTest" \
            --tests "com.statmaker.app.ModelPerformanceConfidenceTest" \
            --tests "com.statmaker.app.StreakKickoffWindowTest" \
            --tests "com.statmaker.app.StreakKickoffLocalizationTest" \
            --tests "com.statmaker.app.StreakPatternScannerBttsTest" \
            --tests "com.statmaker.app.StreakPatternScannerWdlTest" \
            --tests "com.statmaker.app.StreakPatternDiscoveryTest" \
            --tests "com.statmaker.app.ProductionBettingReleaseTest" \
            --tests "com.statmaker.app.AppReadyChannelRoutingTest" \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2 \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Report regression totals
        if: always()
        working-directory: statmaker-prod
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, '0'))
              for case in suite.iter('testcase'):
                  for tag in ('failure', 'error'):
                      node = case.find(tag)
                      if node is not None:
                          print(case.get('classname'), case.get('name'), (node.text or '')[:2000])
          print('PRODUCTION_REGRESSION_TOTALS', json.dumps(totals, sort_keys=True))
          PY
