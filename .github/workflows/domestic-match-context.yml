name: Domestic Match Context

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Maximum API-Football requests for match context"
        required: true
        default: "10"
        type: string
  schedule:
    # Runs 48 minutes after the existing 4-hour Domestic odds refresh window.
    - cron: "5 2,6,10,14,18,22 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/domestic-match-context.yml"
      - "scripts/enrich_domestic_match_context.py"
      - "scripts/refresh_domestic_lineups.py"
      - "scripts/refresh_domestic_squads.py"

permissions:
  contents: write

concurrency:
  # Serialize every workflow that writes canonical StatMaker main data.
  # One running writer at a time prevents manifest/data rebase collisions.
  group: statmaker-canonical-main-writer
  queue: max
  cancel-in-progress: false

env:
  STATMAKER_API_BUDGET_ENFORCE: "true"
  STATMAKER_API_BUDGET_TOKEN: ${{ github.token }}
  STATMAKER_API_BUDGET_POLICY: ${{ github.workspace }}/config/api_football_refresh_policy.json
  STATMAKER_API_BUDGET_PROFILE: rolling
  PYTHONPATH: ${{ github.workspace }}/scripts/api_budget_runtime:${{ github.workspace }}:${{ github.workspace }}/scripts

jobs:
  enrich:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[budget-policy-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none

      - name: Verify shared API budget guard before provider work
        run: |
          python -c "import urllib.request; assert getattr(urllib.request.urlopen, '_statmaker_budget', False), 'Shared provider budget guard is missing'"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate context enrichment
        run: |
          python -m py_compile \
            scripts/enrich_domestic_match_context.py \
            scripts/refresh_domestic_lineups.py \
            scripts/refresh_domestic_squads.py

      - name: Enrich injuries suspensions and confirmed lineups
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DOMESTIC_CONTEXT_API_REQUEST_CAP: ${{ github.event_name == 'workflow_dispatch' && inputs.max_requests || '10' }}
        run: python scripts/enrich_domestic_match_context.py

      - name: Re-attach cached formation context
        # Zero API calls. The 4-hour enrichment rebuilds squadContext, so restore any
        # confirmed formations already captured by the rolling lineup watcher.
        run: python scripts/refresh_domestic_lineups.py --attach-only

      - name: Re-attach cached squad continuity
        # Zero API calls. Preserve the low-frequency /players/squads snapshot across the
        # full context rebuild without coupling squad refresh frequency to the 4-hour job.
        run: python scripts/refresh_domestic_squads.py --attach-only

      - name: Rebuild app update manifest
        run: |
          python scripts/build_statmaker_update_manifest.py \
            --profile main \
            --branch main \
            --output data/statmaker/update_manifest.json

      - name: Commit context artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            odds/odds_api_io/domestic_odds.json \
            data/statmaker/domestic_match_context_cache.json \
            data/statmaker/update_manifest.json \
            reports/domestic_match_context_enrichment.json \
            reports/domestic_lineup_watch.json \
            reports/domestic_squad_context.json
          if git diff --cached --quiet; then
            echo "No Domestic match-context changes."
          else
            git commit -m "Refresh Domestic match context"
            # Preserve unpublished runner scratch; hash only the committed canonical tree.
            git stash push --include-untracked --message "Unpublished producer scratch"
            python .github/scripts/publish_generated_paths.py --rebuild-main-manifest \
              --path-prefix odds/odds_api_io/domestic_odds.json \
              --path-prefix data/statmaker/domestic_match_context_cache.json \
              --path-prefix data/statmaker/update_manifest.json \
              --path-prefix reports/domestic_match_context_enrichment.json \
              --path-prefix reports/domestic_lineup_watch.json \
              --path-prefix reports/domestic_squad_context.json
          fi
