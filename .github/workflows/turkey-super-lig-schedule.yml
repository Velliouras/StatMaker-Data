name: Turkey Super Lig Schedule Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/turkey-super-lig-schedule.yml"
      - "scripts/refresh_turkey_super_lig_schedule.py"
      - "tests/test_refresh_turkey_super_lig_schedule.py"
      - "scripts/refresh_domestic_odds_schedule_priority.py"

permissions:
  contents: write

concurrency:
  # Serialize every workflow that writes canonical StatMaker main data.
  # One running writer at a time prevents manifest/data rebase collisions.
  group: statmaker-canonical-main-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Turkey schedule regressions
        run: |
          python -m py_compile \
            scripts/refresh_turkey_super_lig_schedule.py \
            scripts/refresh_domestic_odds_schedule_priority.py
          python -m unittest tests/test_refresh_turkey_super_lig_schedule.py

      - name: Sync official Turkey Super Lig schedule
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          T1_SCHEDULE_HORIZON_DAYS: "21"
        run: python scripts/refresh_turkey_super_lig_schedule.py

      - name: Sanitize Domestic markets without dropping schedule-only fixtures
        run: |
          python scripts/odds_market_integrity.py \
            odds/odds_api_io/domestic_odds.json \
            --write \
            --report-dir reports

      - name: Verify T1 schedule publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path('odds/odds_api_io/domestic_odds.json').read_text(encoding='utf-8-sig'))
          league = next((x for x in feed.get('leagues', []) if x.get('leagueCode') == 'T1'), None)
          if league is None:
              raise SystemExit('T1 missing from canonical Domestic feed')
          if str(league.get('providerLeagueSlug') or '').strip():
              raise SystemExit('Unexpected T1 provider slug')
          schedule = [
              m for m in league.get('matches', [])
              if m.get('scheduleOnly') is True
              and m.get('scheduleVerified') is True
              and m.get('scheduleSource') == 'api-football'
              and not (m.get('markets') or [])
          ]
          report = json.loads(Path('reports/turkey_super_lig_schedule_sync.json').read_text(encoding='utf-8-sig'))
          if report.get('officialFixtures', 0) > 0 and not schedule:
              raise SystemExit('Official T1 fixtures were fetched but not preserved in canonical feed')
          print(f"T1_SCHEDULE_OK official={report.get('officialFixtures', 0)} published_schedule_only={len(schedule)}")
          PY

      - name: Build Domestic update manifest
        run: |
          python scripts/build_statmaker_update_manifest.py \
            --profile main \
            --branch main \
            --output data/statmaker/update_manifest.json

      - name: Commit Turkey schedule artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            odds/odds_api_io/domestic_odds.json \
            data/statmaker/update_manifest.json \
            reports/turkey_super_lig_schedule_sync.json \
            reports/domestic_odds_integrity.json
          if git diff --cached --quiet; then
            echo "No Turkey schedule changes."
          else
            git commit -m "Refresh Turkey Super Lig official schedule"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              echo "Concurrent Domestic writer detected; deferring Turkey schedule artifact commit to the next scheduled run."
              exit 0
            fi
            # The producer may have rebased over another canonical writer. Rebuild the
            # deterministic manifest now so it describes the exact tree being pushed.
            python scripts/build_statmaker_update_manifest.py \
              --profile main \
              --branch main \
              --output data/statmaker/update_manifest.json
            git add data/statmaker/update_manifest.json
            if ! git diff --cached --quiet; then
              git commit -m "Rebuild main manifest after producer rebase"
            fi
            if ! git push origin HEAD:main; then
              echo "Concurrent Domestic writer advanced main after rebase; deferring Turkey schedule artifacts to the next scheduled run."
              exit 0
            fi
          fi

# manual trigger after removing stale simulated-reality T1 slug on 2026-08-14
