name: Turkey Super Lig Schedule Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/turkey-super-lig-schedule.yml"
      - "scripts/refresh_turkey_super_lig_schedule.py"
      - "tests/test_refresh_turkey_super_lig_schedule.py"
      - "scripts/refresh_domestic_odds_schedule_priority.py"

permissions:
  contents: write

concurrency:
  # Serialize every workflow that writes canonical StatMaker main data.
  # One running writer at a time prevents manifest/data rebase collisions.
  group: statmaker-canonical-main-writer
  queue: max
  cancel-in-progress: false

env:
  STATMAKER_API_BUDGET_ENFORCE: "true"
  STATMAKER_API_BUDGET_TOKEN: ${{ github.token }}
  STATMAKER_API_BUDGET_POLICY: ${{ github.workspace }}/config/api_football_refresh_policy.json
  STATMAKER_API_BUDGET_PROFILE: rolling
  PYTHONPATH: ${{ github.workspace }}/scripts/api_budget_runtime:${{ github.workspace }}:${{ github.workspace }}/scripts

jobs:
  sync:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[budget-policy-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify shared API budget guard before provider work
        run: |
          python -c "import urllib.request; assert getattr(urllib.request.urlopen, '_statmaker_budget', False), 'Shared provider budget guard is missing'"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Turkey schedule regressions
        run: |
          python -m py_compile \
            scripts/refresh_turkey_super_lig_schedule.py \
            scripts/refresh_domestic_odds_schedule_priority.py
          python -m unittest tests/test_refresh_turkey_super_lig_schedule.py

      - name: Sync official Turkey Super Lig schedule
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          T1_SCHEDULE_HORIZON_DAYS: "21"
        run: python scripts/refresh_turkey_super_lig_schedule.py

      - name: Sanitize Domestic markets without dropping schedule-only fixtures
        run: |
          python scripts/odds_market_integrity.py \
            odds/odds_api_io/domestic_odds.json \
            --write \
            --report-dir reports

      - name: Verify T1 schedule publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path('odds/odds_api_io/domestic_odds.json').read_text(encoding='utf-8-sig'))
          league = next((x for x in feed.get('leagues', []) if x.get('leagueCode') == 'T1'), None)
          if league is None:
              raise SystemExit('T1 missing from canonical Domestic feed')
          # A real exact-odds provider may attach a verified slug after the
          # original schedule-only T1 integration. Verify it is unchanged,
          # rather than rejecting its existence or blanking it.
          import subprocess
          previous = json.loads(subprocess.check_output([
              'git', 'show', 'HEAD:odds/odds_api_io/domestic_odds.json'
          ]).decode('utf-8-sig'))
          old_league = next(
              (x for x in previous.get('leagues', []) if x.get('leagueCode') == 'T1'),
              None
          )
          prior_slug = (old_league or {}).get('providerLeagueSlug')
          if league.get('providerLeagueSlug') != prior_slug:
              raise SystemExit('T1 verified provider slug was modified')
          schedule = [
              m for m in league.get('matches', [])
              if m.get('scheduleOnly') is True
              and m.get('scheduleVerified') is True
              and m.get('scheduleSource') == 'api-football'
              and not (m.get('markets') or [])
          ]
          report = json.loads(Path('reports/turkey_super_lig_schedule_sync.json').read_text(encoding='utf-8-sig'))
          if report.get('officialFixtures', 0) > 0 and not schedule and not report.get('preservedBettable', 0):
              raise SystemExit('Official T1 fixtures were fetched but not preserved in canonical feed')
          if report.get('providerLeagueSlug') != prior_slug:
              raise SystemExit('T1 report lost provider slug')
          if bool(report.get('providerLeagueSlugPreserved')) != bool(str(prior_slug or '').strip()):
              raise SystemExit('T1 verified provider slug audit flag mismatch')
          # Existing priced bookmaker fixtures are not allowed to disappear.
          if old_league is not None:
              prior_priced = {
                  str(m.get('id') or m.get('matchId') or ''): m
                  for m in old_league.get('matches', []) if m.get('markets')
              }
              present_priced = {
                  str(m.get('id') or m.get('matchId') or ''): m
                  for m in league.get('matches', []) if m.get('markets')
              }
              if not all(key in present_priced for key in prior_priced):
                  raise SystemExit('T1 existing bookmaker-priced match missing')
          print(f"T1_SCHEDULE_OK official={report.get('officialFixtures', 0)} published_schedule_only={len(schedule)} verified_provider_slug_preserved={bool(prior_slug)}")
          PY

      - name: Build Domestic update manifest
        run: |
          python scripts/build_statmaker_update_manifest.py \
            --profile main \
            --branch main \
            --output data/statmaker/update_manifest.json

      - name: Commit Turkey schedule artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            odds/odds_api_io/domestic_odds.json \
            data/statmaker/update_manifest.json \
            reports/turkey_super_lig_schedule_sync.json \
            reports/domestic_odds_integrity.json
          if git diff --cached --quiet; then
            echo "No Turkey schedule changes."
          else
            git commit -m "Refresh Turkey Super Lig official schedule"
            # Preserve unpublished runner scratch; hash only the committed canonical tree.
            git stash push --include-untracked --message "Unpublished producer scratch"
            python .github/scripts/publish_generated_paths.py --rebuild-main-manifest \
              --path-prefix odds/odds_api_io/domestic_odds.json \
              --path-prefix data/statmaker/update_manifest.json \
              --path-prefix reports/turkey_super_lig_schedule_sync.json \
              --path-prefix reports/domestic_odds_integrity.json
          fi

# manual trigger after removing stale simulated-reality T1 slug on 2026-08-14
