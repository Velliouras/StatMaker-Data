name: Update Betsson World Cup Odds

on:
  workflow_dispatch:
  schedule:
    # Daily probe. Keep odds scraping outside the Android app.
    - cron: "18 8 * * *"

permissions:
  contents: write

jobs:
  update-betsson-wc-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Scrape Betsson World Cup odds
        run: python scripts/scrape_betsson_wc_odds.py

      - name: Commit updated odds if changed
        run: |
          if git diff --quiet -- odds/betsson/world_cup_odds.json odds/betsson/debug_report.json odds/betsson/betsson_probe_snapshot.txt; then
            echo "No Betsson odds changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds/betsson/world_cup_odds.json odds/betsson/debug_report.json odds/betsson/betsson_probe_snapshot.txt
          git commit -m "Update Betsson World Cup odds"
          git push
