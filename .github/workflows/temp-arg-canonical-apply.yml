name: Temporary ARG Canonical Apply

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-arg-canonical-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply only verified ARG canonical repairs
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import copy
          import datetime as dt
          import json
          from pathlib import Path
          import domestic_live_july_pipeline as pipeline
          import refresh_domestic_live_july_odds as target

          path = Path('odds/odds_api_io/domestic_odds.json')
          feed = json.loads(path.read_text(encoding='utf-8-sig'))
          registry = pipeline.load_json(pipeline.REGISTRY_PATH, {}).get('leagues', [])
          aliases = pipeline.generated_aliases(registry)

          arg_positions = [i for i, row in enumerate(feed.get('leagues', [])) if row.get('leagueCode') == 'ARG']
          if len(arg_positions) != 1:
              raise SystemExit(f'Expected exactly one ARG canonical league row, found {len(arg_positions)}')
          idx = arg_positions[0]
          arg_before = copy.deepcopy(feed['leagues'][idx])
          scoped = {'leagues': [copy.deepcopy(arg_before)]}
          repaired = target.recanonicalize_stale_team_mappings(scoped, aliases)
          if repaired != 7:
              raise SystemExit(f'Expected to repair exactly 7 stale ARG matches, repaired {repaired}')

          arg_after = scoped['leagues'][0]
          unresolved = [
              m for m in arg_after.get('matches', [])
              if m.get('teamMappingStatus') != 'matched' or m.get('usableForStats') is not True
          ]
          if unresolved:
              raise SystemExit(f'ARG still contains unresolved canonical mappings: {len(unresolved)}')

          arg_registry = [row for row in registry if row.get('leagueCode') == 'ARG']
          validation = target.validate_feed({'leagues': [arg_after]}, arg_registry, dt.date(2026, 8, 14))
          if validation.get('matchCount') != len(arg_after.get('matches', [])):
              raise SystemExit('ARG scoped validation match count mismatch')

          feed['leagues'][idx] = arg_after
          path.write_text(json.dumps(feed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'ARG_CANONICAL_REPAIR_OK': True,
              'repaired': repaired,
              'matchCount': validation.get('matchCount'),
              'marketCount': validation.get('marketCount'),
          }, indent=2))
          PY
      - name: Build update manifest
        run: |
          python scripts/build_statmaker_update_manifest.py \
            --profile main \
            --branch main \
            --output data/statmaker/update_manifest.json
      - name: Commit ARG canonical data fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add odds/odds_api_io/domestic_odds.json data/statmaker/update_manifest.json
          git commit -m "Apply verified Argentina canonical team mappings"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
