name: Probe International Odds Sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-odds-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Probe international odds sources
        run: python scripts/probe_odds_sources.py

      - name: Commit odds source probe output if changed
        run: |
          if git diff --quiet -- odds/probe/odds_sources_report.json odds/probe/source_snapshots; then
            echo "No odds source probe changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds/probe/odds_sources_report.json odds/probe/source_snapshots
          git commit -m "Update international odds source probe"
          git push
