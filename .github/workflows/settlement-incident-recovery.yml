name: Settlement Incident Recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/settlement-incident-recovery.yml']
permissions:
  contents: read
  actions: write
jobs:
  recover-before-provider-work:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const targets=[
              {id:41089203591,sha:'92b3cd15e7a3c1e4d0e078e1e7ae6d82181ecee6',workflow:'live-settlement-publisher.yml',cap:'80'},
              {id:41089318494,sha:'ae60fb793d66df5a7ebde89f905419a8f979666e',workflow:'model-performance-settlement-refresh.yml',cap:'120'}
            ];
            for (const target of targets) {
              let run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:target.id})).data;
              if (run.head_sha!==target.sha || !run.path.endsWith('/'+target.workflow)) throw new Error('Unexpected recovery target');
              if (run.status==='completed') { core.info('ALREADY_COMPLETED '+target.id+' '+run.conclusion); continue; }
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:target.id,per_page:100});
              const started=jobs.flatMap(j=>j.steps||[]).filter(s=>s.status!=='queued'&&s.conclusion!=='skipped');
              if (started.some(s=>!['Set up job','Checkout repository'].includes(s.name))) {
                core.info('PRESERVED_STARTED_PRODUCER '+target.id); continue;
              }
              await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:target.id});
              for (let i=0;i<20;i++) {
                run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:target.id})).data;
                if (run.status==='completed') break;
                await new Promise(resolve=>setTimeout(resolve,1000));
              }
              if (run.status!=='completed') throw new Error('Cancellation not yet complete; refusing duplicate provider work');
              core.info('CANCELLED_BEFORE_PROVIDER '+target.id);
              await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:target.workflow,ref:'main',inputs:{max_requests:target.cap}});
              core.info('DISPATCHED_CURRENT_BOUNDED_PRODUCER '+target.workflow+' cap='+target.cap);
            }
