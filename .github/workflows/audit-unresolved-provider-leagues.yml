name: Audit Unresolved Provider Leagues

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-unresolved-provider-leagues.yml"
      - ".unresolved-provider-audit-trigger"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile scripts/audit_unresolved_provider_leagues.py
      - name: Audit unresolved provider league names
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: python scripts/audit_unresolved_provider_leagues.py
      - name: Guard generated paths
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          [ "$changed" = "reports/unresolved_provider_leagues.json" ] || {
            echo "Unexpected generated changes"; exit 1;
          }
      - name: Commit provider catalog audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/unresolved_provider_leagues.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Audit unresolved Domestic provider leagues"
            git pull --rebase
            git push
          fi
