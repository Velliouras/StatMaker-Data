name: Apply Verified Domestic Mappings

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".mapping-apply-trigger"

permissions:
  contents: write

concurrency:
  group: apply-verified-domestic-mappings
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate mapping apply script
        run: python -m py_compile scripts/apply_verified_domestic_mappings.py

      - name: Apply verified league and team mappings
        run: python scripts/apply_verified_domestic_mappings.py

      - name: Guard changed paths
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              config/domestic_leagues.json|mappings/domestic_team_aliases.json|reports/domestic_mapping_apply.json)
                ;;
              *)
                echo "Unexpected generated change: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"

      - name: Commit verified mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/domestic_leagues.json mappings/domestic_team_aliases.json reports/domestic_mapping_apply.json
          if git diff --cached --quiet; then
            echo "No verified mapping changes to commit."
          else
            git commit -m "Apply verified Domestic league and team mappings"
            git pull --rebase
            git push
          fi
